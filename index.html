cal", "s": "Which cytokine has a role in pathogenesis of acne?", "c": "Interleukin- 1 alpha", "d": ["Interferon alpha", "Transforming growth factor beta", "Tumor necrosis factor alpha Answers"], "e": "IL-1 alpha: key cytokine in early follicular hyperkeratinization and acne inflammation.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is added to the active ingredient to form a gel?", "c": "Methyl cellulose", "d": ["Methyl ethylene", "Methyl propanoate", "Methyl acetate"], "e": "Methyl cellulose is a gelling agent, mixed with the active drug and water to make gels.", "src": "", "dz": "dx", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What distinguishes a cyst from a bulla?", "c": "The presence of epithelial lining", "d": ["The location on the body", "The size of the lesion", "The type of fluid inside"], "e": "A true cyst has an epithelial lining. A bulla is only fluid under or inside the epidermis.", "src": "", "dz": "les", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which feature separates tinea cruris from erythrasma in the groin?", "c": "Raised scaly advancing border", "d": ["Coral-red fluorescence under Wood light", "Brown patches with no raised edge", "Response to erythromycin"], "e": "Tinea cruris has a raised active scaly border. Erythrasma has no raised edge and glows coral red.", "src": "", "dz": "tcr", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Single or few coin-shaped plaques on the limbs of a young atopic adult. Diagnosis?", "c": "Nummular eczema", "d": ["Tinea corporis", "Pityriasis rosea", "Pityriasis versicolor"], "e": "Coin-shaped discoid plaques on the limbs of young adults, mostly atopic.", "src": "", "dz": "num", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Sudden deep itchy tapioca-like vesicles on the sides of the fingers, palms and soles with recurrent attacks. Diagnosis?", "c": "Dyshidrotic eczema (pompholyx)", "d": ["Tinea manuum", " uns in families:", "c": "True", "d": ["False"], "e": "Family history raises risk because gland size and activity are inherited.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "Which is not major in acne formation?", "c": "Alopecia", "d": ["Follicular hyper keratinization", "Inflammation", "Hormonal influences"], "e": "The four pillars: follicular hyperkeratinization, androgen-driven sebum, C. acnes and inflammation.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "Regarding the pathogenesis of acne the hyperkeratotic plug is formed due to:", "c": "Both A and B", "d": ["Excess follicular keratinocyte proliferation", "Corneocyte cohesiveness"], "e": "Hyperproliferation plus sticky corneocytes block the follicle and form the microcomedo.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "The interleukin (IL) responsible for hyperkeratinzation:", "c": "IL-1", "d": ["IL-2", "IL-8", "None of the above"], "e": "IL-1 alpha drives follicular hyperkeratinization (microcomedo).", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "The interleukin (IL) responsible for neutrophil recruitment:", "c": "IL-8", "d": ["IL-1", "IL-2", "None of the above"], "e": "C. acnes acts on TLR2, which raises IL-1 alpha, IL-8, IL-12 and TNF-alpha.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "True or False: Microcomedo is the precursor of all clinically apparent acne.:", "c": "True", "d": ["False"], "e": "The microcomedo is the first lesion. It becomes a closed or open comedone or an inflammatory lesion.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "Regarding the pathogenesis of acne the sebaceous glands are primarily controlled by:", "c": "Androgens", "d": ["Estrogens", "Cortisol", "None of the above"], "e": "Androgens (mainly DHT) stimulate sebaceous gland size and sebum output.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "True or false: Testosterone is the most potent androgen:", "c": "False", "d": ["True"], "e": "DHT is the most potent androgen, about 5-10 times testosterone.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "The most severe form of acne is:", "c": "Acne fulminans", "d": ["Acne conglobate", "Acne excoriee"], "e": "Fulminans has acute painful ulcerative nodules with fever and systemic signs.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "True or false: Acne prone skin has lower androgen receptors lower 5 alpha reductase activity:", "c": "False", "d": ["True"], "e": "Acne-prone skin has higher receptor numbers and higher 5-alpha-reductase activity, even with normal testosterone.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "Androgen receptors are found in the cells:", "c": "All of the above", "d": ["Of basal layer of sebaceous gland", "Outer root sheath of the hair follicle"], "e": "Receptors sit in the basal layer of the sebaceous gland and the outer root sheath of the follicle.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "True or false: P. acnes is a Gram-positive motile rod:", "c": "False", "d": ["True"], "e": "It is a Gram-positive rod, non-motile, found deep in the follicle.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "All of the following are types of acne except:", "c": "Pustular", "d": ["Acne excoriee", "Acne fulminans"], "e": "Named variants: fulminans, conglobata, excoriee, neonatal, infantile, drug-induced, occupational.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Acne vulgaris is:", "c": "All of the above", "d": ["A disease of the pilosebaceous apparatus", "A disease which commonly affects the face", ase IL-1 alpha, IL-8, IL-12 and TNF-alpha.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Fate of Acne Vulgaris:", "c": "All of the above", "d": ["Erythema", "Post-inflammatory hyperpigmentation", "Scarring"], "e": "Sequelae: pitted or hypertrophic scars, post-inflammatory erythema and pigmentation.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "All of the following is true about the scarring (fate of acne vulgaris) except:", "c": "Most commonly on the face", "d": ["Can be pitted or hypertrophic", "Often as a sequela of nodulocystic acne"], "e": "Scars come from nodulocystic acne and can be pitted or hypertrophic.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "True or false: Acne Fulminans primarily affects adolescent males aged 13-22 years.", "c": "True", "d": ["False"], "e": "Fulminans: males 13-22.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "True about Acne Fulminans:", "c": "All of the above", "d": ["Acute onset", "Painful", "Destructive", "Ulcerative nodules", "With hemorrhagic crusts on the face, chest and back"], "e": "Acute painful ulcerative nodules with hemorrhagic crusts, destructive, with systemic signs.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Systemic manifestations of Acne Fulminans include all except:", "c": "Vomiting", "d": ["Fever", "Weight loss", "Musculoskeletal Pain"], "e": "Fulminans: fever, weight loss, joint pain, leukocytosis, high ESR and CRP. Vomiting is not a feature.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Treatment of Acne Fulminans include:", "c": "All of the above", "d": ["Oral steroids", "Antibiotics", "Isotretinoin"], "e": "Oral steroid, antibiotic and isotretinoin together.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "True or false: neonatal acne appears at about 2 weeks of age and resolves within 3 weeks.", "c": "False", "d": ["True"], "e": "Neonatal acne appears at about 2 weeks (papulopustules, no comedones, Malassezia).", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "True about infantile acne:", "c": "All of the above", "d": ["Presents with 3-12 months of age", "Usually resolves with 1-2 years", "Treated with topical tretinoin and benzoyl peroxide"], "e": "Infantile acne: age 3-12 months, comedones, can scar. Treat with tretinoin plus benzoyl peroxide.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Treatment of Acne excoriee:", "c": "Antidepressants or psychotherapy", "d": ["Topical steroids", "Oral steroids", "Oral antibiotics"], "e": "Acne excoriee is picking with anxiety or OCD, so treat the psychiatric side.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "True about Acne excoriee", "c": "Is associated with a anxiety and depression", "d": ["Occurs in old women"], "e": "It occurs in young women who pick their lesions.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "True statement about laser resurfacing in acne:", "c": "Used in Rx of pox scars in acne", "d": ["Prevents scarring in nodulocystic type", "Antiandrogenic and antibacterial"], "e": "Laser resurfacing treats existing pitted scars. It does not prevent them and is not an anti-androgen or antibacterial.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Benzoyl peroxide is used in the treatment of:", "c": "Infantile Acne", "d": ["Animal scabies", "Pediculosis capitis"], "e": "Infantile acne: tretinoin plus benzoyl peroxide. Benzoyl peroxide is bactericidal.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Vulgaris means:", "c": "Common", "d": ["Serious", "Easily treated", "All of the above"], "e try tests nerve (vibration) function. Cavernosometry and cavernosography test venous leak.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "22M, ED and lack of sexual desire, unremarkable history, stable relationship, no tobacco, alcohol or drugs. Height 188 cm, weight 88 kg. Bilateral gynecomastia, sparse facial hair, small firm testes, normal penis size, normal peripheral vision. He would most benefit from:", "c": "Testosterone", "d": ["Aromatase inhibitor", "Gonadotropin", "Phosphodiesterase 5 inhibitor", "Selective estrogen receptor modulator"], "e": "Tall, gynecomastia and small firm testes suggest Klinefelter with hypogonadism, so replace testosterone.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which tool is used for assessment of penile rigidity and tumescence?", "c": "Rigiscan", "d": ["Stamp test", "Snap gauge", "Elif"], "e": "RigiScan records nocturnal tumescence and rigidity. Normal rigidity is over 70%.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "All the following circumstances are associated with psychogenic erectile dysfunction EXCEPT:", "c": "Gradual onset", "d": ["Relationship conflict", "Major life crisis", "Situational", "Presence of morning erection"], "e": "Psychogenic ED: acute onset, situational, normal morning erections.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Most selective phosphodiesterase inhibitor:", "c": "Avanafil", "d": ["Sildenafil", "Tadalafil"], "e": "Avanafil is the most selective for PDE-5. Tadalafil is the longest acting.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "All the following tests measure presence or absence of nocturnal penile tumescence and rigidity EXCEPT:", "c": "Cavernostomy", "d": ["Stamp test", "Rigiscan", "Snap gauge"], "e": "Stamp test, snap gauge and RigiScan test nocturnal tumescence.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "The best investigation for arteriogenic erectile dysfunction is:", "c": "Penile duplex U/S", "d": ["Cavernosography", "Penile blood pressure"], "e": "Duplex ultrasound shows arterial flow. Normal: peak systolic velocity over 30, end diastolic velocity zero.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Sildenafil acts by:", "c": "Increasing cGMP", "d": ["Increasing Calcium in endoplasmic reticulum", "Increasing prostaglandins"], "e": "PDE-5 inhibitors block cGMP breakdown, so cGMP rises and smooth muscle relaxes.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "The major neurotransmitter responsible for erection:", "c": "Nitric oxide", "d": ["VIP", "Acetylcholine"], "e": "NO from nerves and endothelium raises cGMP. VIP and acetylcholine help.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which is used to assess neurogenic ED?", "c": "Bulbocavernosus-evoked response test", "d": ["Stamp test", "Penile duplex U/S"], "e": "The bulbocavernosus reflex tests the sacral nerve arc. CHECK: the page mentions the bulbocavernosus reflex only under physiology.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Erectile dysfunction is defined as:", "c": "Inability to achieve & maintain erection adequate for intercourse to mutual satisfaction of male & partner", "d": ["A decrease in libido", "Inability to achieve orgasm"], "e": "ED is failure to achieve and keep an erection adequate for intercourse.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}];const DZ={"D": {"psoriasis": {"n": "Psoriasis", "c": "disease", "pg": "", "sum": "Chronic immune-mediated disease of skin and joints. Th1/Th17 cytokines (IL-17, 12, 23, 22), turnover 2-3 days instead of 28. Silvery scale plaques, Auspitz sign, Koebner, oil drop nail. Topical steroid plus calcipotriene for under 5% BSA. No oral steroids.", "rows": {"Lesion": "Plaque (80-90%): well-demarcated symmetric erythematous plaques with silvery scale; 80% mild to moderate (under 5% BSA). Guttate: raindrop lesions on trunk and limbs after streptococcal pharyngitis, good prognosis. Inverse (flexural): smooth red patches in folds without scale. Erythrodermic: the worst type, nearly all skin, fever, chills, edema, hypoalbuminemia, may need hospital. Pustular: sterile neutrophil pustules, triggered by steroid withdrawal, generalized (von Zumbusch) can be life-threatening, or palmoplantar. Palmoplantar: plaque or pustular, disabling, same look as reactive arthritis skin lesions.", "Sites": "Scalp, elbows, knees, sacrum. Scalp psoriasis about 50%. Oral: geographic-like red patches with yellow-white borders, ulcers, desquamating gingivitis, pustules (pustular type). Psoriatic arthritis in about 30%, ages 30-50, a seronegative spondyloarthropathy.", "Key sign": "Auspitz sign: bleeding after scale removal (dilated superficial vessels, thin suprapapillary ridges). Koebner phenomenon. Dermoscopy: white scale over red dotted (glomerular) vessels. Psoriatic arthritis: DIP joints and dactylitis are the most distinctive, enthesitis, stiffness worse after rest, pencil-in-cup on x-ray.", "Histology": "Diagnostic. Parakeratosis, neutrophils in the stratum corneum (Munro microabscess), absent granular layer, acanthosis with elongated rete ridges (test-tube) and thin suprapapillary plates, dilated tortuous capillaries in raised edematous papillae, mixed mononuclear infiltrate.", "Trigger / link": "Two onset peaks 20-30 and 50-60 years; 30% have a first-degree relative. Activated Th1 and Th17 cells. Epidermal turnover 2-3 days. Triggers and worsening drugs: systemic steroid or steroid withdrawal, beta blockers, ACE inhibitors, lithium, aspirin and antimalarials, interferons, NSAIDs, sulfa drugs, streptococcal infection. Comorbidity: cardiovascular risk, obesity (BMI tracks severity).", "Mouth / nails": "Fingernails 50%, toenails 35%, can occur in any type, common with DIP arthritis. Pitting, onycholysis, subungual hyperkeratosis, oil drop sign (most specific), trachyonychia. DDx of pitting: psoriasis and alopecia areata.", "Course": "Chronic, waxes and wanes, few spontaneous remissions, lifelong. DDx: seborrheic dermatitis, eczema, pityriasis rosea, lichen planus, tinea, pityriasis rubra pilaris, secondary syphilis, drug eruption.", "Treatment": "Under 5% BSA: topical. First line high-potency steroid alone or in rotation with calcipotriene (vitamin D analog; may be used with UVB). Others: tazarotene (best with steroid), coal tar, calcineurin inhibitors (face and folds). Steroid side effects: atrophy, telangiectasia, striae, acne, folliculitis, purpura. Systemic for moderate to severe, hard sites (scalp, face, genitals, nails, palmoplantar) or arthritis: NB-UVB, BB-UVB or PUVA (20-25 sessions, 2-3 times a week); methotrexate 7.5-25 mg weekly (liver monitoring, teratogenic), acitretin (lipids), cyclosporine 2.5-5 mg/kg/day (renal function), azathioprine, apremilast; biologics: TNF inhibitors (etanercept, adalimumab, infliximab), ustekinumab (IL-12/23), secukinumab (IL-17). Pregnancy: phototherapy. Oral steroids never, except pregnant women with pustular psoriasis."}, "g": "paps", "bk": 1, "rs": {"Lesion": "Plaque 80-90%: red plaques, silvery scale. Erythrodermic worst; pustular von Zumbusch can kill.", "Sites": "Scalp, elbows, knees, sacrum. Nails 50%. Arthritis about 30%.", "Key sign": "Auspitz sign (bleeding on scale removal), Koebner. DIP and dactylitis in arthritis.", "Histology": "Parakeratosis, Munro microabscess, no granular layer, test-tube rete ridges.", "Trigger / link": "Th1/Th17, turnover 2-3 days. Triggers: steroid withdrawal, beta blockers, lithium, strep.", "Mouth / nails": "Pitting, onycholysis, oil drop (most specific). Pitting DDx: alopecia areata.", "Course": "Chronic, relapsing, lifelong. DDx: seborrheic dermatitis, pityriasis rosea, lichen planus, tinea.", "Treatment": "Under 5% BSA: steroid plus calcipotriene. Severe: NB-UVB, methotrexate, biologics. No oral steroids."}, "rb": {"Lesion": ["Plaque (80-90%): sharp symmetric red plaques, silvery scale; 80% mild-moderate (<5% BSA)", "Guttate: raindrop lesions on trunk and limbs after strep pharyngitis; good prognosis", "Inverse: smooth red patches in folds, no scale", "Erythrodermic: worst type, nearly all skin; fever, chills, edema, low albumin; may need admission", "Pustular: sterile neutrophil pustules; triggered by steroid withdrawal; generalized (von Zumbusch) can be life-threatening; or palmoplantar", "Palmoplantar: plaque or pustular, disabling; looks like reactive arthritis skin lesions"], "Sites": ["Scalp, elbows, knees, sacrum; scalp about 50%", "Oral: geographic-like red patches with yellow-white borders, ulcers, desquamating gingivitis, pustules (pustular type)", "Psoriatic arthritis about 30%, age 30-50, seronegative spondyloarthropathy"], "Key sign": ["Auspitz: pinpoint bleeding after scale removal (dilated vessels, thin suprapapillary plates)", "Koebner phenomenon", "Dermoscopy: white scale over red dotted vessels", "Arthritis: DIP and dactylitis most distinctive; enthesitis; stiffness worse after rest; pencil-in-cup on x-ray"], "Histology": ["Parakeratosis; neutrophils in stratum corneum (Munro microabscess)", "No granular layer; acanthosis, elongated test-tube rete ridges, thin suprapapillary plates", "Dilated tortuous capillaries in edematous papillae; mixed mononuclear infiltrate"], "Trigger / link": ["Onset peaks 20-30 and 50-60 years; 30% have an affected first-degree relative", "Th1/Th17 activation; epidermal turnover 2-3 days", "Triggers: strep infection, steroid withdrawal, beta blockers, ACE inhibitors, lithium, aspirin, antimalarials, interferons, NSAIDs, sulfa drugs. Mnemonic: BALI NAC (Beta-blockers, Antimalarials, Lithium, Interferons, NSAIDs, Aspirin, Corticosteroid withdrawal)", "Comorbid: cardiovascular risk, obesity (BMI tracks severity)"], "Mouth / nails": ["Fingernails 50%, toenails 35%, any type; common with DIP arthritis", "Pitting, onycholysis, subungual hyperkeratosis, trachyonychia", "Oil drop sign: most specific", "Pitting DDx: alopecia areata"], "Course": ["Chronic, waxing and waning, few remissions, lifelong", "DDx: seborrheic dermatitis, eczema, pityriasis rosea, lichen planus, tinea, PRP, secondary syphilis, drug eruption"], "Treatment": ["<5% BSA: topical. High-potency steroid alone or rotated with calcipotriene (vitamin D; can combine with UVB)", "Others: tazarotene (best with steroid), coal tar, calcineurin inhibitors for face and folds", "Steroid effects: atrophy, telangiectasia, striae, acne, folliculitis, purpura", "Moderate-severe, hard sites (scalp, face, genitals, nails, palmoplantar) or arthritis: NB-UVB, BB-UVB or PUVA (20-25 sessions, 2-3 per week)", "Methotrexate 7.5-25 mg weekly (liver, teratogenic); acitretin (lipids); cyclosporine 2.5-5 mg/kg/day (renal); azathioprine; apremilast", "Biologics: TNF inhibitors (etanercept, adalimumab, infliximab), ustekinumab (IL-12/23), secukinumab (IL-17)", "Pregnancy: phototherapy. Oral steroids never, except pustular psoriasis in pregnancy"]}}, "lp": {"n": "Lichen planus", "c": "disease", "pg": "", "sum": "Idiopathic T-cell mediated inflammatory disease of skin and mucosa. Small polygonal violaceous flat-topped shiny papules, Wickham striae, Koebner. Oral reticular pattern is commonest. Hypergranulosis, band infiltrate. Steroids by extent.", "rows": {"Lesion": "Small polygonal violaceous flat-topped papules, shiny, sometimes umbilicated. Wickham striae (fine white network). Itchy. Post-inflammatory hyperpigmentation common. Papules may coalesce into plaques. Papular is the commonest type. Types: hypertrophic (shin, warty, worst), atrophic, ulcerative (worst), follicular (lichen planopilaris), annular (glans penis), linear or zosteriform, bullous, actinic.", "Sites": "Flexor wrists and forearms, dorsal hands, shins, presacral area. Mucous membranes in over half of patients, may be the only site. Genitals: glans penis (annular), vulva. Nails and scalp. Ages 30-60 (two-thirds), no sex or racial predilection.", "Key sign": "Wickham striae from focal hypergranulosis. Koebner phenomenon. Pterygium is the most specific nail sign. Hypertrophic lesions on the shin do not resolve; complications: keratoacanthoma, SCC.", "Histology": "Hyperkeratosis, focal hypergranulosis (Wickham striae), irregular (saw-tooth) acanthosis, basal vacuolar degeneration (pigment incontinence causes the hyperpigmentation; bullae if it separates), band-like lymphocytic infiltrate at the junction, Civatte (colloid) bodies.", "Trigger / link": "T-cell mediated autoimmune. Triggers: HCV, influenza vaccine, ACE inhibitors, thiazides, antimalarials. Associated: alopecia areata, vitiligo, HCV.", "Mouth / nails": "Oral: buccal mucosa, bilateral and symmetric; linear reticular pattern (commonest, asymptomatic); also papular, plaque, bullous, erosive or ulcerative (painful, malignant potential higher in men), atrophic. Nails (about 10%): pterygium unguis, longitudinal ridging, fissuring, onycholysis, subungual hyperkeratosis, melanonychia.", "Course": "May heal spontaneously within a year, leaves hyperpigmentation, can relapse. Complications: SCC in ulcerative and hypertrophic types, scarring alopecia in lichen planopilaris (atrophic cicatricial).", "Treatment": "Topical steroid (annular, limited). Intralesional (hypertrophic, ulcerative or erosive oral). Systemic steroid (lichen planopilaris, disseminated, severe oral not responding). Others: acitretin, NB-UVB, cyclosporine, metronidazole, mycophenolate. DDx: guttate and plaque psoriasis, syphilis, tinea corporis, warts, drug eruption."}, "g": "paps", "bk": 1, "rb": {"Lesion": ["Small polygonal violaceous flat-topped shiny papules, sometimes umbilicated; itchy", "Wickham striae (fine white network); post-inflammatory hyperpigmentation; papules may coalesce into plaques", "Papular is commonest. Others: hypertrophic (shin, warty), atrophic, ulcerative (worst), follicular (lichen planopilaris), annular (glans), linear or zosteriform, bullous, actinic"], "Sites": ["Flexor wrists and forearms, dorsal hands, shins, presacral", "Mucous membranes in over half, may be the only site", "Genitals: glans (annular), vulva; nails, scalp", "Age 30-60 (two-thirds); no sex or racial predilection"], "Key sign": ["Wickham striae = focal hypergranulosis; Koebner", "Pterygium: most specific nail sign", "Hypertrophic shin lesions do not resolve; complications keratoacanthoma, SCC"], "Histology": ["Hyperkeratosis, focal hypergranulosis, saw-tooth acanthosis", "Basal vacuolar degeneration (pigment incontinence = hyperpigmentation; bullae if it separates)", "Band-like lymphocytic infiltrate at junction; Civatte (colloid) bodies"], "Trigger / link": ["T-cell mediated autoimmune", "Triggers: HCV, influenza vaccine, ACE inhibitors, thiazides, antimalarials", "Associated: alopecia areata, vitiligo, HCV"], "Mouth / nails": ["Oral: buccal mucosa, bilateral symmetric; reticular (linear) commonest, asymptomatic; also papular, plaque, bullous, erosive or ulcerative (painful; malignant potential higher in men), atrophic", "Nails (about 10%): pterygium unguis, longitudinal ridging, fissuring, onycholysis, subungual hyperkeratosis, melanonychia"], "Course": ["May heal within a year, leaves hyperpigmentation, can relapse", "Complications: SCC in ulcerative and hypertrophic types; scarring alopecia in lichen planopilaris"], "Treatment": ["Topical steroid (annular, limited); intralesional (hypertrophic, ulcerative or erosive oral)", "Systemic steroid: lichen planopilaris, disseminated, severe oral not responding", "Others: acitretin, NB-UVB, cyclosporine, metronidazole, mycophenolate", "DDx: guttate and plaque psoriasis, syphilis, tinea corporis, warts, drug eruption"]}}, "pr": {"n": "Pityriasis rosea", "c": "disease", "pg": "", "sum": "Acute self-limited eruption of adolescents. Herald patch in 80%, then oval salmon patches with collarette scale in a Christmas tree pattern. HHV-6/7. Resolves in 6-8 weeks. Reassure.", "rows": {"Lesion": "Herald patch (80%): solitary oval 2-4 cm salmon-red plaque with fine collarette scale, usually trunk, precedes the rash by hours to days. Exanthem 1-2 weeks later: smaller thin scaly dull pink or tawny oval papules and patches with collarette, along cleavage lines (Christmas tree).", "Sites": "Trunk and proximal arms and legs. Face, palms and soles usually spared (unlike syphilis). Age 10-35, peak in adolescence. Spring and fall.", "Key sign": "Herald patch and Christmas tree distribution. Atypical: face and neck only, herald patch absent or multiple; pityriasis rosea irritata (vesicular or like erythema multiforme from sweat or wrong treatment).", "Histology": "Patchy parakeratosis, absent granular layer, psoriasiform hyperplasia, focal spongiosis, lymphocyte exocytosis, microvesicles, red cell extravasation, superficial perivascular lymphocytes, dermal edema.", "Trigger / link": "Viral: reactivation of HHV-7 or HHV-6.", "Mouth / nails": "Not typical.", "Course": "Spontaneous remission in 6-8 weeks. Recurrence uncommon. Few symptoms.", "Treatment": "Reassurance and education. Antipruritic lotions, low to medium topical steroid. Severe: antihistamines, NB-UVB or BB-UVB, sunlight in the first week, rarely short systemic steroid. DDx: drug eruption (captopril, barbiturates), secondary syphilis (serology), guttate psoriasis (no collarette), small plaque parapsoriasis, erythema multiforme, tinea corporis."}, "g": "paps", "bk": 1, "rb": {"Lesion": ["Herald patch (80%): solitary oval 2-4 cm salmon-red plaque, fine collarette scale, usually trunk; precedes rash by hours to days", "1-2 weeks later: smaller thin scaly pink or tawny oval patches with collarette along cleavage lines (Christmas tree)"], "Sites": ["Trunk, proximal arms and legs", "Face, palms, soles usually spared (unlike syphilis)", "Age 10-35, peak adolescence; spring and fall"], "Key sign": ["Herald patch + Christmas tree distribution", "Atypical: face and neck only; herald patch absent or multiple; irritata (vesicular or EM-like from sweat or wrong treatment)"], "Histology": ["Patchy parakeratosis, absent granular layer, psoriasiform hyperplasia, focal spongiosis, lymphocyte exocytosis, microvesicles, red cell extravasation, perivascular lymphocytes, dermal edema"], "Trigger / link": ["Viral: reactivation of HHV-7 or HHV-6"], "Mouth / nails": ["Not typical"], "Course": ["Spontaneous remission in 6-8 weeks; recurrence uncommon; few symptoms"], "Treatment": ["Reassurance; antipruritic lotions; low-medium topical steroid", "Severe: antihistamines, NB-UVB or BB-UVB, sunlight in first week, rarely short systemic steroid", "DDx: drug eruption (captopril, barbiturates), secondary syphilis (serology), guttate psoriasis (no collarette), small plaque parapsoriasis, EM, tinea corporis"]}}, "pv": {"n": "Pityriasis versicolor", "c": "disease", "pg": "", "sum": "Lipophilic yeast Malassezia (round to mycelial form). Fine branny scaly macules on the upper trunk, hyper- or hypopigmented. Spaghetti and meatballs on KOH, yellow Wood light.", "rows": {"Organism": "Malassezia furfur or globosa, a lipophilic yeast that normally lives on skin. Disease starts when the round yeast turns mycelial. Promoters: heat and humidity, oily skin, sweating, immunodeficiency, malnutrition, pregnancy, steroids, oils. Post-pubertal adults.", "Lesion": "Oval to round macules and patches with fine branny scale, hyper- or hypopigmented, may be follicular. Upper trunk and shoulders (short jacket), face in children, flexures (inverse PV). Asymptomatic, cosmetic complaint.", "Key sign": "Post-eruptive hypopigmentation: the fungus inhibits melanin and reduces tanning. Fine scale means active disease. No scale does not prove post-eruptive, so do Wood light.", "Lab / Wood light": "KOH: hyphae and yeast, spaghetti and meatballs. Culture not needed. Wood light: bright yellow.", "Treatment": "Topical azoles, for example 2% ketoconazole shampoo. Extensive: systemic antifungal. DDx: pityriasis alba, vitiligo, seborrheic dermatitis, pityriasis rosea, tinea corporis, secondary syphilis, progressive macular hypomelanosis."}, "g": "fung", "bk": 1, "rb": {"Organism": ["Malassezia furfur or globosa: lipophilic yeast, normal skin flora; disease when round yeast turns mycelial", "Promoters: heat, humidity, oily skin, sweating, immunodeficiency, malnutrition, pregnancy, steroids, oils", "Post-pubertal adults"], "Lesion": ["Oval-round macules and patches, fine branny scale, hyper- or hypopigmented, may be follicular", "Upper trunk and shoulders (short jacket); face in children; flexures (inverse PV)", "Asymptomatic, cosmetic"], "Key sign": ["Post-eruptive hypopigmentation: fungus inhibits melanin and tanning", "Fine scale = active disease; no scale does not prove post-eruptive, do Wood light"], "Lab / Wood light": ["KOH: hyphae and yeast, spaghetti and meatballs", "Culture not needed", "Wood light: bright yellow"], "Treatment": ["Topical azoles, e.g. ketoconazole 2% shampoo; extensive: systemic antifungal", "DDx: pityriasis alba, vitiligo, seborrheic dermatitis, pityriasis rosea, tinea corporis, secondary syphilis, progressive macular hypomelanosis"]}}, "sd": {"n": "Seborrheic dermatitis", "c": "disease", "pg": "", "sum": "Chronic red greasy scaling dermatitis of sebaceous areas. Malassezia role, commoner in Parkinson disease and HIV. Ketoconazole 2% shampoo.", "rows": {"Cause": "Malassezia furfur may play a role. Increased in Parkinson disease, HIV/AIDS, immunosuppression. Males, 2-5% of people. Onset in infancy (3-6 months), puberty, or 20-50 years.", "Lesion": "Orange-red macules, papules, patches with greasy scale, sharply marginated. Scalp (dandruff, cradle cap), eyebrows, eyelids (blepharitis), nasolabial folds, glabella, retroauricular area, presternal area (yellowish-brown), axillae, groin, submammary, diaper area (exudative).", "Key sign": "Greasy yellow-orange scale at sebaceous sites. Infants: cradle cap, trunk and napkin area, Leiner disease. DDx: psoriasis, infective dermatitis, tinea cruris, pityriasis rosea, contact dermatitis, candidiasis, erythrasma, pityriasis versicolor, drug eruption, pemphigus erythematosus.", "Tests": "Clinical.", "Treatment": "Adult scalp: selenium sulfide, zinc pyrithione or tar shampoo, 2% ketoconazole shampoo (very effective, also face and chest), then low-potency steroid, pimecrolimus 1%. Infants: warm olive oil compresses, baby shampoo, 2% ketoconazole, 1-2.5% hydrocortisone, pimecrolimus 1%. Severe: acitretin 0.5-1 mg/kg (contraception in women) or systemic steroids. Milder: itraconazole 100 mg twice daily for 2 weeks."}, "g": "ecz", "bk": 1, "rb": {"Cause": ["Malassezia furfur may play a role", "Increased in Parkinson disease, HIV/AIDS, immunosuppression", "Males; 2-5% of people; onset infancy (3-6 months), puberty, or 20-50 years"], "Lesion": ["Orange-red macules, papules, patches, greasy scale, sharp margins", "Scalp (dandruff, cradle cap), eyebrows, eyelids (blepharitis), nasolabial folds, glabella, retroauricular, presternal (yellowish-brown), axillae, groin, submammary, diaper area (exudative)"], "Key sign": ["Greasy yellow-orange scale at sebaceous sites", "Infants: cradle cap, trunk, napkin area, Leiner disease", "DDx: psoriasis, infective dermatitis, tinea cruris, pityriasis rosea, contact dermatitis, candidiasis, erythrasma, PV, drug eruption, pemphigus erythematosus"], "Tests": ["Clinical"], "Treatment": ["Adult scalp: selenium sulfide, zinc pyrithione or tar shampoo; ketoconazole 2% shampoo (very effective, also face and chest); then low-potency steroid, pimecrolimus 1%", "Infants: warm olive oil compresses, baby shampoo, ketoconazole 2%, hydrocortisone 1-2.5%, pimecrolimus 1%", "Severe: acitretin 0.5-1 mg/kg (contraception in women) or systemic steroids", "Milder: itraconazole 100 mg twice daily 2 weeks"]}}, "aa": {"n": "Alopecia areata", "c": "disease", "pg": "", "g": "alo", "sum": "T-cell autoimmune non-scarring patchy hair loss in genetically predisposed people. Exclamation mark hairs, bee-swarm infiltrate, nail pitting. Intralesional steroid is first line for patches.", "rows": {"Cause": "T-cell mediated autoimmune attack on anagen follicles, pushed into catagen. Genetic (55% identical twin concordance). Triggers: stress, fever, pregnancy, trauma, vaccines, viral infection, drugs. Associated: atopy (39%), thyroiditis, vitiligo, Down syndrome, celiac disease, other autoimmune disease (16%). Ages 15-29 peak, no sex difference.", "Lesion": "Abrupt round or oval patch completely bald with normal-looking skin, no inflammation. Scalp most, then beard, eyebrows. White hairs spared. Types: patchy, subtotalis, totalis (all scalp), universalis (all body), reticular (active), ophiasis (temporo-occipital band, children, resistant), sisaipho (spares sides and back), diffuse incognita. Itch or tingling in a few.", "Key sign": "Exclamation mark hairs at the edge (distal end thicker). Nail pitting and trachyonychia in 10-15%, linked to severe forms. Regrowth in 80% within a year; under 10% full recovery in totalis and universalis. Poor signs: early onset, atopy, family history, totalis/universalis, nail changes, ophiasis, long course.", "Tests": "Dermoscopy: yellow dots, black dots, broken hairs, exclamation mark hairs. Biopsy: peribulbar lymphocytes, bee-swarm pattern. Pull test positive at the edge when active. SALT score for severity. Thyroid tests in long-standing, totalis or universalis cases. DDx: gray patch and black dot tinea, secondary syphilis, trichotillomania, traction alopecia, lupus, telogen effluvium, scarring alopecia.", "Treatment": "Treatments only suppress. Intralesional triamcinolone (under 50% and eyebrows) or topical steroid is first line for patches. Oral steroid for active extensive disease. Topical immunotherapy (DPCP, SADBE, DNCB) for over 50%. Anthralin 0.5-1% short contact. Minoxidil 2-5%. Latanoprost or bimatoprost. NB-UVB or PUVA. Cyclosporine 5 mg/kg, methotrexate, sulfasalazine. JAK inhibitors: the only FDA-approved drug (over 18). Wigs, eyebrow tattoo."}, "bk": 1, "rb": {"Cause": ["T-cell autoimmune attack on anagen follicles, pushed into catagen", "Genetic (55% concordance in identical twins)", "Triggers: stress, fever, pregnancy, trauma, vaccines, viral infection, drugs", "Associated: atopy (39%), thyroiditis, vitiligo, Down syndrome, celiac, other autoimmune (16%)", "Peak age 15-29; no sex difference"], "Lesion": ["Abrupt round or oval completely bald patch, normal-looking skin, no inflammation; white hairs spared", "Scalp most, then beard, eyebrows; itch or tingling in a few", "Types: patchy, subtotalis, totalis (all scalp), universalis (all body), reticular (active), ophiasis (temporo-occipital band, children, resistant), sisaipho (spares sides and back), diffuse incognita"], "Key sign": ["Exclamation mark hairs at the edge (distal end thicker)", "Nail pitting and trachyonychia in 10-15%, linked to severe forms", "Regrowth in 80% within a year; under 10% full recovery in totalis and universalis", "Poor signs: early onset, atopy, family history, totalis/universalis, nail changes, ophiasis, long course"], "Tests": ["Dermoscopy: yellow dots, black dots, broken hairs, exclamation mark hairs", "Biopsy: peribulbar lymphocytes, bee-swarm pattern", "Pull test positive at edge when active; SALT score for severity", "Thyroid tests in long-standing, totalis or universalis", "DDx: gray patch and black dot tinea, secondary syphilis, trichotillomania, traction alopecia, lupus, telogen effluvium, scarring alopecia"], "Treatment": ["Treatments only suppress", "First line for patches: intralesional triamcinolone (under 50%, eyebrows) or topical steroid", "Oral steroid for active extensive disease", "Topical immunotherapy (DPCP, SADBE, DNCB) for over 50%", "Anthralin 0.5-1% short contact; minoxidil 2-5%; latanoprost or bimatoprost; NB-UVB or PUVA", "Cyclosporine 5 mg/kg, methotrexate, sulfasalazine", "JAK inhibitors: the only FDA-approved drug (over 18)", "Wigs, eyebrow tattoo"]}}, "iv": {"n": "Ichthyosis vulgaris", "c": "disease", "g": "geno", "pg": "", "sum": "Commonest inherited ichthyosis. Autosomal dominant filaggrin defect. Fine scales on extensors, folds spared, worse in winter, starts after 3 months. Associated with atopy and keratosis pilaris. Emollients.", "rows": {"Inheritance / gene": "Autosomal dominant. Filaggrin gene defect (keratin-aggregating protein): weak barrier, less natural moisturizing factor. Same defect in a subset of atopic dermatitis. Disorder of keratinization.", "Onset": "Delayed onset, after 3 months, usually childhood. Mild to severe.", "Lesion": "Fine dry scales stuck to the skin, coarser on the legs than the trunk, attached centrally with a free outer edge. Dryness worse in winter, better in summer.", "Spared / favoured": "Extensor aspects most affected. Body folds (axillae) spared. Palms and soles show exaggerated markings and mild hyperkeratosis.", "Key associations": "Atopy (atopic dermatitis) and keratosis pilaris.", "Histology": "H&E: compact orthokeratosis with reduced or absent granular layer.", "Course / prognosis": "Benign, improves with age, limited in adulthood.", "Treatment": "Regular emollients (paraffin, urea creams) applied on wet skin within minutes of a bath. Keratolytics such as salicylic acid, useful on palms and soles but can irritate."}, "bk": 1, "rb": {"Inheritance / gene": ["Autosomal dominant", "Filaggrin gene defect (keratin-aggregating protein): weak barrier, less natural moisturizing factor", "Same defect in a subset of atopic dermatitis; disorder of keratinization"], "Onset": ["Delayed, after 3 months, usually childhood; mild to severe"], "Lesion": ["Fine dry scales stuck to skin; coarser on legs than trunk; attached centrally with free outer edge", "Worse in winter, better in summer"], "Spared / favoured": ["Extensors most affected; body folds (axillae) spared", "Palms and soles: exaggerated markings, mild hyperkeratosis"], "Key associations": ["Atopy (atopic dermatitis), keratosis pilaris"], "Histology": ["Compact orthokeratosis with reduced or absent granular layer"], "Course / prognosis": ["Benign, improves with age, limited in adulthood"], "Treatment": ["Regular emollients (paraffin, urea) on wet skin within minutes of a bath", "Keratolytics (salicylic acid): useful on palms and soles, can irritate"]}}, "xli": {"n": "X-linked ichthyosis", "c": "disease", "g": "geno", "pg": "", "sum": "X-linked recessive ichthyosis: males only, carried by the mother. Early onset before 3 months, large dark tan scales, dirty neck, no keratosis pilaris, palms and soles spared. Steroid sulfatase deficiency.", "rows": {"Inheritance / gene": "X-linked recessive. Only males, from a heterozygous mother.", "Onset": "Early onset, before 3 months. Mild to severe.", "Lesion": "Large dark tan or gray scales on limbs, anterior neck, trunk, may involve ears and face. Sides of the neck give the dirty unwashed look. Improves in sunny weather. Changes little with age.", "Spared / favoured": "Palms and soles rarely involved.", "Key associations": "No keratosis pilaris and no increase in atopic dermatitis.", "Histology": "Hyperkeratosis with normal or thickened granular layer. CHECK: not confirmed.", "Course / prognosis": "Little change with age.", "Treatment": "Emollients and keratolytics."}, "bk": 1, "rb": {"Inheritance / gene": ["X-linked recessive; males only, from a heterozygous mother"], "Onset": ["Early, before 3 months; mild to severe"], "Lesion": ["Large dark tan or gray scales on limbs, anterior neck, trunk; may involve ears and face", "Sides of neck: dirty unwashed look", "Improves in sunny weather; changes little with age"], "Spared / favoured": ["Palms and soles rarely involved"], "Key associations": ["No keratosis pilaris; no increase in atopic dermatitis"], "Histology": ["Hyperkeratosis with normal or thickened granular layer", "CHECK: not confirmed"], "Course / prognosis": ["Little change with age"], "Treatment": ["Emollients and keratolytics"]}}, "lam": {"n": "Lamellar ichthyosis", "c": "disease", "g": "geno", "pg": "", "sum": "Lamellar ichthyosis: autosomal recessive, collodion baby at birth, thick plate-like brown scales over the whole skin, ectropion, palmoplantar keratoderma. Systemic retinoid (acitretin) for severe disease.", "rows": {"Inheritance / gene": "Autosomal recessive.", "Onset": "Present at birth as a collodion membrane that sheds in 2-3 weeks, or soon after birth in severe form. No transition from mild to severe.", "Lesion": "Whole skin surface. Thick large scales about 1 cm, brown, plate-like, quadrilateral, adherent centrally with a free edge.", "Spared / favoured": "Ectropion almost always present. Hyperkeratosis of palms and soles.", "Key associations": "Large generalized plates, ectropion, palmoplantar hyperkeratosis.", "Histology": "Marked compact orthohyperkeratosis with an intact granular layer.", "Course / prognosis": "Changes very little with age.", "Treatment": "Emollients and keratolytics. Systemic retinoid (acitretin, isotretinoin) for severe disease: dryness, hepatotoxicity, raised lipids, bone pain, teratogenic. Topical retinoids (tretinoin, adapalene) for localized or mild disease."}, "bk": 1, "rb": {"Inheritance / gene": ["Autosomal recessive"], "Onset": ["At birth as collodion membrane, sheds in 2-3 weeks (or soon after birth in severe form)", "No transition from mild to severe"], "Lesion": ["Whole skin: thick large scales about 1 cm, brown, plate-like, quadrilateral, adherent centrally with free edge"], "Spared / favoured": ["Ectropion almost always present", "Hyperkeratosis of palms and soles"], "Key associations": ["Large generalized plates, ectropion, palmoplantar hyperkeratosis"], "Histology": ["Marked compact orthohyperkeratosis, intact granular layer"], "Course / prognosis": ["Changes very little with age"], "Treatment": ["Emollients, keratolytics", "Severe: systemic retinoid (acitretin, isotretinoin): dryness, hepatotoxicity, raised lipids, bone pain, teratogenic", "Mild or localized: topical retinoids (tretinoin, adapalene)"]}}, "eb": {"n": "Epidermolysis bullosa", "c": "disease", "g": "geno", "pg": "", "sum": "Epidermolysis bullosa: inherited blistering from minor trauma due to adhesion molecule defects. Simplex (intraepidermal, keratin 5 and 14), junctional (lamina lucida), dystrophic (sublamina densa, COL7A1, scarring). No cure; protect skin.", "rows": {"Inheritance / gene": "Group of genetic disorders with blisters after minor trauma, at hands and feet; some forms involve mucosae and the esophagus, stomach and airways. Simplex: dominant, intraepidermal, keratin 5 and 14, heals without scar; localized (hands and feet) or generalized with palmoplantar hyperkeratosis. Junctional: recessive, lamina lucida; Herlitz severe: periorificial erosions, granulation tissue, hoarse cry, death in infancy; intermediate: tooth and nail changes; atrophic benign: normal life. Dystrophic: sublamina densa, scarring, milia, hair damage.", "Onset": "Defective adhesion molecules. Simplex: keratins 5 and 14. Junctional: laminin-332, collagen XVII (BP180), alpha-6 and beta-1 integrin. Dystrophic: COL7A1 (type VII collagen), anchoring fibrils defective.", "Lesion": "Dominant dystrophic: blisters over joints (toes, fingers, knuckles, ankles, elbows), scar-like trunk lesions, contractures, claw hands, normal teeth; Bart syndrome (congenital localized skin defects, mechanobullous, nail deformity). Recessive dystrophic: the severest, from birth, mitten deformity (digital fusion), high risk of SCC, pseudosyndactyly.", "Spared / favoured": "Simplex: intraepidermal. Junctional: lamina lucida. Dystrophic: lamina densa and below.", "Key associations": "Simplex: limited mucosal involvement, normal teeth and hair. Junctional: granulation tissue, dental pitting, alopecia, nail dystrophy. Dystrophic: hemorrhagic blisters, milia, severe mucosal disease, growth retardation.", "Histology": "Skin biopsy: one sample for electron microscopy, one for immunofluorescence mapping. Culture of poorly healing wounds. DNA mutation analysis. Imaging for GI dysfunction.", "Course / prognosis": "Junctional Herlitz: death in infancy. Recessive dystrophic: SCC, severe morbidity.", "Treatment": "No cure (gene and cell therapy under study). Protect the skin, avoid friction and trauma, cool environment, foam padding, soft light clothing, pierce and drain blisters with training, silicone low-adherent dressings (not adhesive tapes), nutrition, dental care, soft diet if esophagus involved, stool softeners. Team care and family education."}, "bk": 1, "rb": {"Inheritance / gene": ["Genetic blistering after minor trauma, at hands and feet; some forms involve mucosae, esophagus, stomach, airways", "Simplex: dominant, intraepidermal, keratin 5 and 14, heals without scar; localized (hands, feet) or generalized with palmoplantar hyperkeratosis", "Junctional: recessive, lamina lucida. Herlitz (severe): periorificial erosions, granulation tissue, hoarse cry, death in infancy. Intermediate: tooth and nail changes. Atrophic benign: normal life", "Dystrophic: sublamina densa, scarring, milia, hair damage"], "Onset": ["Defective adhesion molecules", "Simplex: keratins 5 and 14", "Junctional: laminin-332, collagen XVII (BP180), alpha-6 and beta-1 integrin", "Dystrophic: COL7A1 (type VII collagen), anchoring fibrils defective"], "Lesion": ["Dominant dystrophic: blisters over joints (toes, fingers, knuckles, ankles, elbows), scar-like trunk lesions, contractures, claw hands, normal teeth; Bart syndrome (congenital localized skin defects, mechanobullous, nail deformity)", "Recessive dystrophic: severest, from birth, mitten deformity (digital fusion), pseudosyndactyly, high risk of SCC"], "Spared / favoured": ["Split level: simplex intraepidermal; junctional lamina lucida; dystrophic lamina densa and below"], "Key associations": ["Simplex: limited mucosal disease, normal teeth and hair", "Junctional: granulation tissue, dental pitting, alopecia, nail dystrophy", "Dystrophic: hemorrhagic blisters, milia, severe mucosal disease, growth retardation"], "Histology": ["Skin biopsy: one sample for electron microscopy, one for immunofluorescence mapping", "Culture of poorly healing wounds; DNA mutation analysis; imaging for GI dysfunction"], "Course / prognosis": ["Junctional Herlitz: death in infancy", "Recessive dystrophic: SCC, severe morbidity"], "Treatment": ["No cure (gene and cell therapy under study)", "Protect skin, avoid friction and trauma, cool environment, foam padding, soft light clothing; pierce and drain blisters (with training); silicone low-adherent dressings, not adhesive tapes", "Nutrition, dental care, soft diet if esophagus involved, stool softeners; team care, family education"]}}, "xp": {"n": "Xeroderma pigmentosum", "c": "disease", "g": "geno", "pg": "", "sum": "Xeroderma pigmentosum: autosomal recessive defect in nucleotide excision repair of UV damage. Severe sun sensitivity from infancy, lentigines, skin cancer before age 10 (BCC commonest), eye damage, neurologic degeneration in 20%. Strict UV protection.", "rows": {"Inheritance / gene": "Autosomal recessive. Defective DNA excision repair of UV damage.", "Onset": "First 2 years: acute prolonged sunburn (sparing under the chin) or delayed onset.", "Lesion": "Lentigines and freckles, mottled hypopigmentation (melanocyte destruction), actinic keratoses, photoaging. Skin cancer before 10 years: BCC commonest, then SCC, melanoma, mostly head and neck. About 50-fold increase in internal tumors, especially CNS.", "Spared / favoured": "Anterior UV-exposed eye structures only (lids, cornea, conjunctiva).", "Key associations": "Eyes: photophobia, keratitis, corneal opacity and vascularization, ectropion, neoplasms (epithelioma, SCC, melanoma). Neurologic degeneration in 20%.", "Histology": "Clinical diagnosis: sunburn response at all exposed sites from birth, early lentigines or young skin cancers.", "Course / prognosis": "UV avoidance can prevent further skin change. Cancer risk persists without strict protection.", "Treatment": "Complete UV protection: UV film on windows, sunscreen, long clothes, gloves, UV face mask. Systemic retinoids (off-label chemoprophylaxis) for life: side effects and rebound when stopped."}, "bk": 1, "rb": {"Inheritance / gene": ["Autosomal recessive; defective DNA excision repair of UV damage"], "Onset": ["First 2 years: acute prolonged sunburn (sparing under the chin) or delayed onset"], "Lesion": ["Lentigines, freckles, mottled hypopigmentation (melanocyte destruction), actinic keratoses, photoaging", "Skin cancer before age 10: BCC commonest, then SCC, melanoma; mostly head and neck", "About 50-fold increase in internal tumors, especially CNS"], "Spared / favoured": ["Eye: anterior UV-exposed structures only (lids, cornea, conjunctiva)"], "Key associations": ["Eyes: photophobia, keratitis, corneal opacity and vascularization, ectropion, neoplasms (epithelioma, SCC, melanoma)", "Neurologic degeneration in 20%"], "Histology": ["Clinical diagnosis: sunburn response at all exposed sites from birth, early lentigines or young skin cancers"], "Course / prognosis": ["UV avoidance prevents further skin change; cancer risk persists without strict protection"], "Treatment": ["Complete UV protection: UV film on windows, sunscreen, long clothes, gloves, UV face mask", "Systemic retinoids (off-label chemoprophylaxis), lifelong: side effects, rebound when stopped"]}}, "lep_tt": {"n": "Tuberculoid leprosy", "c": "disease", "g": "lep", "pg": "", "sum": "Tuberculoid and borderline leprosy. M. leprae, obligate intracellular acid-fast rod, grows at about 35 C (nose, testes, ear lobes, nerves near skin). Intact cell-mediated immunity gives few anesthetic hairless plaques and early asymmetric nerve thickening. Smear negative.", "rows": {"Immunity": "Depends on specific cell-mediated immunity. Tuberculoid: intact. Lepromatous: depressed. Three borderline types between: borderline tuberculoid, borderline-borderline, borderline lepromatous. Spread by nasal droplets; skin contact is rare. Cannot be grown on artificial media; mouse footpad and armadillo.", "Skin lesions": "Tuberculoid: single or few well-defined erythematous or hypopigmented plaques with slightly raised borders, anesthetic, hairless, anhidrotic. Borderline: few or several asymmetric partly defined plaques, annular. Hypopigmented patches with complete loss of sensation.", "Nerves": "Early, unilateral or asymmetric thickening of nerves with pain, paresthesia, weakness or paralysis; may be the only sign. Nerves near the skin: ulnar, great auricular, posterior tibial.", "Smear / histology": "Biopsy: epithelioid granulomas with Langhans cells and lymphocytes, in a linear pattern following nerves, fragmented nerve fibers, no organisms even with stains. Skin smear (earlobe, Fite or Ziehl-Neelsen): negative. To tell from cutaneous TB: the nerve is inflamed and granulomas run along the nerve.", "Other features": "Lepromin test positive. Reactions: sudden change in the picture. Type 1 reversal (upgrading), mostly in borderline disease, type IV delayed hypersensitivity: old lesions turn red and edematous, tender swollen nerves. Spontaneous or after treatment, pregnancy, infections.", "Treatment": "Paucibacillary (2-5 lesions): rifampin 600 mg monthly plus dapsone 100 mg daily for 6-9 months. Single lesion: one dose of rifampin 600 mg, ofloxacin 400 mg, minocycline 100 mg. Reactions: never stop antileprosy drugs; short steroid course; immunomodulators. Follow up at least 2 years in paucibacillary."}, "bk": 1, "rs": {"Immunity": "Intact cell-mediated immunity. Droplet spread. Not culturable.", "Skin lesions": "Few well-defined anesthetic, hairless plaques.", "Nerves": "Early asymmetric thickening: ulnar, great auricular, posterior tibial.", "Smear / histology": "Epithelioid granulomas along nerves. Smear negative.", "Other features": "Lepromin positive. Type 1 reversal reaction (type IV).", "Treatment": "Paucibacillary: rifampin 600 mg monthly plus dapsone 100 mg daily, 6-9 months. Follow up 2 years."}, "rb": {"Immunity": ["Specific cell-mediated immunity: tuberculoid intact, lepromatous depressed", "Three borderline types between: BT, BB, BL", "Mnemonic: المناعة بطارية بتفصل:§شحن 100% (TT)§75% (BT)§50% (BB)§25% (BL)§فاضي (LL)", "Spread by nasal droplets; skin contact rare", "Not grown on artificial media; mouse footpad, armadillo"], "Skin lesions": ["Tuberculoid: single or few well-defined red or hypopigmented plaques, raised borders; anesthetic, hairless, anhidrotic", "Borderline: few or several asymmetric, partly defined, annular plaques", "Hypopigmented patches with complete sensory loss"], "Nerves": ["Early, unilateral or asymmetric thickening, with pain, paresthesia, weakness or paralysis; may be the only sign", "Nerves near skin: ulnar, great auricular, posterior tibial"], "Smear / histology": ["Epithelioid granulomas with Langhans cells and lymphocytes, linear along nerves; fragmented nerve fibers; no organisms", "Skin smear (earlobe, Fite or ZN): negative", "Vs cutaneous TB: nerve inflamed, granulomas follow the nerve"], "Other features": ["Lepromin test positive", "Type 1 reversal (upgrading) reaction: mostly borderline disease, type IV hypersensitivity; old lesions red and edematous, tender swollen nerves", "Triggers: spontaneous, treatment, pregnancy, infections"], "Treatment": ["Paucibacillary (2-5 lesions): rifampin 600 mg monthly + dapsone 100 mg daily, 6-9 months", "Single lesion: one dose rifampin 600 mg + ofloxacin 400 mg + minocycline 100 mg", "Reactions: never stop antileprosy drugs; short steroid course; immunomodulators", "Follow up at least 2 years"]}}, "lep_ll": {"n": "Lepromatous leprosy", "c": "disease", "g": "lep", "pg": "", "sum": "Lepromatous leprosy: depressed cell immunity, multiple symmetric poorly defined lesions, leonine face, madarosis, nasal bleeding, late symmetric nerve damage. Smear strongly positive, Virchow cells. ENL is the type 2 reaction. Multibacillary MDT.", "rows": {"Immunity": "Depressed cell-mediated immunity.", "Skin lesions": "Multiple poorly defined erythematous macules, papules, nodules and plaques, widespread and symmetric. Forehead infiltration gives leonine face. Madarosis (outer third of eyebrows and lashes), nasal bleeding, saddle nose, bilateral earlobe infiltration, acquired ichthyosis of the legs.", "Nerves": "Bilateral symmetric, late. Glove and stocking anesthesia, muscle wasting, neurotrophic ulcers, bone resorption, loss of digits. Also corneal ulcers, keratitis, orchitis.", "Smear / histology": "Diffuse foamy histiocytes (Virchow cells) with bacilli and lipid, Grenz zone under the epidermis. Smear from earlobe (squeeze fold, small incision) stained with Fite or Ziehl-Neelsen: red rods. Lepromin negative.", "Other features": "Type 2 reaction: erythema nodosum leprosum, in lepromatous and borderline lepromatous leprosy. Immune complex small vessel vasculitis: acute fever, malaise, arthralgia, bilateral symmetric tender nodules on face and limbs. Nasal bleeding is an important manifestation.", "Treatment": "Multibacillary (over 5 lesions): rifampin 600 mg monthly plus clofazimine 300 mg monthly and 50 mg daily plus dapsone 100 mg daily for 12-18 months. Never stop antileprosy drugs in a reaction; short steroids; immunomodulators. Follow up at least 5 years in multibacillary."}, "bk": 1, "rs": {"Immunity": "Depressed cell-mediated immunity.", "Skin lesions": "Multiple symmetric poorly defined lesions. Leonine face, madarosis, saddle nose.", "Nerves": "Late, bilateral. Glove and stocking anesthesia, neurotrophic ulcers.", "Smear / histology": "Virchow cells, Grenz zone. Smear strongly positive. Lepromin negative.", "Other features": "Type 2 reaction: ENL, immune complex vasculitis, fever, tender nodules.", "Treatment": "Multibacillary: rifampin, clofazimine, dapsone for 12-18 months. Follow up 5 years."}, "rb": {"Immunity": ["Depressed cell-mediated immunity"], "Skin lesions": ["Multiple poorly defined red macules, papules, nodules, plaques; widespread, symmetric", "Forehead infiltration: leonine face", "Madarosis (outer third of eyebrows and lashes), nasal bleeding, saddle nose, bilateral earlobe infiltration, acquired ichthyosis of legs"], "Nerves": ["Bilateral, symmetric, late", "Glove and stocking anesthesia, muscle wasting, neurotrophic ulcers, bone resorption, loss of digits", "Also corneal ulcers, keratitis, orchitis"], "Smear / histology": ["Virchow cells (foamy histiocytes with bacilli and lipid); Grenz zone under epidermis", "Smear from earlobe, Fite or ZN: red rods; strongly positive", "Lepromin negative"], "Other features": ["Type 2 reaction: erythema nodosum leprosum, in lepromatous and BL", "Immune complex small vessel vasculitis: fever, malaise, arthralgia, bilateral tender nodules on face and limbs", "Nasal bleeding is an important manifestation"], "Treatment": ["Multibacillary (over 5 lesions): rifampin 600 mg monthly + clofazimine 300 mg monthly and 50 mg daily + dapsone 100 mg daily, 12-18 months", "Never stop antileprosy drugs in a reaction; short steroids; immunomodulators", "Follow up at least 5 years"]}}, "acne": {"n": "Acne vulgaris", "c": "disease", "pg": "", "g": "acn", "sum": "Chronic inflammatory disease of the pilosebaceous unit. Follicular hyperkeratinization (IL-1 alpha), androgens (DHT), C. acnes inflammation (TLR2, IL-8), plus genes. Isotretinoin is for severe nodulocystic or scarring acne.", "rows": {"Pathogenesis": "Follicular hyperkeratinization: microcomedo is the precursor, IL-1 alpha drives it. Androgens: receptors in the basal layer of the sebaceous gland, DHT is the most potent (5-10x testosterone). Testosterone level is usually normal but receptors and 5-alpha-reductase are higher. Cutibacterium acnes: gram-positive rod deep in the follicle, lipases rupture the comedo, TLR2 raises IL-1 alpha, IL-8, IL-12, TNF-alpha, and IL-8 recruits neutrophils. Inherited gland size and activity. 85% of people aged 12-24.", "Lesion": "Face and upper trunk. Non-inflammatory: closed comedone (whitehead, skin-colored papule, no opening), open comedone (blackhead, dilated opening, melanin and oxidized lipid). Inflammatory: papules, pustules, nodules, cysts. Severe nodulocystic acne coalesces into plaques with sinus tracts. Sequelae: pitted or hypertrophic scars (trunk), post-inflammatory erythema and pigmentation.", "Variants": "Fulminans: males 13-22, acute painful ulcerative nodules with hemorrhagic crusts, fever, weight loss, joint pain, leukocytosis, high ESR and CRP. Treat with oral steroid, antibiotic and isotretinoin. Conglobata: severe nodulocystic, no systemic signs, part of the follicular occlusion tetrad (dissecting cellulitis of scalp, hidradenitis suppurativa, pilonidal sinus). Neonatal: 20% of newborns, about 2 weeks, papulopustules without comedones, Malassezia, topical antifungal. Infantile: 3-12 months, comedones, scarring, tretinoin plus benzoyl peroxide. Excoriee: young women, picked lesions, anxiety or OCD, antidepressant or psychotherapy. Drug-induced: monomorphous papules, corticosteroids, anabolic steroids. Occupational: comedones, cutting oils, petroleum, coal tar.", "Topical treatment": "Retinoids (tretinoin, adapalene, tazarotene): comedolytic, for comedonal acne. Benzoyl peroxide: bactericidal, no resistance. Topical clindamycin or erythromycin, with benzoyl peroxide or a retinoid. Dapsone gel (9 years and older). Azelaic acid 20%: antibacterial, comedolytic, lightens post-inflammatory pigmentation, safe in pregnancy. Clascoterone 1%: topical anti-androgen, competes with DHT (12 years and older). Retinoids are contraindicated in pregnancy. Intralesional steroid for nodules and cysts. Comedone extraction, peels.", "Oral treatment": "Antibiotics for moderate to severe inflammatory acne: doxycycline, minocycline, tetracycline, erythromycin, azithromycin. Hormonal: combined pill (cyproterone acetate 2 mg with ethinyl estradiol), spironolactone 50-100 mg twice daily (androgen receptor blocker and 5-alpha-reductase inhibitor). Use in PCOS, adult women over 25, lower face and neck, perimenstrual flare, resistance. Spironolactone: irregular menses, breast tenderness, feminization of a male fetus.", "Isotretinoin": "13-cis-retinoic acid. For severe nodulocystic acne resistant to oral antibiotics, or scarring. Cuts sebum up to 90%, normalizes keratinization, so C. acnes cannot live. Start 0.5 mg/kg/day with a fatty meal, then 1 mg/kg/day to 120-150 mg/kg total (4-5 months). Low dose 0.25-0.4 mg/kg for 6 months. Relapse up to 40%. Dryness is commonest. Teratogenicity is the most serious. Also raised triglycerides and cholesterol, transaminases, myalgia, depression. With tetracyclines: raised ICP (pseudotumor cerebri)."}, "bk": 1, "rs": {"Pathogenesis": "Follicular hyperkeratinization (IL-1 alpha), androgens (DHT), C. acnes (TLR2, IL-8).", "Lesion": "Face and upper trunk. Comedones, papules, pustules, nodules. Scars possible.", "Variants": "Fulminans: young males, fever, joint pain. Conglobata: no systemic signs. Neonatal: Malassezia.", "Topical treatment": "Comedonal: retinoid. Benzoyl peroxide: no resistance. No retinoids in pregnancy.", "Oral treatment": "Antibiotics: doxycycline, minocycline. Hormonal: cyproterone pill, spironolactone.", "Isotretinoin": "Severe nodulocystic or scarring. Teratogenic. Dry skin commonest; raised lipids, depression."}, "rb": {"Pathogenesis": ["Follicular hyperkeratinization: microcomedo is the precursor; IL-1 alpha drives it", "Androgens: receptors in basal layer of sebaceous gland; DHT most potent (5-10x testosterone); testosterone usually normal, receptors and 5-alpha-reductase raised", "C. acnes (gram-positive rod): lipases rupture comedo; TLR2 raises IL-1 alpha, IL-8, IL-12, TNF-alpha; IL-8 recruits neutrophils", "Inherited gland size and activity; 85% of people aged 12-24"], "Lesion": ["Face and upper trunk", "Non-inflammatory: closed comedone (whitehead, no opening), open comedone (blackhead, melanin and oxidized lipid)", "Inflammatory: papules, pustules, nodules, cysts", "Severe nodulocystic: plaques with sinus tracts", "Sequelae: pitted or hypertrophic scars (trunk), post-inflammatory erythema and pigmentation"], "Variants": ["Fulminans: males 13-22; painful ulcerative nodules, hemorrhagic crusts, fever, weight loss, joint pain, leukocytosis, high ESR/CRP; oral steroid + antibiotic + isotretinoin", "Conglobata: severe nodulocystic, no systemic signs; part of follicular occlusion tetrad (dissecting cellulitis of scalp, hidradenitis, pilonidal sinus)", "Neonatal: 20% of newborns, about 2 weeks, no comedones, Malassezia; topical antifungal", "Infantile: 3-12 months, comedones, scarring; tretinoin + benzoyl peroxide", "Excoriee: young women, picking, anxiety/OCD; antidepressant or psychotherapy", "Drug-induced: monomorphous papules (corticosteroids, anabolic steroids)", "Occupational: comedones from cutting oils, petroleum, coal tar"], "Topical treatment": ["Retinoids (tretinoin, adapalene, tazarotene): comedolytic, first for comedonal acne; contraindicated in pregnancy", "Benzoyl peroxide: bactericidal, no resistance", "Clindamycin or erythromycin: with benzoyl peroxide or retinoid", "Dapsone gel (9 years and older)", "Azelaic acid 20%: antibacterial, comedolytic, lightens pigmentation, safe in pregnancy", "Clascoterone 1%: topical anti-androgen, competes with DHT (12 years and older)", "Intralesional steroid for nodules and cysts; comedone extraction, peels"], "Oral treatment": ["Antibiotics for moderate-severe inflammatory acne: doxycycline, minocycline, tetracycline, erythromycin, azithromycin", "Hormonal: combined pill (cyproterone acetate 2 mg + ethinyl estradiol); spironolactone 50-100 mg twice daily (androgen receptor blocker, 5-alpha-reductase inhibitor)", "Use in PCOS, women over 25, lower face and neck, perimenstrual flare, resistance", "Spironolactone: irregular menses, breast tenderness, feminizes male fetus"], "Isotretinoin": ["13-cis-retinoic acid: severe nodulocystic acne resistant to oral antibiotics, or scarring", "Cuts sebum up to 90%, normalizes keratinization, C. acnes cannot survive", "Dose: 0.5 mg/kg/day with fatty meal, then 1 mg/kg/day to 120-150 mg/kg total (4-5 months); low dose 0.25-0.4 mg/kg for 6 months; relapse up to 40%", "Dryness commonest; teratogenicity most serious", "Also raised triglycerides, cholesterol, transaminases; myalgia, depression", "With tetracyclines: raised ICP (pseudotumor cerebri)", "Mnemonic: كإنه tears فهو drama queen§(Isotretinoin)§شفايف ناشفة من الكلام§(Mucocutaneous dryness)§ضغط الدماغ زاد من الصداع والكلام§(ICP)§دهون من كتر الأكل مع العياط§(TG and cholesterol)§وجع عضلات من كتر العياط§(Myalgia)§بتقول إنه بيشوه الجنين لأنها drama queen§(Teratogenicity)"]}}, "urt": {"n": "Urticaria", "c": "disease", "pg": "", "g": "urg", "sum": "Wheals from histamine release by mast cells. Each wheal fades within 24 hours. Acute under 6 weeks, chronic 6 weeks or more. First line: second-generation antihistamine, up to 4 times the dose.", "rows": {"Cause": "Histamine from mast cells (IgE, physical stimuli, NSAIDs, morphine, histamine-rich foods). Acute: idiopathic 50%, infection 40% (viral URTI), foods, drugs (penicillin IgE; aspirin and NSAIDs not IgE). Chronic: most often idiopathic, adults, women more; autoimmune (anti-IgE or anti-IgG, ASST, thyroiditis, vitiligo), H. pylori, streptococci, parasites, pseudoallergens, food colorants. Physical: cold, delayed pressure (3-12 hours later), heat, solar, dermographic (5-10 minutes, lasts 15-30), aquagenic, cholinergic (exercise, spicy food, small papules on the trunk), contact, vibratory.", "Lesion": "Wheal: central swelling with reflex erythema, itchy or burning, gone within 1-24 hours, no pigment left. Polymorphic, round, polycyclic (annular) or vesiculobullous. Papular urticaria: arthropod bites (flies, mosquitoes, mites, fleas), small itchy papules with a vesicle, excoriated.", "Key sign": "Urticarial vasculitis: wheals last over 24 hours, burn or hurt, leave pigmentation, with fever, malaise, myalgia; biopsy shows vasculitis. Ordinary wheal: under 24 hours, no systemic signs.", "Tests": "Acute: history only. Chronic: CBC, ESR, CRP, stool for H. pylori and parasites, ANA, thyroid tests, autologous serum skin test, skin prick test for a suspected food. DDx: atopic dermatitis, contact dermatitis, pityriasis rosea, drug eruption, erythema multiforme.", "Treatment": "Avoid triggers. Calamine or 1% menthol for itch. Second-generation H1 antihistamine (cetirizine, fexofenadine, desloratadine, loratadine). If still active after 2 weeks double the dose, up to 4 times. Then add omalizumab (binds free IgE). Then cyclosporine for severe autoimmune disease. Oral prednisone 3-10 days only for severe acute urticaria or flares, not chronic. Hydroxyzine or diphenhydramine at night (sedating). Others: H2 blocker, doxepin, montelukast add-on, mast cell stabilizer in cholinergic."}, "bk": 1, "rb": {"Cause": ["Histamine from mast cells (IgE, physical stimuli, NSAIDs, morphine, histamine-rich foods)", "Acute: idiopathic 50%, infection 40% (viral URTI), foods, drugs (penicillin IgE; aspirin and NSAIDs not IgE)", "Chronic: mostly idiopathic; adults, women more; autoimmune (anti-IgE/IgG, ASST, thyroiditis, vitiligo), H. pylori, streptococci, parasites, pseudoallergens, food colorants", "Physical: cold; delayed pressure (3-12 hours later); heat; solar; dermographic (5-10 minutes, lasts 15-30); aquagenic; cholinergic (exercise, spicy food, small papules on trunk); contact; vibratory"], "Lesion": ["Wheal: central swelling with reflex erythema, itchy or burning, gone in 1-24 hours, no pigment left", "Polymorphic: round, polycyclic (annular) or vesiculobullous", "Papular urticaria: arthropod bites (flies, mosquitoes, mites, fleas); small itchy papules with vesicle, excoriated"], "Key sign": ["Urticarial vasculitis: wheals over 24 hours, burn or hurt, leave pigmentation; fever, malaise, myalgia; biopsy shows vasculitis", "Ordinary wheal: under 24 hours, no systemic signs"], "Tests": ["Acute: history only", "Chronic: CBC, ESR, CRP, stool for H. pylori and parasites, ANA, thyroid tests, autologous serum skin test, skin prick for suspected food", "DDx: atopic dermatitis, contact dermatitis, pityriasis rosea, drug eruption, erythema multiforme"], "Treatment": ["Avoid triggers; calamine or 1% menthol for itch", "Second-generation H1 antihistamine (cetirizine, fexofenadine, desloratadine, loratadine); if active after 2 weeks double the dose, up to 4 times", "Then add omalizumab (binds free IgE); then cyclosporine for severe autoimmune disease", "Prednisone 3-10 days only for severe acute urticaria or flares, not chronic", "Hydroxyzine or diphenhydramine at night (sedating)", "Add-ons: H2 blocker, doxepin, montelukast; mast cell stabilizer in cholinergic"]}}, "pem": {"n": "Pemphigus vulgaris", "c": "disease", "g": "bull", "pg": "", "sum": "Pemphigus vulgaris: autoantibodies to desmoglein 3 (then 1), acantholysis, suprabasal split. Flaccid bullae, mucosa first, Nikolsky and Asboe-Hansen positive. DIF net-like. Systemic steroid is life-saving; rituximab.", "rows": {"Lesion": "Intraepidermal autoimmune blistering. Most common and severe form. Adults over 40, F > M, Mediterranean groups at risk. Flaccid bullae rupture easily into raw areas that do not heal; mucosa first (pain, salivation, trouble feeding), skin after 6 months or more: chest, back, scalp, face, axillae. Vegetans: blisters or pustules becoming vegetating lesions in groin and axillae, better prognosis (localized, long remissions).", "Split level": "Deep: suprabasal acantholytic bullae (tombstone appearance of the basal layer). Desmoglein 3 sits mainly in lower layers and mucosa. Pemphigus vegetans has the same split.", "Key sign": "Nikolsky sign: sliding of epidermis under finger pressure on normal skin. Asboe-Hansen: bulla spreads under pressure. Mucous membranes involved in 100% of vulgaris. Generalized disease can be fatal.", "Antigen / immunity": "Autoantibodies to desmosomal proteins. Early: anti-Dsg3 only with mucosal disease. After 6-12 months anti-Dsg1 too, then skin lesions. Damage causes acantholysis. Four criteria: clinical, histology (suprabasal acantholysis), direct immunofluorescence of perilesional skin (net-like intercellular IgG, the best test), ELISA for serum autoantibodies.", "Treatment": "Assess general condition. Systemic steroid is the drug of choice and life-saving: 1-2 mg/kg/day, then taper to minimal maintenance (osteoporosis, diabetes, hypertension). Steroid-sparing: azathioprine, cyclophosphamide. Rituximab (anti-CD20): very effective, expensive. Adjuncts: treat infection, fluids, protein. Septicemia is the commonest cause of death. Other complications: secondary eczematization, hypoproteinemia, dehydration, dysphagia and malnutrition."}, "bk": 1, "rs": {"Lesion": "Flaccid bullae, mucosa first. Age over 40. Vegetans is the milder form.", "Split level": "Suprabasal acantholysis, tombstone basal cells (Dsg3).", "Key sign": "Nikolsky and Asboe-Hansen positive. Mucosa involved in 100%.", "Antigen / immunity": "Anti-Dsg3 first, then Dsg1. DIF: net-like intercellular IgG, best test.", "Treatment": "Systemic steroid 1-2 mg/kg/day, life-saving. Azathioprine; rituximab. Sepsis is the commonest cause of death."}, "rb": {"Lesion": ["Intraepidermal autoimmune blistering; commonest and most severe form", "Adults over 40, F > M; Mediterranean groups at risk", "Flaccid bullae rupture into raw areas that do not heal", "Mucosa first (pain, salivation, trouble feeding); skin 6 months or more later: chest, back, scalp, face, axillae", "Vegetans: vegetating lesions in groin and axillae; better prognosis, long remissions"], "Split level": ["Suprabasal acantholysis; tombstone basal cells", "Dsg3 sits mainly in lower layers and mucosa", "Vegetans has the same split"], "Key sign": ["Nikolsky: epidermis slides under finger pressure on normal skin", "Asboe-Hansen: bulla spreads under pressure", "Mucosa involved in 100%", "Generalized disease can be fatal"], "Antigen / immunity": ["Early: anti-Dsg3 only, mucosal disease. After 6-12 months anti-Dsg1 too, then skin lesions", "Diagnosis, 4 criteria: clinical; histology (suprabasal acantholysis); DIF of perilesional skin (net-like intercellular IgG, best test); ELISA serum antibodies"], "Treatment": ["Systemic steroid is the drug of choice, life-saving: 1-2 mg/kg/day, taper to lowest dose (osteoporosis, diabetes, hypertension)", "Steroid-sparing: azathioprine, cyclophosphamide", "Rituximab (anti-CD20): very effective, expensive", "Supportive: treat infection, fluids, protein", "Septicemia is the commonest cause of death; also eczematization, low protein, dehydration, dysphagia, malnutrition"]}}, "dh": {"n": "Dermatitis herpetiformis", "c": "disease", "g": "bull", "pg": "", "sum": "Dermatitis herpetiformis: the only IgA-mediated bullous disease. Skin sign of gluten-sensitive enteropathy (celiac). Very itchy, polymorphic, extensor sites. Gluten-free diet, dapsone.", "rows": {"Lesion": "Chronic severely pruritic relapsing polymorphic eruption, ages 30-50. Papules, vesicles (rarely seen, scratched off), excoriations, erythema, urticarial lesions. Knees, elbows, shoulders, pelvic girdle, extensor limbs.", "Split level": "Subepidermal cleft at the dermal papillae sparing rete ridges, with neutrophilic microabscesses.", "Key sign": "Severe itch. Almost all patients have celiac disease, even if silent.", "Antigen / immunity": "Autoimmune, IgA, skin manifestation of gluten sensitivity (wheat, rye, barley). Complications: secondary infection, eczematization, psychological upset.", "Treatment": "First line gluten-free diet. Drug of choice dapsone 100-200 mg/day (2-4 tablets of 50 mg): hemolysis (monitor RBCs), liver (bilirubin). Sulfa allergy: steroids. No maintenance after cure."}, "bk": 1, "rb": {"Lesion": ["Chronic, severely itchy, relapsing, polymorphic; age 30-50", "Papules, vesicles (rarely seen, scratched off), excoriations, erythema, urticarial lesions", "Knees, elbows, shoulders, pelvic girdle, extensors"], "Split level": ["Subepidermal cleft at dermal papillae, sparing rete ridges; neutrophilic microabscesses"], "Key sign": ["Severe itch", "Almost all have celiac disease, even if silent"], "Antigen / immunity": ["IgA-mediated; skin sign of gluten sensitivity (wheat, rye, barley)", "Complications: secondary infection, eczematization, psychological upset"], "Treatment": ["First line: gluten-free diet", "Drug of choice dapsone 100-200 mg/day: hemolysis (monitor RBCs), liver (bilirubin)", "Sulfa allergy: steroids; no maintenance after cure"]}}, "sca": {"n": "Scabies", "c": "disease", "pg": "", "g": "para", "sum": "Sarcoptes scabiei var. hominis (Acarus). Female mite burrows in the stratum corneum. Nocturnal itch, burrows in finger webs. Permethrin 5% is the drug of choice. Treat all contacts.", "rows": {"Cause": "Female mite of Sarcoptes scabiei var. hominis, an obligate human parasite, in the stratum corneum (not below the granular layer). Classic case: only 10-15 female mites. Cycle 10-17 days, 2-3 eggs a day, eggs hatch in 3-4 days. Incubation 2-6 weeks first time, 1-4 days on re-exposure. Spread: close contact (most important), sexual, fomites. Overcrowding. Lesions are immediate and delayed hypersensitivity.", "Lesion": "Burrow is the initial lesion: 5-12 mm grey-brown line, black dot at the blind end, vesicle or papule at the other. Polymorphic: linear scratch marks, excoriated papules, pustules (infection), crusts, urticarial wheals. No vesicles or bullae in adults. Finger webs, wrists, elbows, ulnar forearm, axillae, waist, periumbilical, buttocks, breast, male genitalia. Itch worse at night.", "Key sign": "Penis involvement in males is pathognomonic. Adults spare face, palms, soles and back, but infants are generalized with vesicles and bullae on palms and soles, face and scalp. Incognito: steroid-masked, stop the steroid and give a scabicide. Nodular: itchy nodules on scrotum, axillae, buttocks, persist after mites die. Crusted (Norwegian): thousands to millions of mites, thick scaly plaques, subungual hyperkeratosis, little or no itch, one case = epidemic. Animal: contact sites, no burrows, self-limited. Bullous: rare, mimics pemphigoid.", "Complications": "Bacterial infection (commonest), eczematization, urticaria, acarophobia. Crusted scabies: Down syndrome, leprosy, syringomyelia, tabes, leukemia, diabetes, immunosuppression.", "Treatment": "Permethrin 5% (drug of choice): neck down, 8-14 hours overnight, repeat after 7 days if needed. Safe in pregnancy, lactation and children over 2 months. Sulfur 2-10% (safe in pregnancy and infants). Benzyl benzoate 10-25% irritates infants. Gamma benzene hexachloride 1% is neurotoxic in infants and pregnancy. Crotamiton relieves itch only. Ivermectin 200 microgram/kg, repeat after 1-2 weeks (acts on mites not eggs, GABA block): crusted, epidemics, institutions. Not for under 15 kg, pregnancy or lactation. Nodules: topical or intralesional steroid. Diagnosis: scraping, dermoscopy, biopsy."}, "bk": 1, "rs": {"Cause": "Sarcoptes scabiei var. hominis, in stratum corneum. Spread by close contact.", "Lesion": "Burrow with black dot, finger webs, wrists, genitalia. Nocturnal itch.", "Key sign": "Penile lesions are pathognomonic. Crusted (Norwegian): millions of mites, little itch.", "Complications": "Secondary bacterial infection commonest. Crusted in Down syndrome, immunosuppression.", "Treatment": "Permethrin 5% overnight 8-14 hours, repeat in 7 days. Treat all contacts."}, "rb": {"Cause": ["Female Sarcoptes scabiei var. hominis, obligate human parasite, in stratum corneum (not below granular layer)", "Classic case: only 10-15 female mites; cycle 10-17 days; 2-3 eggs a day; eggs hatch in 3-4 days", "Incubation 2-6 weeks first time, 1-4 days on re-exposure", "Spread
