: "", "sum": "Papulosquamous rash that includes palms and soles. Do serology (VDRL/TPHA).", "rows": {}, "g": "paps"}, "aa": {"n": "Alopecia areata", "c": "lookalike", "pg": "", "sum": "Non-scarring patchy hair loss; regular nail pitting (can mimic psoriasis).", "rows": {}, "g": "paps"}, "iv": {"n": "Ichthyosis vulgaris", "c": "disease", "g": "geno", "pg": "", "sum": "Most common inherited ichthyosis. Filaggrin defect.", "rows": {"Inheritance / gene": "Autosomal dominant; filaggrin gene (loss of function).", "Onset": "After 3 months, usually childhood.", "Lesion": "Fine scales, coarser on the legs, attached centrally with free edge; worse in winter.", "Spared / favoured": "Extensors main; flexures (axillary fold) spared; palms and soles hyperlinear.", "Key associations": "Atopy (asthma, atopic dermatitis), keratosis pilaris.", "Histology": "Compact orthokeratosis with reduced granular layer.", "Course / prognosis": "Benign; improves with age.", "Treatment": "Emollients and urea; keratolytics (salicylic acid) for palms and soles."}}, "xli": {"n": "X-linked ichthyosis", "c": "disease", "g": "geno", "pg": "", "sum": "Males only. Large dark 'dirty neck' scales from the first months, with corneal opacity and cryptorchidism.", "rows": {"Inheritance / gene": "X-linked recessive (steroid sulfatase deficiency); males from carrier mother.", "Onset": "Before 3 months.", "Lesion": "Large dark tan or grey scales on limbs, trunk, neck: 'dirty neck' look.", "Spared / favoured": "Palms and soles rarely involved; flexures may be involved.", "Key associations": "Corneal opacity, cryptorchidism; no keratosis pilaris and no atopy.", "Histology": "Compact orthokeratosis; granular layer normal or increased.", "Course / prognosis": "Static; improves in sun; changes little with age.", "Treatment": "Emollients, keratolytics; retinoids if severe."}}, "lam": {"n": "Lamellar ichthyosis", "c": "disease", "g": "geno", "pg": "", "sum": "Autosomal recessive, present at birth as collodion baby. Thick plate-like scales over the whole body with ectropion.", "rows": {"Inheritance / gene": "Autosomal recessive (transglutaminase-1 in most).", "Onset": "At birth (collodion membrane, sheds in 2-3 weeks).", "Lesion": "Thick brown plate-like scales about 1 cm, attached centrally with free edge.", "Spared / favoured": "Whole skin including palms and soles (hyperkeratosis).", "Key associations": "Ectropion almost always; eclabium.", "Histology": "Massive compact orthohyperkeratosis; granular layer intact.", "Course / prognosis": "Worst prognosis of the three; severe form.", "Treatment": "Emollients, keratolytics; systemic retinoids (acitretin) for severe disease."}}, "eb": {"n": "Epidermolysis bullosa", "c": "disease", "g": "geno", "pg": "", "sum": "Inherited blistering from minor trauma. The level of cleavage tells the type: simplex (epidermis), junctional (lamina lucida), dystrophic (below lamina densa).", "rows": {"Inheritance / gene": "Simplex: keratin 5 and 14 (AD). Junctional: laminin / integrin (AR).", "Onset": "Birth or early infancy; hands and feet blisters when walking begins (simplex).", "Lesion": "Blisters at sites of trauma.", "Spared / favoured": "Simplex: palms and soles, heals without scarring; junctional: also airway and teeth; dystrophic: scarring.", "Key associations": "Junctional: enamel (tooth) defects. Dystrophic: scarring, mitten deformity, SCC. Bart syndrome = dominant dystrophic with congenital absence of skin.", "Histology": "Simplex: intraepidermal. Junctional: lamina lucida.", "Course / prognosis": "Simplex mild; junctional (Herlitz) can be fatal; dystrophic chronic.", "Treatment": "Wound care, trauma avoidance; no cure."}}, "xp": {"n": "Xeroderma pigmentosum", "c": "disease", "g": "geno", "pg": "", "sum": "Autosomal recessive defect in DNA repair (UV damage). Early photosensitivity, freckling and skin cancers.", "rows": {"Inheritance / gene": "Autosomal recessive; defective DNA (nucleotide excision) repair.", "Onset": "Infancy: acute prolonged sunburn on little sun exposure, freckles from age 1-2.", "Lesion": "Freckle-like pigmentation, mottled hypo/hyperpigmentation, atrophy, telangiectasia.", "Spared / favoured": "Sun-exposed areas.", "Key associations": "Photophobia, corneal opacification, ectropion; skin cancers (BCC, SCC, melanoma) before age 20 and internal neoplasms.", "Histology": "-.", "Course / prognosis": "Progressive; high cancer risk.", "Treatment": "Strict sun protection, early cancer excision; oral retinoids for prevention."}}, "lep_tt": {"n": "Tuberculoid leprosy", "c": "disease", "g": "lep", "pg": "", "sum": "Intact cell-mediated immunity. One or few anesthetic hypopigmented plaques, early asymmetrical nerve damage, no bacilli.", "rows": {"Immunity": "Intact cell-mediated immunity (Th1).", "Skin lesions": "Single or few well-defined erythematous or hypopigmented plaques, hairless, anhidrotic, anesthetic.", "Nerves": "Asymmetrical, early, thickened (ulnar, great auricular, posterior tibial).", "Smear / histology": "Epithelioid granulomas along nerves, Langhans cells; no organisms; smear negative.", "Other features": "Lepromin test positive.", "Treatment": "Paucibacillary MDT: rifampicin 600 mg monthly + dapsone 100 mg daily, 6-9 months."}}, "lep_ll": {"n": "Lepromatous leprosy", "c": "disease", "g": "lep", "pg": "", "sum": "Depressed cell-mediated immunity. Many symmetrical poorly defined lesions, late nerve damage, many bacilli, leonine face.", "rows": {"Immunity": "Depressed cell-mediated immunity.", "Skin lesions": "Multiple poorly defined macules, papules, nodules, plaques; symmetrical; leonine face.", "Nerves": "Bilateral and symmetrical, late; stocking-glove anesthesia.", "Smear / histology": "Foamy histiocytes (Virchow cells) full of bacilli; Grenz zone; smear strongly positive (Fite, ZN).", "Other features": "Madarosis, nasal bleeding, saddle nose, earlobes, acquired ichthyosis of legs; lepromin negative; ENL (type 2 reaction).", "Treatment": "Multibacillary MDT: rifampicin 600 mg monthly + clofazimine + dapsone, 12-18 months."}}, "acne": {"n": "Acne vulgaris", "c": "disease", "g": "more", "pg": "", "sum": "Pilosebaceous disease (C. acnes in the hair follicle). Comedones, papules, pustules, nodules.", "rows": {"Lesion": "Comedones, inflammatory papules and pustules, nodulocystic lesions.", "Key sign": "Pilosebaceous unit; C. acnes lives in the hair follicle.", "Trigger / link": "Hormonal flares on the lower face in adult women.", "Treatment": "Comedonal: topical tretinoin. Hormonal adult female: spironolactone."}}, "urt": {"n": "Urticaria", "c": "disease", "g": "more", "pg": "", "sum": "Wheals that come and go. Acute urticaria is often idiopathic.", "rows": {"Lesion": "Polymorphic itchy wheals.", "Key sign": "Wheals fade within 24 hours.", "Trigger / link": "Acute: idiopathic most common, then infections, drugs, food.", "Treatment": "Second-generation antihistamine (loratadine) first line."}}, "eczema": {"n": "Eczema (atopic, irritant)", "c": "disease", "g": "more", "pg": "", "sum": "Atopic dermatitis is chronic relapsing; irritant contact dermatitis is direct damage.", "rows": {"Lesion": "Itchy erythematous scaly or vesicular patches.", "Key sign": "AD: chronic relapsing course (major criterion); Dennie-Morgan folds are minor.", "Trigger / link": "Irritant: direct immediate damage (not hypersensitivity). Atopy, filaggrin.", "Treatment": "Regular emollients prevent flares; avoid harsh cleansers and hot baths; topical steroids."}}, "pem": {"n": "Pemphigus vulgaris", "c": "disease", "g": "bull", "pg": "", "sum": "Anti-desmoglein 3 (and 1) IgG. Flaccid bullae, mouth first, suprabasal acantholysis, Nikolsky positive.", "rows": {"Lesion": "Flaccid bullae and erosions; mouth often first.", "Split level": "Suprabasal (tombstone cells).", "Key sign": "Nikolsky positive, Asboe-Hansen.", "Antigen / immunity": "IgG vs desmoglein 3 +/- 1; DIF intercellular 'fishnet'.", "Treatment": "Systemic steroids + azathioprine/mycophenolate/rituximab."}}, "dh": {"n": "Dermatitis herpetiformis", "c": "disease", "g": "bull", "pg": "", "sum": "Grouped itchy vesicles on extensors, buttocks, scapulae. Gluten and celiac.", "rows": {"Lesion": "Grouped itchy papulovesicles, excoriations; elbows, knees, buttocks, back.", "Split level": "Subepidermal (papillary neutrophil microabscess).", "Key sign": "Intense itching, polymorphic.", "Antigen / immunity": "IgA vs tissue/epidermal transglutaminase; celiac disease.", "Treatment": "Dapsone + gluten-free diet."}}, "alo": {"n": "Hair loss (alopecias)", "c": "disease", "g": "more", "pg": "", "sum": "AA: round smooth non-scarring patches, exclamation mark hairs, ophiasis worst.", "rows": {"Lesion": "AA: smooth round patches. TE: diffuse shedding.", "Key sign": "AA exclamation mark hair, nail pitting and trachyonychia. TE telogen club hairs.", "Trigger / link": "AA autoimmune (swarm of bees). TE fever, childbirth, drugs.", "Treatment": "AA steroids, DNCB, PUVA, JAK inhibitors. AGA minoxidil + finasteride."}}, "sca": {"n": "Scabies", "c": "disease", "g": "more", "pg": "", "sum": "Sarcoptes mite. Itchy burrows in finger webs and wrists.", "rows": {"Lesion": "Papules, burrows, vesicles; itch worse at night.", "Key sign": "Infants: face, scalp, palms and soles can be affected (not in adults).", "Trigger / link": "Overcrowding; scabies incognito from topical or systemic steroids.", "Treatment": "Permethrin topical; ivermectin is the systemic option."}}, "tin": {"n": "Tinea and favus", "c": "disease", "g": "more", "pg": "", "sum": "Dermatophyte infections. Favus is tinea capitis caused by Trichophyton schoenleinii.", "rows": {"Lesion": "Annular scaly plaques; favus = yellow scutula in the scalp.", "Key sign": "Favus: T. schoenleinii; tinea capitis Microsporum shows green fluorescence under Wood's lamp.", "Trigger / link": "Dermatophytes: Trichophyton, Microsporum, Epidermophyton.", "Treatment": "Itraconazole is a systemic antifungal; topical azoles."}}, "zos": {"n": "Varicella and herpes zoster (VZV)", "c": "disease", "g": "vir", "pg": "", "sum": "Primary VZV = chickenpox (centripetal crops of vesicles). Reactivation in a dermatome = zoster.", "rows": {"Lesion": "Chickenpox: crops of vesicles, face and trunk, mucosa. Zoster: unilateral grouped vesicles in a dermatome.", "Cause": "Varicella-zoster virus (dsDNA); latent in dorsal root ganglia.", "Key sign": "Hutchinson sign (tip of nose = nasociliary nerve = eye). Ramsay Hunt = geniculate ganglion.", "Smear / histology": "Same as HSV: multinucleated giant cells.", "Complications": "Post herpetic neuralgia (elderly), ocular zoster, scarring.", "Treatment": "Zoster: acyclovir 800 mg x5/day x7 days."}}, "gon": {"n": "Gonorrhea", "c": "disease", "g": "gono", "pg": "", "sum": "Gram-negative intracellular diplococci. Urethritis in men; often asymptomatic in women, with Bartholin and Skene gland spread.", "rows": {"Lesion": "Purulent urethral discharge, dysuria; DGI: pustules, tenosynovitis, arthritis.", "Cause": "Neisseria gonorrhoeae (Gram-negative intracellular diplococci).", "Key sign": "Men: Cowper glands; women: Bartholin, Skene. Women often asymptomatic.", "Tests": "Thayer-Martin agar; Gram stain; screen for other STIs.", "Treatment": "Ceftriaxone 250 mg IM once; cefixime 500 mg oral; add azithromycin for chlamydia."}}, "vit": {"n": "Vitiligo and pityriasis alba", "c": "disease", "g": "leuk", "pg": "", "sum": "Vitiligo: absence of melanocytes. Pityriasis alba: ill-defined hypopigmented scaly patches on a child's cheeks.", "rows": {"Lesion": "Vitiligo: chalk-white depigmented patches. Pityriasis alba: pale scaly patches on cheeks of children.", "Key sign": "Absent melanocytes. Acral and distal, periorificial.", "Cause / link": "Autoimmune; thyroid, Addison, pernicious anemia, AA. Not acromegaly.", "Treatment": "NB-UVB 311-312 nm (hepatic failure and extensive). Topical PUVA 0.05-0.1%, systemic 0.5 mg/kg."}}, "ed": {"n": "Erectile dysfunction", "c": "disease", "g": "more", "pg": "", "sum": "Nitric oxide drives erection (PDE-5 inhibitors raise cGMP). RigiScan measures tumescence and rigidity; penile duplex Doppler classifies the cause.", "rows": {"Lesion": "Inability to get or keep an erection.", "Key sign": "Short-lived erection = venogenic. Doppler PSV 45 / EDV 15 pattern = venogenic.", "Trigger / link": "Psychogenic, arteriogenic, venogenic, neurogenic.", "Treatment": "PDE-5 inhibitors (sildenafil etc.)."}}, "pf": {"n": "Pemphigus foliaceus", "c": "disease", "g": "bull", "pg": "", "sum": "Anti-desmoglein 1 only. Superficial scaly crusted erosions, mucosa spared, subcorneal split.", "rows": {"Lesion": "Scaly crusted erosions on seborrheic areas; no mouth lesions.", "Split level": "Subcorneal / granular.", "Key sign": "Nikolsky positive; bullae rarely seen intact.", "Antigen / immunity": "IgG vs desmoglein 1.", "Treatment": "Systemic steroids."}}, "bp": {"n": "Bullous pemphigoid", "c": "disease", "g": "bull", "pg": "", "sum": "Elderly, itchy, tense bullae on flexures, subepidermal split, anti-BP180/BP230 at hemidesmosomes.", "rows": {"Lesion": "Tense bullae on urticarial base; flexors, trunk, groin.", "Split level": "Subepidermal.", "Key sign": "Nikolsky negative; mucosa mostly spared; itchy.", "Antigen / immunity": "IgG vs BP180 (BP antigen 2) and BP230; linear IgG/C3 at BMZ; eosinophils.", "Treatment": "Topical or systemic steroids."}}, "ssss": {"n": "SSSS (staph scalded skin)", "c": "disease", "g": "bull", "pg": "", "sum": "Children under 5. Exfoliative toxin cuts desmoglein 1: red tender skin, peeling, perioral crusting, mucosa spared.", "rows": {"Lesion": "Diffuse tender erythema, then flaccid bullae and peeling; neck, axillae, groin, perioral.", "Split level": "Granular layer.", "Key sign": "Nikolsky positive; mucosa spared.", "Antigen / immunity": "Staph aureus exfoliative toxins A/B cleave desmoglein 1.", "Treatment": "IV anti-staphylococcal antibiotic (flucloxacillin), fluids."}}, "hsv": {"n": "Herpes simplex (HSV-1, HSV-2)", "c": "disease", "g": "vir", "pg": "", "sum": "DsDNA virus, latent in sensory ganglia. Grouped vesicles on an erythematous base at the mucocutaneous junction.", "rows": {"Lesion": "Grouped vesicles, then erosions and crusts; lips, genitals, finger (whitlow).", "Cause": "HSV-1 (oral) and HSV-2 (genital); latent in dorsal root ganglia.", "Key sign": "Recurrence at the same site; gingivostomatitis in primary infection.", "Smear / histology": "Tzanck: multinucleated giant cells. Ballooning degeneration.", "Complications": "Eczema herpeticum (KVE) in atopics, erythema multiforme, keratoconjunctivitis, whitlow.", "Treatment": "Primary: acyclovir 200 mg x5/day x5 days."}}, "warts": {"n": "Warts and condyloma acuminata (HPV)", "c": "disease", "g": "vir", "pg": "", "sum": "HPV: papules with hyperkeratosis. Types 6 and 11 cause genital warts, 16 and 18 are oncogenic (cervical cancer).", "rows": {"Lesion": "Verruca vulgaris, plana, plantaris, anogenital condyloma.", "Cause": "Human papillomavirus (dsDNA). 6 and 11 low risk. 16 and 18 high risk.", "Key sign": "Rough hyperkeratotic papule; thrombosed capillaries (black dots).", "Smear / histology": "Koilocytes (perinuclear halo), hyperkeratosis, papillomatosis.", "Complications": "Cervical cancer, laryngeal papillomatosis, disfigurement. Not blisters.", "Treatment": "Cryo, salicylic acid, podophyllin (not in pregnancy), imiquimod, laser."}}, "mc": {"n": "Molluscum contagiosum", "c": "disease", "g": "vir", "pg": "", "sum": "Poxvirus (dsDNA). Pearly dome-shaped umbilicated papules in children, atopics, HIV and sexually active adults.", "rows": {"Lesion": "Firm, pearly, dome-shaped, centrally umbilicated papule, 2-5 mm, in clusters.", "Cause": "Molluscum contagiosum virus (poxvirus, dsDNA).", "Key sign": "Cheesy white core on squeezing. BOTE sign when it resolves.", "Smear / histology": "Eosinophilic, non-nucleated Henderson-Patterson bodies in keratinocytes.", "Complications": "Dermatitis around lesions, extensive in HIV.", "Treatment": "Curettage, cryo, cautery, cantharidin. No antiviral."}}, "alb": {"n": "Oculocutaneous albinism", "c": "disease", "g": "leuk", "pg": "", "sum": "Autosomal recessive tyrosinase defect: melanocytes present, melanin absent.", "rows": {"Lesion": "Milky white skin, white hair, pale irises.", "Key sign": "Nystagmus, photophobia. No reticulate pigmentation.", "Cause / link": "AR (cousin marriage), tyrosinase deficiency, melanocytes present.", "Treatment": "Sun protection, eye care, skin cancer surveillance."}}, "mel": {"n": "Melanocyte biology and piebaldism", "c": "disease", "g": "leuk", "pg": "", "sum": "Melanocytes: neural crest origin, basal layer, 1 to about 36 keratinocytes.", "rows": {"Lesion": "Piebaldism: white forelock, depigmented patches with hyperpigmented islands.", "Key sign": "Melanocytes in basal layer, mucosa, uvea, substantia nigra (not suprarenal gland).", "Cause / link": "Neural crest; melanogenesis enzymes: tyrosinase, hydroxylase (aromatase is not one).", "Treatment": "Piebaldism: camouflage, grafting."}}, "vkh": {"n": "Vogt-Koyanagi-Harada syndrome", "c": "disease", "g": "leuk", "pg": "", "sum": "Autoimmune attack on melanocytes: uveitis, meningismus, poliosis, vitiligo-like depigmentation, alopecia.", "rows": {"Lesion": "Vitiligo-like patches, poliosis of scalp and eyebrows, alopecia.", "Key sign": "Uveitis + meningismus + poliosis.", "Cause / link": "Autoimmune vs melanocytes. Not Chediak-Higashi, not Waardenburg.", "Treatment": "Systemic steroids."}}, "syp1": {"n": "Primary syphilis and chancre", "c": "disease", "g": "syph", "pg": "", "sum": "Painless indurated eroded papule at the site of inoculation, regional painless firm mobile nodes.", "rows": {"Lesion": "Single painless indurated eroded papule (hard base).", "Cause": "Treponema pallidum, sexual contact.", "Key sign": "Regional, painless, mobile, firm nodes. Multiple chancres with abrasions.", "Tests": "Dark-field from the lesion; serology often negative early.", "Treatment": "Benzathine penicillin G 2.4 MU IM once."}}, "syp2": {"n": "Secondary syphilis", "c": "disease", "g": "syph", "pg": "", "sum": "Fever, generalized lymphadenopathy, non-itchy coppery red symmetrical rash including palms and soles.", "rows": {"Lesion": "Maculopapular, follicular, psoriasiform; palmoplantar; condylomata lata; moth-eaten alopecia.", "Cause": "Hematogenous spread of T. pallidum.", "Key sign": "Coppery red, non-pruritic rash; condylomata lata (not acuminata).", "Tests": "RPR/VDRL initial; plasma cells + endarteritis on histology.", "Treatment": "Penicillin G IM. Rare: hepatitis."}}, "syp3": {"n": "Tertiary syphilis and neurosyphilis", "c": "disease", "g": "syph", "pg": "", "sum": "Gumma, aortitis, neurosyphilis. VDRL may be negative, FTA-ABS stays positive.", "rows": {"Lesion": "Gumma (granulomatous nodule/ulcer).", "Cause": "Late T. pallidum disease.", "Key sign": "Aortitis, tabes, memory loss, CSF pleocytosis.", "Tests": "FTA-ABS positive when VDRL negative; CSF VDRL.", "Treatment": "Penicillin (late)."}}, "sypt": {"n": "Syphilis serology and treatment", "c": "disease", "g": "syph", "pg": "", "sum": "Treponemal tests (FTA-ABS, TPHA) stay positive for life. Non-treponemal tests (VDRL, RPR) are sensitive, not specific, and follow response.", "rows": {"Lesion": "-.", "Cause": "Cardiolipin antigen (non-treponemal) vs treponemal antigen.", "Key sign": "Biologic false positives with VDRL/RPR.", "Tests": "Dark-field (early); RPR initial; FTA-ABS confirm; VDRL to monitor.", "Treatment": "Primary/secondary: benzathine penicillin IM once. Late latent: weekly x3."}}, "ery": {"n": "Erythroderma", "c": "disease", "g": "ery", "pg": "", "sum": "Erythema and scaling over more than 90% of the skin. Commonest cause: generalization of a pre-existing dermatosis.", "rows": {"Lesion": "Erythema and scaling >90% BSA; hyperpigmentation when chronic.", "Cause": "Pre-existing dermatoses (commonest), drugs, lymphoma, idiopathic.", "Key sign": "Pruritus; generalized lymphadenopathy suggests lymphoma.", "Tests": "Skin biopsy, lymph node biopsy if large nodes.", "Treatment": "Treat cause; fluids, emollients. High-output heart failure from skin blood flow."}}, "skin": {"n": "Skin structure and functions", "c": "disease", "g": "init", "pg": "", "sum": "Epidermis (keratin, melanocytes), dermis (reticular layer rich in follicles), appendages (glands, hair, nails; not melanocytes).", "rows": {"Definition": "Organ of defence, secretion, excretion, temperature regulation.", "Key points": "Appendages: sebaceous, eccrine, apocrine, hair, nails. Reticular dermis has hair follicles.", "Exam hook": "Melanocytes are NOT appendages."}}, "les": {"n": "Primary and secondary lesions", "c": "disease", "g": "init", "pg": "", "sum": "Patch/plaque, vesicle/bulla, cyst, erosion (part of epidermis, no scar), ulcer, lichenification, Koebner phenomenon, target lesion.", "rows": {"Definition": "Plaque = raised change in texture. Vesicle vs bulla = size.", "Key points": "Erosion: rupture of vesicle, heals without scar. Lichenification: thick, accentuated markings, NOT thin skin.", "Exam hook": "Koebner positive: psoriasis, LP, warts. Not eczema."}}, "dx": {"n": "Diagnostic aids and vehicles", "c": "disease", "g": "init", "pg": "", "sum": "Wood's light colours, scraping for scabies, NB-UVB 311-312 nm, gel for hairy areas.", "rows": {"Definition": "Wood's light: tinea capitis green, erythrasma coral red, pityriasis versicolor yellow.", "Key points": "NB-UVB 311-312 nm. Methyl cellulose in gels.", "Exam hook": "Gel is suited to hairy areas. Crotamiton key is arguable."}}, "minf": {"n": "Male infertility", "c": "disease", "g": "more", "pg": "", "sum": "Semen analysis separates oligo-, astheno-and teratozoospermia. CHECK: not confirmed.", "rows": {"Lesion": "Semen: low count, poor motility or abnormal forms. Retrograde ejaculation: aspermia with sperm in post-ejaculation urine.", "Key sign": "Obstructive azoospermia: normal testis size, normal FSH and LH. Non-obstructive: small testes, high FSH.", "Trigger / link": "Anabolic steroids, varicocele, bladder neck surgery, genital tract obstruction.", "Treatment": "Treat the cause. Idiopathic with normal gonadotropins: clomiphene or tamoxifen."}}, "bac": {"n": "Bacterial skin infections", "c": "disease", "g": "more", "pg": "", "sum": "Staph aureus and group A strep cause most pyoderma. Impetigo gives honey-crusted erosions, erysipelas a sharply demarcated red hot plaque, erythrasma a coral-red Wood light glow. CHECK: not confirmed.", "rows": {"Lesion": "Impetigo: honey-crusted erosions. Folliculitis: follicular pustules.", "Key sign": "Erysipelas: fever and raised sharp edge. Cellulitis is deeper with ill-defined edge.", "Trigger / link": "Staph aureus (impetigo, folliculitis, boils), group A strep (erysipelas, non-bullous impetigo), Corynebacterium minutissimum (erythrasma).", "Treatment": "Limited impetigo: topical mupirocin or fusidic acid. Extensive: oral anti-staph antibiotic."}}, "lepx": {"n": "Leprosy (other points)", "c": "disease", "g": "lep", "pg": "", "sum": "Immunity decides the type: strong cell-mediated response gives tuberculoid, weak gives lepromatous. CHECK: not confirmed.", "rows": {"Immunity": "Cell-mediated (Th1) immunity: strong in tuberculoid, weak in lepromatous.", "Skin lesions": "Borderline forms sit between the two poles and can shift. Hypopigmented anesthetic patches are typical.", "Nerves": "Thickened peripheral nerves, sensory loss, claw hand, foot drop.", "Smear / histology": "Slit-skin smear for bacilli. Lepromin test shows immunity and does not diagnose.", "Other features": "Reactions: type 1 (reversal) and type 2 (ENL). Caused by Mycobacterium leprae.", "Treatment": "Multidrug therapy: rifampicin, dapsone and clofazimine for multibacillary; rifampicin and dapsone for paucibacillary."}}, "bmisc": {"n": "SJS, TEN and drug blistering", "c": "disease", "g": "bull", "pg": "", "sum": "Stevens-Johnson syndrome and toxic epidermal necrolysis are drug-induced epidermal necrosis with mucosal erosions. CHECK: not confirmed.", "rows": {"Lesion": "Targetoid or dusky macules, then blisters and epidermal detachment with mucosal erosions.", "Split level": "Full-thickness epidermal necrosis, subepidermal split.", "Key sign": "Nikolsky positive. SJS under 10% BSA, overlap 10-30%, TEN over 30%.", "Antigen / immunity": "Drug-induced cytotoxic T-cell keratinocyte death: allopurinol, sulfonamides, anticonvulsants, NSAIDs.", "Treatment": "Stop the culprit drug, supportive burn-unit care. IVIG or cyclosporine are used."}}, "vmisc": {"n": "Other viral skin infections", "c": "disease", "g": "vir", "pg": "", "sum": "Viral skin infections other than HSV, VZV, HPV and molluscum: herpetic eye disease, the nerve supply of cornea and skin, and HPV types. CHECK: not confirmed.", "rows": {"Lesion": "Vesicles on an erythematous base (herpes), flesh-colored papules (warts).", "Cause": "Herpes viruses (HSV, VZV), HPV, poxvirus (molluscum).", "Key sign": "Tzanck smear: multinucleated giant cells in HSV and VZV.", "Smear / histology": "Herpetic keratoconjunctivitis can cause corneal scarring and blindness.", "Complications": "Acyclovir or valacyclovir for herpes. Cryotherapy for warts.", "Treatment": "Trigeminal nerve (ophthalmic division) supplies cornea and forehead skin."}}}, "C": [{"k": "auspitz", "n": "Auspitz sign", "t": "sign", "d": ["psoriasis"], "note": "Pinpoint bleeding after scale removal."}, {"k": "wickham", "n": "Wickham striae", "t": "sign", "d": ["lp"], "note": "Fine white network on LP papules."}, {"k": "herald", "n": "Herald patch", "t": "sign", "d": ["pr"], "note": "Single salmon patch with collarette, 80% of cases."}, {"k": "oil", "n": "Oil drop nail", "t": "sign", "d": ["psoriasis"], "note": "Most specific nail sign of psoriasis."}, {"k": "pterygium", "n": "Pterygium unguis", "t": "sign", "d": ["lp"], "note": "Most specific nail sign of LP."}, {"k": "pitting", "n": "Nail pitting", "t": "sign", "d": ["psoriasis", "aa"], "note": "DDx of nail pitting: psoriasis and alopecia areata."}, {"
