: close contact (most important), sexual, fomites; overcrowding", "Lesions: immediate and delayed hypersensitivity"], "Lesion": ["Burrow is the initial lesion: 5-12 mm grey-brown line, black dot at blind end, vesicle or papule at other", "Polymorphic: scratch marks, excoriated papules, pustules (infection), crusts, urticarial wheals; no vesicles or bullae in adults", "Sites: finger webs, wrists, elbows, ulnar forearm, axillae, waist, periumbilical, buttocks, breast, male genitalia", "Itch worse at night"], "Key sign": ["Penile involvement in males is pathognomonic", "Adults spare face, palms, soles, back; infants generalized with vesicles and bullae on palms, soles, face, scalp", "Incognito: steroid-masked; stop steroid, give scabicide", "Nodular: itchy nodules on scrotum, axillae, buttocks; persist after mites die", "Crusted (Norwegian): thousands to millions of mites, thick scaly plaques, subungual hyperkeratosis, little or no itch; one case = epidemic", "Animal: contact sites, no burrows, self-limited. Bullous: rare, mimics pemphigoid"], "Complications": ["Bacterial infection (commonest), eczematization, urticaria, acarophobia", "Crusted scabies: Down syndrome, leprosy, syringomyelia, tabes, leukemia, diabetes, immunosuppression"], "Treatment": ["Permethrin 5%, drug of choice: neck down, 8-14 hours overnight, repeat after 7 days; safe in pregnancy, lactation, children over 2 months", "Sulfur 2-10%: safe in pregnancy and infants", "Benzyl benzoate 10-25%: irritates infants", "Gamma benzene hexachloride 1%: neurotoxic in infants and pregnancy", "Crotamiton: relieves itch only", "Ivermectin 200 microgram/kg, repeat after 1-2 weeks (acts on mites not eggs): crusted, epidemics, institutions; not under 15 kg, pregnancy, lactation", "Nodules: topical or intralesional steroid. Diagnosis: scraping, dermoscopy, biopsy"]}}, "zos": {"n": "Varicella and herpes zoster (VZV)", "c": "disease", "g": "vir", "pg": "", "sum": "Varicella: airborne, incubation 11-20 days, lesions in all stages. Zoster: reactivation in a dermatome, painful unilateral grouped vesicles. Postherpetic neuralgia is the commonest complication. Early antiviral.", "rows": {"Lesion": "Varicella: itchy erythematous macules and papules from scalp and face to trunk, then 1-3 mm clear vesicles on a red halo (dew drops on a rose petal), pustules, crusts. Lesions in all stages together (polymorphism, hallmark). Oral mucosa involved, distal limbs spared, resolves in 7-10 days. Zoster: prodrome of itch, tingling, pain (may mimic MI or surgical abdomen), then painful grouped vesicles on a red base in one dermatome (trunk commonest, then face). Zoster sine herpete: pain without rash.", "Cause": "VZV. Varicella: airborne droplets (the exception among viral skin infections), vesicular fluid; incubation 11-20 days; infectious from 1-2 days before the rash until all crusted. Viremia 14-16 days post exposure, then latent in dorsal root ganglia. Zoster: 20% lifetime risk after varicella; triggers trauma, inflammation, debilitating disease, immunosuppression; vesicle fluid can give varicella (not zoster) to seronegative contacts. Vaccine Varivax: live attenuated, 2 doses (12-15 months and 4-6 years), over 99% protection after two doses.", "Key sign": "Zoster cranialis: trigeminal (frontalis; ophthalmicus with Hutchinson sign, vesicles on the side or tip of the nose = nasociliary branch = eye at risk; maxillary on uvula and tonsils; mandibular on posterior tongue and buccal mucosa). Facial nerve: the only type with motor symptoms; Ramsay Hunt syndrome (geniculate ganglion): ear canal and drum vesicles, anterior two-thirds tongue and hard palate, ear pain, peripheral facial palsy, loss of taste, dry mouth and eyes; tinnitus, deafness and vertigo if vestibulocochlear nerve joins. Types by site: cervical, pectoral, abdominal, lumbosacral.", "Smear / histology": "Same histology as HSV (ballooning, multinucleated giant cells). Tzanck smear positive. Bilateral or very widespread zoster: think immunocompromise.", "Complications": "Varicella: secondary bacterial infection (commonest), encephalitis and cerebellar ataxia, Reye syndrome (encephalitis plus fatty liver; avoid aspirin), pneumonia in adults (10-30% mortality untreated), severe disease in immunocompromised, maternal varicella in first 20 weeks: 2% congenital varicella syndrome (low birth weight, scarring, eye defects, cortical atrophy, limb hypoplasia). Zoster: postherpetic neuralgia (commonest), corneal scarring, facial palsy, hearing loss, secondary infection, gangrene, meningoencephalitis, disseminated disease (over 20 vesicles outside the dermatome, in immunocompromised).", "Treatment": "Varicella: rest, antipyretics (not aspirin), antihistamines, drying agents, antibiotics if infected; IV acyclovir or immune globulin in severe cases and pregnant adults. Zoster: oral antiviral first line (acyclovir 800 mg five times daily for 7 days), best within 72 hours, still useful up to 7 days; analgesics, steroid in some cases, gabapentin to reduce postherpetic neuralgia, topical analgesic and drying agents, antibiotic if infected."}, "bk": 1, "rb": {"Lesion": ["Varicella: itchy red macules and papules scalp and face to trunk, then 1-3 mm clear vesicles on red halo (dew drops on a rose petal), pustules, crusts", "Lesions in all stages together: hallmark. Oral mucosa involved, distal limbs spared, resolves in 7-10 days", "Zoster: prodrome itch, tingling, pain (may mimic MI or acute abdomen), then painful grouped vesicles on red base in one dermatome (trunk commonest, then face)", "Zoster sine herpete: pain without rash"], "Cause": ["VZV. Varicella: airborne droplets (exception among viral skin infections), vesicular fluid; incubation 11-20 days; infectious 1-2 days before rash until all crusted", "Viremia 14-16 days post exposure, then latent in dorsal root ganglia", "Zoster: 20% lifetime risk; triggers trauma, inflammation, debilitating disease, immunosuppression; vesicle fluid gives varicella (not zoster) to seronegative contacts", "Vaccine Varivax: live attenuated, 2 doses (12-15 months, 4-6 years), over 99% protection after two"], "Key sign": ["Trigeminal zoster: frontal; ophthalmicus with Hutchinson sign (vesicles on side or tip of nose = nasociliary branch = eye at risk); maxillary: uvula and tonsils; mandibular: posterior tongue and buccal mucosa", "Facial nerve: only type with motor signs; Ramsay Hunt (geniculate ganglion): ear canal and drum vesicles, anterior two-thirds of tongue and hard palate, ear pain, facial palsy, loss of taste, dry mouth and eyes; tinnitus, deafness, vertigo if vestibulocochlear joins", "Sites: cervical, pectoral, abdominal, lumbosacral"], "Smear / histology": ["Same as HSV: ballooning, multinucleated giant cells; Tzanck positive", "Bilateral or very widespread zoster: think immunocompromise"], "Complications": ["Varicella: secondary bacterial infection (commonest), encephalitis and cerebellar ataxia, Reye syndrome (encephalitis + fatty liver; avoid aspirin), adult pneumonia (10-30% mortality untreated), severe in immunocompromised", "Maternal varicella in first 20 weeks: 2% congenital varicella syndrome (low birth weight, scarring, eye defects, cortical atrophy, limb hypoplasia)", "Zoster: postherpetic neuralgia (commonest), corneal scarring, facial palsy, hearing loss, secondary infection, gangrene, meningoencephalitis, dissemination (over 20 vesicles outside dermatome, immunocompromised)"], "Treatment": ["Varicella: rest, antipyretics (not aspirin), antihistamines, drying agents, antibiotics if infected; IV acyclovir or immune globulin in severe cases and pregnant adults", "Zoster: oral antiviral first line (acyclovir 800 mg five times daily 7 days), best within 72 hours, useful up to 7 days", "Analgesics, steroid in some, gabapentin to reduce postherpetic neuralgia, topical analgesic and drying agents, antibiotic if infected"]}}, "gon": {"n": "Gonorrhea", "c": "disease", "pg": "", "g": "gono", "sum": "Neisseria gonorrhoeae, gram-negative intracellular diplococci. Shortest incubation of all STDs (3-5 days). Men: purulent urethral discharge with dysuria. Women: half asymptomatic. Treatment: ceftriaxone 250 mg IM once.", "rows": {"Lesion": "Men: acute anterior urethritis with burning micturition, profuse yellowish-green discharge, turbid urine; red edematous meatus oozing pus, stained underwear. Untreated: posterior urethritis (frequency, urgency, terminal hematuria). Women: 50% asymptomatic; urethral, vulval or cervical discharge. Children: acute vulvovaginitis (thin epithelium, low acidity), soreness, pus soaking underwear, rectum may be involved.", "Cause": "Neisseria gonorrhoeae (1879). Gram-negative kidney-shaped intracellular diplococci. Sexual 95%; indirect by towels, toilets, underwear, instruments. Incubation 3-5 days (2-14), the shortest of the STDs. Spreads along columnar epithelium. Women: urethra, cervix is the main source, Bartholin and Skene glands keep it chronic, squamous vagina is resistant, uterus and tubes by instruments, labour or douching.", "Key sign": "Complications: male: balanitis, Littre and Cowper gland infection, periurethral abscess, stricture and fistula, prostatitis, epididymitis, infertility. Female: Bartholin abscess, skenitis, salpingitis, pyosalpinx, PID, infertility (commoner because more are asymptomatic). Metastatic: arthritis, maculopapular skin rash, iritis, septicemia, myocarditis, endocarditis, meningitis. Accidental: proctitis, conjunctivitis.", "Tests": "Gram stain of discharge, culture on Thayer-Martin medium, oxidase and fermentation tests, fluorescent antibody. Urine analysis and culture. Also test for chlamydia and mycoplasma, HIV and syphilis serology. DDx of discharge: chlamydia, mycoplasma, Candida, Trichomonas, HSV, warts, non-specific urethritis.", "Treatment": "Education, treat partners, condoms. Ceftriaxone 250 mg IM single dose is the drug of choice. Alternatives: cefixime 500 mg oral, ciprofloxacin 500 mg oral, spectinomycin 2 g IM (specific for gonorrhea). Add azithromycin for chlamydia and mycoplasma. Children: procaine penicillin 400,000 IU daily for 4-5 days, or a cephalosporin."}, "bk": 1, "rb": {"Lesion": ["Men: acute anterior urethritis, burning micturition, profuse yellowish-green discharge, turbid urine; red edematous meatus oozing pus. Untreated: posterior urethritis (frequency, urgency, terminal hematuria)", "Women: 50% asymptomatic; urethral, vulval or cervical discharge", "Children: acute vulvovaginitis (thin epithelium, low acidity), pus soaking underwear; rectum may be involved"], "Cause": ["Neisseria gonorrhoeae: gram-negative kidney-shaped intracellular diplococci", "Sexual 95%; indirect by towels, toilets, underwear, instruments", "Incubation 3-5 days (2-14): shortest of the STDs", "Spreads along columnar epithelium. Women: cervix is main source; Bartholin and Skene glands keep it chronic; squamous vagina resistant; uterus and tubes via instruments, labour, douching"], "Key sign": ["Male: balanitis, Littre and Cowper gland infection, periurethral abscess, stricture, fistula, prostatitis, epididymitis, infertility", "Female: Bartholin abscess, skenitis, salpingitis, pyosalpinx, PID, infertility (commoner as more are asymptomatic)", "Metastatic: arthritis, maculopapular rash, iritis, septicemia, myocarditis, endocarditis, meningitis", "Accidental: proctitis, conjunctivitis"], "Tests": ["Gram stain of discharge; culture on Thayer-Martin medium; oxidase and fermentation tests; fluorescent antibody", "Test also for chlamydia, mycoplasma, HIV, syphilis serology", "DDx of discharge: chlamydia, mycoplasma, Candida, Trichomonas, HSV, warts, non-specific urethritis"], "Treatment": ["Education, treat partners, condoms", "Ceftriaxone 250 mg IM single dose: drug of choice", "Alternatives: cefixime 500 mg oral, ciprofloxacin 500 mg oral, spectinomycin 2 g IM (specific for gonorrhea)", "Add azithromycin for chlamydia and mycoplasma", "Children: procaine penicillin 400,000 IU daily 4-5 days, or a cephalosporin", "CHECK: current guidance uses ceftriaxone 500 mg"]}}, "vit": {"n": "Vitiligo and pityriasis alba", "c": "disease", "g": "leuk", "pg": "", "sum": "Acquired autoimmune depigmentation with loss of melanocytes. CD8 T cells and IFN-gamma are central. Wood lamp: bright blue-white. Topical steroid or calcineurin inhibitors first, then NB-UVB. Ruxolitinib cream is FDA approved.", "rows": {"Lesion": "Vitiligo: acquired chalk-white depigmented macules and patches of skin and mucosa, may involve hair (leukotrichia). Prevalence 0.5-2%, no sex difference. Generalized (bilateral symmetric, pressure and friction sites), acrofacial, mucosal, universalis (80-90% of body), focal (no change after 1-2 years), segmental (unilateral, rapid onset, leukotrichia, stable), mixed. Pityriasis alba: pale scaly patches on the cheeks of children (post-inflammatory).", "Key sign": "Wood lamp: bright blue-white sharply demarcated fluorescence. Activity signs: Koebner, trichrome, inflammatory (red scaly border), confetti. Segmental has non-serrated margin; nevus depigmentosus has serrated border.", "Cause / link": "Multifactorial: genetic (20% have an affected first-degree relative, risk up 7-10 fold), autoimmune (CD8+ T cells, IFN-gamma central; antimelanocyte antibodies do not track activity), oxidative stress (possibly the initial event; reduced melanocyte adhesion explains Koebner), innate immunity. Autoimmune thyroiditis is the commonest association; also Addison, pernicious anemia, alopecia areata.", "Treatment": "Aim: stop progression and repigment. Topical: potent steroid (body, once daily 3-6 months, 2 weeks on and 2 off), tacrolimus or pimecrolimus twice daily (face, neck, folds, safer), ruxolitinib 1.5% cream (first FDA and EMA approved). NB-UVB for extensive or progressive disease (stop if no response in 3 months), excimer 308 nm for localized. Oral mini-pulse betamethasone 5 mg or dexamethasone 2.5-5 mg twice weekly for up to 3 months (maximum 6) for rapid progression. Alternatives: methotrexate, cyclosporine, azathioprine, minocycline. Surgery (grafts, melanocyte transplant) for stable segmental disease after 12 months of stability. Depigmentation (monobenzyl ether of hydroquinone, the only FDA-approved) for extensive disease. Relapse 44% in the first year; tacrolimus twice weekly lowers relapse. Acral and poliosis lesions respond poorly. DDx: pityriasis alba, leprosy, pityriasis versicolor, piebaldism, halo nevus, nevus depigmentosus, chemical leukoderma, mycosis fungoides."}, "bk": 1, "rb": {"Lesion": ["Acquired chalk-white depigmented macules and patches of skin and mucosa; may involve hair (leukotrichia)", "Prevalence 0.5-2%; no sex difference", "Types: generalized (bilateral symmetric, pressure and friction sites), acrofacial, mucosal, universalis (80-90% of body), focal (no change after 1-2 years), segmental (unilateral, rapid onset, leukotrichia, stable), mixed", "Pityriasis alba: pale scaly patches on cheeks of children (post-inflammatory)"], "Key sign": ["Wood lamp: bright blue-white, sharply demarcated", "Activity: Koebner, trichrome, inflammatory (red scaly border), confetti", "Segmental: non-serrated margin; nevus depigmentosus: serrated border"], "Cause / link": ["Multifactorial: genetic (20% have an affected first-degree relative; risk up 7-10x), autoimmune (CD8+ T cells, IFN-gamma central; antimelanocyte antibodies do not track activity), oxidative stress (possibly initial event; reduced melanocyte adhesion explains Koebner), innate immunity", "Autoimmune thyroiditis commonest association; also Addison, pernicious anemia, alopecia areata"], "Treatment": ["Aim: stop progression and repigment", "Potent steroid (body, once daily 3-6 months, 2 weeks on and 2 off); tacrolimus or pimecrolimus twice daily (face, neck, folds, safer); ruxolitinib 1.5% cream (first FDA and EMA approved)", "NB-UVB for extensive or progressive disease (stop if no response in 3 months); excimer 308 nm for localized", "Oral mini-pulse betamethasone 5 mg or dexamethasone 2.5-5 mg twice weekly, up to 3 months (maximum 6), for rapid progression", "Alternatives: methotrexate, cyclosporine, azathioprine, minocycline", "Surgery (grafts, melanocyte transplant) for segmental disease stable 12 months", "Depigmentation (monobenzyl ether of hydroquinone, only FDA-approved) for extensive disease", "Relapse 44% in first year; tacrolimus twice weekly lowers relapse; acral and poliosis lesions respond poorly", "DDx: pityriasis alba, leprosy, PV, piebaldism, halo nevus, nevus depigmentosus, chemical leukoderma, mycosis fungoides"]}}, "ed": {"n": "Erectile dysfunction", "c": "disease", "pg": "", "g": "ed", "sum": "Cannot achieve or keep an erection good enough for intercourse. 50% of men over 40. Nitric oxide and cGMP drive erection, so PDE-5 inhibitors are first-line oral therapy. Psychogenic ED keeps morning erections.", "rows": {"Definition and physiology": "Definition: inability to achieve and maintain an erection adequate for intercourse. Needs nerves, vessels, hormones and psychology together. NO from NOS (L-arginine) activates guanylate cyclase, raises cGMP, relaxes cavernosal smooth muscle. Contraction: noradrenaline, endothelin-1, neuropeptide Y, angiotensin II. Relaxation: acetylcholine, NO, VIP. Parasympathetic S2-S4 sustains the erection. Venules under the tunica albuginea are compressed (pressure 100 mm Hg, over 200 with the bulbocavernosus reflex). Detumescence: PDE breaks down cGMP, sympathetic discharge. Types of erection: psychogenic (dopaminergic, T11-L2 and S2-S4), reflexogenic (genital touch, kept in upper cord injury), nocturnal (REM sleep, pontine reticular formation).", "Causes": "Psychogenic: depression, anxiety, developmental, cognitive and interpersonal factors. Organic: aging, neurological (spinal cord injury, neuropathy, pudendal nerve injury), hormonal (hypogonadism, hyperprolactinemia, thyroid disease, Cushing, Addison), vascular (atherosclerosis, venous incompetence), diabetes, renal failure, hyperlipidemia, hypertension, COPD. Drugs: antihypertensives, antidepressants, estrogens, anti-androgens, digoxin. Habits: smoking, alcohol, marijuana, narcotics.", "History and examination": "Complete medical and sexual history is the most important step. Acute onset points to psychological cause, gradual to organic (vascular, renal). Psychogenic: normal morning erections. IIEF and EDITS questionnaires grade severity. ED can be the first sign of cardiovascular disease or diabetes. Exam: vascular, neurological, endocrine, testis size, penile shaft (Peyronie disease: indurated plaque, penis deviates).", "Tests": "Routine: HbA1c or glucose, lipids. Testosterone and prolactin when libido is also low, TSH if thyroid disease is suspected. NPTR with RigiScan: rigidity over 70% at tip and base, tumescence 2 cm at the tip and 3 cm at the base. Dissociation pattern: tip rigidity under 70%. Uncoupling: rigidity under 70% with normal tumescence. Penile duplex after intracavernosal injection (papaverine, phentolamine, prostaglandin, atropine): peak systolic velocity over 30 (lower = arterial insufficiency), end diastolic velocity zero (not zero = venous leakage). Also stamp test, snap gauge, cavernosometry, biothesiometry, bulbocavernosus reflex.", "Treatment": "First: control reversible risk factors, counseling of the couple, sex therapy. Oral: PDE-5 inhibitors (sildenafil, tadalafil, vardenafil, avanafil). Contraindicated with organic nitrates and severe cardiac disease; caution in retinitis pigmentosa. Needs sexual stimulation. Non-responders: re-counsel, treat hypogonadism, higher dose, switch drug, daily dosing. Tadalafil lasts up to 36 hours. Avanafil is the most selective. Others: androgen replacement, prolactin-lowering drugs, yohimbine (alpha-2 blocker), apomorphine (dopamine agonist, withdrawn), trazodone (priapism), phentolamine. Second line: alprostadil transurethral (MUSE) or intracavernosal injection (papaverine, PGE1, Bimix, Trimix: 70-90% success, pain, priapism, fibrosis), vacuum device (contraindicated in bleeding disorders, sickle cell, anticoagulants). Third line: penile prosthesis (failed therapy, Peyronie, severe vasculogenic disease)."}, "bk": 1, "rb": {"Definition and physiology": ["Inability to achieve and keep an erection adequate for intercourse; needs nerves, vessels, hormones and psychology together", "NO from NOS (L-arginine) activates guanylate cyclase, raises cGMP, relaxes cavernosal smooth muscle", "Contraction: noradrenaline, endothelin-1, neuropeptide Y, angiotensin II. Relaxation: acetylcholine, NO, VIP", "Parasympathetic S2-S4 sustains erection; venules under tunica albuginea compressed (pressure 100 mm Hg, over 200 with bulbocavernosus reflex)", "Detumescence: PDE breaks down cGMP, sympathetic discharge", "Types: psychogenic (dopaminergic, T11-L2 and S2-S4), reflexogenic (genital touch, kept in upper cord injury), nocturnal (REM sleep, pontine reticular formation)"], "Causes": ["Psychogenic: depression, anxiety, developmental, cognitive, interpersonal", "Organic: aging; neurological (spinal cord injury, neuropathy, pudendal nerve injury); hormonal (hypogonadism, hyperprolactinemia, thyroid, Cushing, Addison); vascular (atherosclerosis, venous incompetence); diabetes, renal failure, hyperlipidemia, hypertension, COPD", "Drugs: antihypertensives, antidepressants, estrogens, anti-androgens, digoxin", "Habits: smoking, alcohol, marijuana, narcotics"], "History and examination": ["Complete medical and sexual history is the most important step", "Acute onset: psychological; gradual: organic (vascular, renal); psychogenic keeps morning erections", "IIEF and EDITS questionnaires grade severity", "ED can be the first sign of cardiovascular disease or diabetes", "Exam: vascular, neurological, endocrine, testis size, penile shaft (Peyronie: indurated plaque, deviation)"], "Tests": ["Routine: HbA1c or glucose, lipids; testosterone and prolactin if libido low; TSH if thyroid disease suspected", "NPTR with RigiScan: rigidity over 70% at tip and base; tumescence 2 cm at tip, 3 cm at base. Dissociation: tip rigidity under 70%. Uncoupling: rigidity under 70% with normal tumescence", "Penile duplex after intracavernosal injection (papaverine, phentolamine, prostaglandin, atropine): peak systolic velocity over 30 (lower = arterial insufficiency); end diastolic velocity zero (not zero = venous leakage)", "Also stamp test, snap gauge, cavernosometry, biothesiometry, bulbocavernosus reflex"], "Treatment": ["First: control reversible risk factors, couple counseling, sex therapy", "Oral PDE-5 inhibitors (sildenafil, tadalafil, vardenafil, avanafil): contraindicated with organic nitrates and severe cardiac disease; caution in retinitis pigmentosa; need sexual stimulation", "Tadalafil lasts up to 36 hours; avanafil most selective", "Non-responders: re-counsel, treat hypogonadism, higher dose, switch drug, daily dosing", "Others: androgen replacement, prolactin-lowering drugs, yohimbine (alpha-2 blocker), apomorphine (dopamine agonist, withdrawn), trazodone (priapism), phentolamine", "Second line: alprostadil transurethral (MUSE) or intracavernosal (papaverine, PGE1, Bimix, Trimix: 70-90% success; pain, priapism, fibrosis); vacuum device (contraindicated in bleeding disorders, sickle cell, anticoagulants)", "Third line: penile prosthesis (failed therapy, Peyronie, severe vasculogenic disease)"]}}, "pf": {"n": "Pemphigus foliaceus", "c": "disease", "g": "bull", "pg": "", "sum": "Pemphigus foliaceus and erythematosus: superficial, subcorneal (subgranular) acantholysis. Anti-desmoglein 1 only, so no mucosal disease. Scaly crusts on seborrheic areas.", "rows": {"Lesion": "Superficial blisters giving scales and crusts, localized or generalized. Pemphigus erythematosus: face and upper trunk in a lupus or seborrheic dermatitis pattern, told apart by biopsy.", "Split level": "Subcorneal intragranular acantholysis.", "Key sign": "Mucous membranes not affected. Nikolsky positive; intact bullae rarely seen.", "Antigen / immunity": "Only anti-desmoglein 1 antibodies, so skin only. Desmoglein 1 is found mainly in the upper skin layers.", "Treatment": "Systemic steroids and the same adjuncts as pemphigus vulgaris."}, "bk": 1, "rb": {"Lesion": ["Superficial blisters leave scales and crusts; localized or generalized", "Pemphigus erythematosus: face and upper trunk, lupus or seborrheic-dermatitis look; biopsy tells apart"], "Split level": ["Subcorneal (intragranular) acantholysis"], "Key sign": ["No mucosal involvement", "Nikolsky positive; intact bullae rarely seen"], "Antigen / immunity": ["Anti-desmoglein 1 only, so skin only; Dsg1 mainly in upper layers"], "Treatment": ["Systemic steroids and the same adjuncts as pemphigus vulgaris"]}}, "bp": {"n": "Bullous pemphigoid", "c": "disease", "g": "bull", "pg": "", "sum": "Bullous pemphigoid: the commonest autoimmune blistering disease, age 60 and over. Subepidermal split, tense bullae on an urticarial base, eosinophils. Short oral steroid course.", "rows": {"Lesion": "Most common immunobullous disease, old age (around 60). Prodromal itchy fixed urticarial phase, then tense bullae. Flexors, trunk, groin.", "Split level": "Subepidermal separation, with eosinophils.", "Key sign": "Tense bullae, Nikolsky negative, mucosa mostly spared, itchy.", "Antigen / immunity": "IgG against BP180 and BP230; linear IgG and C3 at the basement membrane.", "Treatment": "Short course of oral steroid; topical steroid. CHECK: not confirmed."}, "bk": 1, "rb": {"Lesion": ["Commonest immunobullous disease; age about 60", "Prodrome: itchy fixed urticarial phase, then tense bullae", "Flexors, trunk, groin"], "Split level": ["Subepidermal split with eosinophils"], "Key sign": ["Tense bullae, Nikolsky negative, mucosa mostly spared, itchy"], "Antigen / immunity": ["IgG against BP180 and BP230; linear IgG and C3 at basement membrane"], "Treatment": ["Short oral steroid course; topical steroid", "CHECK: not confirmed"]}}, "ssss": {"n": "SSSS (staph scalded skin)", "c": "disease", "g": "bull", "pg": "", "sum": "Staphylococcal scalded skin syndrome: staph toxin cleaves desmoglein 1. Newborns or elderly with renal disease. Subcorneal split, flaccid peeling. ICU, fluids, anti-staph antibiotic. Different from TEN.", "rows": {"Lesion": "Bad general condition, large flaccid peeling areas. Mainly newborns or elderly with renal derangement. Bullous impetigo is also toxin mediated.", "Split level": "Subcorneal (intragranular), more superficial than TEN.", "Key sign": "Nikolsky positive; mucosa spared. Needs urgent skin biopsy.", "Antigen / immunity": "Staph aureus toxin disrupts desmoglein 1.", "Treatment": "ICU: fluids, anti-staphylococcal antibiotic, sometimes hemodialysis. Prognosis poor in the elderly, better in the young."}, "bk": 1, "rb": {"Lesion": ["Bad general condition, large flaccid peeling areas", "Newborns or elderly with renal impairment; bullous impetigo is also toxin mediated"], "Split level": ["Subcorneal (intragranular): more superficial than TEN"], "Key sign": ["Nikolsky positive; mucosa spared", "Urgent skin biopsy"], "Antigen / immunity": ["S. aureus toxin disrupts desmoglein 1"], "Treatment": ["ICU: fluids, anti-staphylococcal antibiotic, sometimes hemodialysis", "Poor prognosis in elderly, better in young"]}}, "hsv": {"n": "Herpes simplex (HSV-1, HSV-2)", "c": "disease", "g": "vir", "pg": "", "sum": "HSV-1 (mostly oral) and HSV-2 (mostly genital). Latent in sensory ganglia, reactivated by stress, UV, fever, menses, immunosuppression. Grouped painful vesicles on an erythematous base. Tzanck shows multinucleated giant cells. Oral acyclovir.", "rows": {"Lesion": "Painful grouped vesicles on an erythematous base, umbilicated, then pustules, erosions with scalloped border, crusts; heal in 2-6 weeks. Prodrome of burning, tingling, tender nodes, malaise, fever. Symptoms 3-7 days after exposure. Primary is wider with nodes and fever; recurrent is localized, same site, few vesicles, resolves in 7-10 days. Types: primary orolabial (gingivostomatitis), recurrent orolabial (vermilion border), genital (glans, shaft, buttocks), herpetic whitlow (fingers, children or dental and medical staff without gloves, HSV-2 in adults), ocular, eczema herpeticum, neonatal.", "Cause": "DNA virus. HSV-1 spreads by saliva, causes 80-90% of herpes in children under 10; HSV-2 by sexual contact and causes 70-90% of recurrent genital herpes. Spread also during asymptomatic shedding. Virus travels by retrograde axonal flow to the dorsal root ganglia and stays latent. Primary infection (no antibodies) vs non-primary initial (antibodies to the other type).", "Key sign": "Recurrences at the same site are a clue (whitlow). Dendritic corneal lesions are pathognomonic of ocular HSV. Eczema herpeticum: monomorphic 2-3 mm punched-out erosions with hemorrhagic crusts in atopic dermatitis or Darier skin, usually HSV-1.", "Smear / histology": "Intraepidermal vesicle with ballooning degeneration, multinucleated giant cells, dense dermal infiltrate. Tzanck smear (Giemsa, base of fresh unroofed vesicle): multinucleated giant cells. Viral culture is the gold standard (over 50% sensitive, 100% specific). Also immunofluorescence, PCR, serology.", "Complications": "Ocular: corneal ulceration, scarring, blindness (emergency). Eczema herpeticum: bacterial superinfection or systemic spread (emergency, admit). Neonatal HSV from vaginal delivery (highest risk with new maternal genital infection near delivery), onset by 2 weeks, scalp and trunk or disseminated, encephalitis; mortality over 50% untreated and 15% treated; caesarean for maternal genital herpes.", "Treatment": "Avoid triggers. Local: crust removal with potassium permanganate or saline, topical antiviral, gentian violet for oozing, antibiotic if infected, analgesic cream. Systemic in first attack and severe recurrences: acyclovir 200 mg five times daily for 5-10 days, famciclovir 125 mg twice daily for 5 days. IV acyclovir: neonatal HSV, severe disease in immunocompromised, severe eczema herpeticum, systemic complications. Suppressive therapy for 6 or more outbreaks a year."}, "bk": 1, "rb": {"Lesion": ["Painful grouped umbilicated vesicles on red base, then pustules, erosions with scalloped border, crusts; heal in 2-6 weeks", "Prodrome: burning, tingling, tender nodes, malaise, fever; symptoms 3-7 days after exposure", "Primary: wider, nodes, fever. Recurrent: localized, same site, few vesicles, 7-10 days", "Types: primary orolabial (gingivostomatitis), recurrent orolabial (vermilion border), genital (glans, shaft, buttocks), herpetic whitlow (fingers; children, or unprotected dental and medical staff; HSV-2 in adults), ocular, eczema herpeticum, neonatal"], "Cause": ["DNA virus. HSV-1: saliva, 80-90% of herpes in children under 10. HSV-2: sexual, 70-90% of recurrent genital herpes", "Spreads during asymptomatic shedding", "Retrograde axonal flow to dorsal root ganglia, latent", "Primary (no antibodies) vs non-primary initial (antibodies to other type)"], "Key sign": ["Recurrence at the same site is a clue (whitlow)", "Dendritic corneal lesions: pathognomonic of ocular HSV", "Eczema herpeticum: monomorphic 2-3 mm punched-out erosions, hemorrhagic crusts, in atopic or Darier skin; usually HSV-1"], "Smear / histology": ["Intraepidermal vesicle, ballooning degeneration, multinucleated giant cells, dense dermal infiltrate", "Tzanck smear (Giemsa, base of fresh unroofed vesicle): multinucleated giant cells", "Viral culture: gold standard (over 50% sensitive, 100% specific)", "Also immunofluorescence, PCR, serology"], "Complications": ["Ocular: corneal ulcer, scarring, blindness (emergency)", "Eczema herpeticum: bacterial superinfection or systemic spread (emergency, admit)", "Neonatal HSV: from vaginal delivery (highest risk with new maternal infection near delivery), onset by 2 weeks, scalp and trunk or disseminated, encephalitis; mortality over 50% untreated, 15% treated; caesarean for maternal genital herpes"], "Treatment": ["Avoid triggers", "Local: crust removal (potassium permanganate or saline), topical antiviral, gentian violet for oozing, antibiotic if infected, analgesic cream", "First attack and severe recurrences: acyclovir 200 mg five times daily 5-10 days; famciclovir 125 mg twice daily 5 days", "IV acyclovir: neonatal, severe immunocompromised, severe eczema herpeticum, systemic complications", "Suppression for 6 or more outbreaks a year"]}}, "warts": {"n": "Warts and condyloma acuminata (HPV)", "c": "disease", "g": "vir", "pg": "", "sum": "HPV: DNA virus causing papules by epidermal proliferation. Koilocytes and church-spire papillomatosis. Types 6 and 11 give genital warts, 16 and 18 are oncogenic. No antiviral cure, so destroy lesions. Vaccine: Gardasil, Cervarix.", "rows": {"Lesion": "Vulgaris: hyperkeratotic dome-shaped papules on fingers and dorsal hands (subungual painful). Butcher wart: cauliflower lesions in meat handlers. Filiform and digitiform: periorificial on face. Plana: flat, smooth, slightly elevated skin-colored to brown, Koebner. Palmoplantar: painful endophytic, black dots are bleeding, mosaic warts when coalesced. Mucosal: condylomata acuminata (cauliflower, genitals, perineum, perianal, rarely beyond the dentate line), condylomata plana (flat cervical), oral warts (types 6, 11), Buschke-Lowenstein tumor (types 6 or 11, deep fistulas and abscesses).", "Cause": "HPV, over 150 genotypes, dsDNA. High risk 16, 18, 31, 33, 45; HPV-16 and 18 cause cervical cancer. Genital warts types 6 and 11 (low risk). Spread: genital by sexual contact (circumcised men less), skin by contact or contaminated surfaces (swimming pools, gyms). Basal keratinocytes infected through abrasions and maceration. Prevalence up to 30% in school children, most regress in 1-2 years. Genital warts in a prepubertal child: consider abuse.", "Key sign": "Thrombosed capillaries (black dots) in plantar warts. Church-spire papillomatosis. Koilocytes are specific to HPV.", "Smear / histology": "Church-spire papillomatosis with ortho- and parakeratosis, hypergranulosis, acanthosis, elongated rete ridges, small intracorneal hemorrhages. Koilocytes: cells with cytoplasmic vacuoles that isolate the nucleus.", "Complications": "Recurrence, spread, secondary infection. CIN, VIN, cervical and anal cancer (16, 18), laryngeal papillomatosis in a newborn (caesarean if maternal warts). Persistent high-risk HPV: cervical, anal, oropharyngeal cancer.", "Treatment": "No specific antiviral. Destruction: cryotherapy (plantar and periungual), electrocautery, excision, laser, TCA or BCA for genital warts, salicylic acid for plantar. Podophyllin and podophyllotoxin (0.5% self-applied, 25% physician-applied): contraindicated in pregnancy. 5-FU 5% for intraurethral. Intralesional bleomycin. Immunomodifiers: imiquimod 5% (external genital and perianal), interferons. Immunotherapy: DPCP, intralesional Candida, Trichophyton or mumps antigen. Cidofovir. Retinoids (acitretin, isotretinoin, topical tretinoin or tazarotene for flat warts). Pregnancy: cryotherapy. Vaccine: L1 virus-like particles; quadrivalent 6, 11, 16, 18 (Gardasil), bivalent 16, 18 (Cervarix), ideally before age 12."}, "bk": 1, "rb": {"Lesion": ["Vulgaris: hyperkeratotic dome papules on fingers and dorsal hands (subungual painful); butcher wart: cauliflower, meat handlers", "Filiform and digitiform: periorificial on face", "Plana: flat, smooth, skin-colored to brown, Koebner", "Palmoplantar: painful endophytic; black dots = bleeding; mosaic when coalesced", "Mucosal: condylomata acuminata (cauliflower; genitals, perineum, perianal, rarely beyond dentate line), condylomata plana (flat, cervical), oral warts (6, 11), Buschke-Lowenstein tumor (6 or 11, deep fistulas and abscesses)"], "Cause": ["HPV, over 150 genotypes, dsDNA. High risk: 16, 18, 31, 33, 45; 16 and 18 cause cervical cancer. Genital warts: 6 and 11 (low risk)", "Genital: sexual (circumcised men less); skin: contact, pools, gyms; basal keratinocytes infected via abrasions and maceration", "Up to 30% of school children; most regress in 1-2 years", "Genital warts in a prepubertal child: consider abuse"], "Key sign": ["Plantar: thrombosed capillaries (black dots)", "Church-spire papillomatosis", "Koilocytes are specific to HPV"], "Smear / histology": ["Church-spire papillomatosis, ortho- and parakeratosis, hypergranulosis, acanthosis, elongated rete ridges, small intracorneal hemorrhages", "Koilocytes: cytoplasmic vacuoles isolating the nucleus"], "Complications": ["Recurrence, spread, secondary infection", "CIN, VIN, cervical and anal cancer (16, 18); laryngeal papillomatosis in newborn (caesarean if maternal warts)", "Persistent high-risk HPV: cervical, anal, oropharyngeal cancer"], "Treatment": ["No specific antiviral; destroy lesions", "Cryotherapy (plantar, periungual), electrocautery, excision, laser; TCA or BCA for genital; salicylic acid for plantar", "Podophyllin and podophyllotoxin (0.5% self-applied, 25% physician-applied): contraindicated in pregnancy", "5-FU 5% intraurethral; intralesional bleomycin", "Imiquimod 5% (external genital, perianal), interferons; immunotherapy DPCP, intralesional Candida, Trichophyton or mumps antigen; cidofovir", "Retinoids (acitretin, isotretinoin; topical tretinoin or tazarotene for flat warts)", "Pregnancy: cryotherapy", "Vaccine: L1 VLPs; quadrivalent 6, 11, 16, 18 (Gardasil), bivalent 16, 18 (Cervarix); ideally before age 12"]}}, "mc": {"n": "Molluscum contagiosum", "c": "disease", "g": "vir", "pg": "", "sum": "Poxvirus, most common poxvirus infection in humans. Firm pearly umbilicated papules, children, sexual in adults, widespread in AIDS. Molluscum (Henderson-Patterson) bodies. Self-limited in children; curettage.", "rows": {"Lesion": "Firm, pearly, waxy, dome-shaped, umbilicated papules (2-5 mm). Folds (axillae, neck), lateral trunk, thighs, buttocks, genitals, face. Widespread and deforming in AIDS. Molluscum dermatitis common in atopic children. Inflamed pustular or furuncle-like lesions signal host immune response.", "Cause": "Large brick- or ovoid-shaped dsDNA poxvirus replicating in the cytoplasm. Children: skin-to-skin contact, fomites. Adults: usually sexual. Immunosuppressed, especially HIV.", "Key sign": "Pearly umbilicated papule with a waxy surface.", "Smear / histology": "Pear-shaped acanthosis with large intracytoplasmic eosinophilic non-nucleated inclusions: molluscum bodies (Henderson-Patterson bodies), growing as keratinocytes move up. Variable dermal infiltrate.", "Complications": "Molluscum dermatitis, spreading by scratching, extensive in HIV.", "Treatment": "Self-resolves in immunocompetent children. Curettage, electrocautery, needle transfixion, cryotherapy, chemical cautery (TCA, carbolic acid), imiquimod (off-label, not routinely recommended). Topical steroid for molluscum dermatitis."}, "bk": 1, "rb": {"Lesion": ["Firm pearly waxy dome umbilicated papules, 2-5 mm", "Folds (axillae, neck), lateral trunk, thighs, buttocks, genitals, face", "Widespread, deforming in AIDS", "Molluscum dermatitis common in atopic children; inflamed pustular or furuncle-like lesions = host immune response"], "Cause": ["Large brick- or ovoid-shaped dsDNA poxvirus, replicates in cytoplasm", "Children: skin contact, fomites; adults: usually sexual; immunosuppressed, especially HIV"], "Key sign": ["Pearly umbilicated papule, waxy surface"], "Smear / histology": ["Pear-shaped acanthosis; large intracytoplasmic eosinophilic inclusions: molluscum (Henderson-Patterson) bodies; variable dermal infiltrate"], "Complications": ["Molluscum dermatitis, spread by scratching, extensive in HIV"], "Treatment": ["Self-resolves in immunocompetent children", "Curettage, electrocautery, needle transfixion, cryotherapy, chemical cautery (TCA, carbolic acid); imiquimod (off-label, not routine)", "Topical steroid for molluscum dermatitis"]}}, "alb": {"n": "Oculocutaneous albinism", "c": "disease", "g": "leuk", "pg": "", "sum": "Autosomal recessive tyrosinase defect: melanocytes present, melanin absent.", "rows": {"Lesion": "Milky white skin, white hair, pale irises.", "Key sign": "Nystagmus, photophobia. No reticulate pigmentation.", "Cause / link": "AR (cousin marriage), tyrosinase deficiency, melanocytes present.", "Treatment": "Sun protection, eye care, skin cancer surveillance."}, "rb": {"Lesion": ["Milky white skin, white hair, pale irises"], "Key sign": ["Nystagmus, photophobia", "No reticulate pigmentation"], "Cause / link": ["Autosomal recessive (cousin marriage); tyrosinase deficiency; melanocytes present"], "Treatment": ["Sun protection, eye care, skin cancer surveillance"]}}, "mel": {"n": "Melanocyte biology and piebaldism", "c": "disease", "g": "leuk", "pg": "", "sum": "Melanocytes: neural crest origin, basal layer, 1 to about 36 keratinocytes.", "rows": {"Lesion": "Piebaldism: white forelock, depigmented patches with hyperpigmented islands.", "Key sign": "Melanocytes in basal layer, mucosa, uvea, substantia nigra (not suprarenal gland).", "Cause / link": "Neural crest; melanogenesis enzymes: tyrosinase, hydroxylase (aromatase is not one).", "Treatment": "Piebaldism: camouflage, grafting."}, "rb": {"Lesion": ["Piebaldism: white forelock, depigmented patches with hyperpigmented islands"], "Key sign": ["Melanocytes in basal layer, mucosa, uvea, substantia nigra (not suprarenal gland)"], "Cause / link": ["Neural crest origin; melanogenesis enzymes: tyrosinase, hydroxylase (aromatase is not one)", "Piebaldism: KIT"], "Treatment": ["Piebaldism: camouflage, grafting"]}}, "vkh": {"n": "Vogt-Koyanagi-Harada syndrome", "c": "disease", "g": "leuk", "pg": "", "sum": "Autoimmune attack on melanocytes: uveitis, meningismus, poliosis, vitiligo-like depigmentation, alopecia.", "rows": {"Lesion": "Vitiligo-like patches, poliosis of scalp and eyebrows, alopecia.", "Key sign": "Uveitis + meningismus + poliosis.", "Cause / link": "Autoimmune vs melanocytes. Not Chediak-Higashi, not Waardenburg.", "Treatment": "Systemic steroids."}, "rb": {"Lesion": ["Vitiligo-like patches, poliosis of scalp and eyebrows, alopecia"], "Key sign": ["Uveitis + meningismus + poliosis"], "Cause / link": ["Autoimmune against melanocytes; not Chediak-Higashi, not Waardenburg"], "Treatment": ["Systemic steroids"]}}, "syp1": {"n": "Primary syphilis and chancre", "c": "disease", "pg": "", "g": "syph", "sum": "Treponema pallidum: spiral motile spirochete, human only, not cultured. Chancre appears 18-21 days after infection: single painless indurated eroded papule, heals without scar in 3-8 weeks. Highly infectious. Nodes are firm and painless.", "rows": {"Lesion": "Single painless small coppery-red indurated papule that erodes. Men: glans penis, MSM anus and rectum. Women: cervix, labia, posterior commissure, clitoris. Heals without a scar in 3-8 weeks. Regional nodes firm, non-tender, mobile, do not suppurate, first unilateral. Atypical in 50%: kissing ulcer (hourglass on opposing surfaces), multiple ulcers on herpes or fissure, extragenital (lips, tongue, tonsils, fingers), painful if secondarily infected or in the anal canal.", "Cause": "Treponema pallidum subspecies pallidum, a thin spiral actively motile spirochete 6-15 micrometers, 8-20 coils, flagellum inside the cell wall. Humans only. Survives briefly outside the body. Passes through broken skin and mucous membranes, not intact skin. Sexual contact (vaginal, anal, oral), mother to fetus across the placenta, rare blood transfusion. Great imitator. Untreated: primary, secondary, latent, late.", "Key sign": "Chancre painless, indurated, single. Incubation 18-21 days (about 3 weeks). Infectious stages: primary and secondary only.", "Tests": "Dark-field microscopy of fresh lesion: corkscrew, pathognomonic motility. Nontreponemal tests (RPR, VDRL) turn positive 5-6 weeks after infection, shortly before the chancre heals, so they can be negative early. Treponemal tests confirm.", "Treatment": "Penicillin is the drug of choice. Doxycycline is the best alternative for early and late latent. HIV co-infection needs no stronger therapy. Follow up at 3, 6 and 12 months. CHECK: not confirmed for exact penicillin dose."}, "bk": 1, "rs": {"Lesion": "Single painless indurated papule that erodes, heals in 3-8 weeks. Nodes firm, painless.", "Cause": "T. pallidum, motile spirochete, humans only. Sexual, congenital, rarely blood.", "Key sign": "Painless indurated single chancre. Incubation 18-21 days.", "Tests": "Dark-field: corkscrew motility. RPR/VDRL positive only 5-6 weeks after infection.", "Treatment": "Penicillin. Alternative: doxycycline. Follow up at 3, 6, 12 months."}, "rb": {"Lesion": ["Single painless small coppery-red indurated papule that erodes; heals without scar in 3-8 weeks", "Sites: men glans, MSM anus and rectum; women cervix, labia, posterior commissure, clitoris", "Regional nodes: firm, non-tender, mobile, do not suppurate; first unilateral", "Atypical in 50%: kissing ulcer (hourglass), multiple ulcers on herpes or fissure, extragenital (lips, tongue, tonsils, fingers), painful if secondarily infected or anal"], "Cause": ["Treponema pallidum subsp. pallidum: thin spiral motile spirochete, 6-15 micrometers, 8-20 coils; humans only", "Enters through broken skin or mucosa, not intact skin", "Spread: sexual (vaginal, anal, oral), mother to fetus, rare transfusion", "Great imitator. Untreated: primary, secondary, latent, late"], "Key sign": ["Chancre: painless, indurated, single", "Incubation 18-21 days (about 3 weeks)", "Infectious stages: primary and secondary only"], "Tests": ["Dark-field microscopy of fresh lesion: corkscrew motility, pathognomonic", "RPR/VDRL positive 5-6 weeks after infection, so can be negative early", "Treponemal tests confirm"], "Treatment": ["Penicillin is the drug of choice", "Doxycycline: best alternative for early and late latent", "HIV co-infection: no stronger therapy", "Follow up at 3, 6 and 12 months", "CHECK: not confirmed for exact penicillin dose"]}}, "syp2": {"n": "Secondary syphilis", "c": "disease", "pg": "", "g": "syph", "sum": "Generalized stage 4-10 weeks after the chancre. Non-itchy coppery rash including palms and soles, generalized lymphadenopathy, condylomata lata, moth-eaten alopecia, mucous patches. Highly infectious.", "rows": {"Lesion": "Widespread mucocutaneous eruption, usually not itchy and not vesicular. Macular first, papular later (round, coppery), psoriasiform possible. Palms and soles involved: strongly suggests syphilis. Biett sign: hyperpigmented macules with a collarette of scale on palms and soles. Condylomata lata: broad flat soft moist gray sessile papules around genitalia and anus (not acuminata). Split papules at alae nasi and oral commissures. Mucous patches (gray macerated erosions, bald patches on the tongue), snail-track ulcers. Hair loss: early diffuse telogen effluvium, later moth-eaten alopecia (non-scarring).", "Cause": "Multiplication and spread of spirochetes through the blood. Appears 4-10 weeks after the chancre (6-8 weeks for the macular eruption). Skin lesions about 80%, mucosal about one-third. Fever, myalgia, arthralgia.", "Key sign": "Generalized shotty lymphadenopathy is the hallmark. Rash on palms and soles. Lesions and mucous patches are highly infectious.", "Tests": "Nontreponemal titer is highest in secondary syphilis. Dark-field positive from fresh lesions. Histology: plasma cells and endarteritis.", "Treatment": "Penicillin is the drug of choice. Follow up at 3, 6 and 12 months. Watch for Jarisch-Herxheimer reaction."}, "bk": 1, "rs": {"Lesion": "Non-itchy coppery rash incl. palms and soles. Condylomata lata, mucous patches, moth-eaten alopecia.", "Cause": "Spirochetes spread in blood, 4-10 weeks after the chancre.", "Key sign": "Generalized lymphadenopathy. Palm and sole rash. Highly infectious.", "Tests": "Nontreponemal titer highest here. Dark-field positive.", "Treatment": "Penicillin. Watch for Jarisch-Herxheimer."}, "rb": {"Lesion": ["Widespread mucocutaneous eruption, usually non-itchy, non-vesicular", "Macular first, papular later (round, coppery); psoriasiform possible", "Palms and soles involved: strongly suggests syphilis; Biett sign: hyperpigmented macules with collarette of scale on palms and soles", "Condylomata lata: broad flat soft moist gray sessile papules around genitalia and anus (not acuminata)", "Split papules at alae nasi and oral commissures", "Mucous patches (gray macerated erosions, bald patches on tongue); snail-track ulcers", "Hair loss: early diffuse telogen effluvium, later moth-eaten alopecia (non-scarring)"], "Cause": ["Spirochetes multiply and spread in blood", "Appears 4-10 weeks after chancre (6-8 weeks for macular eruption)", "Skin lesions about 80%, mucosal about one-third", "Fever, myalgia, arthralgia"], "Key sign": ["Generalized shotty lymphadenopathy: hallmark", "Rash on palms and soles", "Lesions and mucous patches highly infectious"], "Tests": ["Nontreponemal titer highest in secondary syphilis", "Dark-field positive from fresh lesions", "Histology: plasma cells, endarteritis"], "Treatment": ["Penicillin: drug of choice", "Follow up at 3, 6, 12 months", "Watch for Jarisch-Herxheimer reaction"]}}, "syp3": {"n": "Latent and tertiary syphilis", "c": "disease", "pg": "", "g": "syph", "sum": "After the lesions heal there is no clinical sign but serology is reactive (latent). Tertiary after up to 20 years: gumma, cardiovascular (80-85%), CNS (5-10%). Cellular immune reactivity is high. Not infectious sexually.", "rows": {"Lesion": "Latent: no signs, serology positive, can transmit to a fetus in a pregnant woman. Tertiary: gummatous (late benign), cardiovascular, neurosyphilis. Gumma forms from slow inflammatory damage. Oral leukoplakia is premalignant.", "Cause": "Late stage after latency up to 20 years with a strong cellular immune response to a few organisms. Now rare.", "Key sign": "Cardiovascular involvement 80-85%, CNS 5-10%, skin and bone also. Tertiary lesions are not infectious.", "Tests": "Dark-field, silver stain and DFA-TP are negative in latent and tertiary, so use serology. VDRL may be negative late, treponemal tests are positive.", "Treatment": "Penicillin. Doxycycline for early and late latent if penicillin cannot be used. CHECK: not confirmed for neurosyphilis regimen."}, "bk": 1, "rs": {"Lesion": "Latent: no signs, serology positive. Tertiary: gumma, cardiovascular, neurosyphilis.", "Cause": "Up to 20 years after infection, strong cellular response, few organisms.", "Key sign": "Cardiovascular 80-85%, CNS 5-10%. Not infectious.", "Tests": "Use serology. VDRL may be negative late, treponemal tests stay positive.", "Treatment": "Penicillin. Doxycycline for latent if penicillin cannot be used."}, "rb": {"Lesion": ["Latent: no signs, serology positive; pregnant women can transmit to fetus", "Tertiary: gummatous (late benign), cardiovascular, neurosyphilis", "Gumma: slow inflammatory damage; oral leukoplakia is premalignant"], "Cause": ["Late stage after latency up to 20 years; strong cellular immune response to few organisms; now rare"], "Key sign": ["Cardiovascular 80-85%, CNS 5-10%, also skin and bone", "Tertiary lesions not infectious"], "Tests": ["Dark-field, silver stain, DFA-TP negative in latent and tertiary: use serology", "VDRL may be negative late; treponemal tests positive"], "Treatment": ["Penicillin", "Doxycycline for early and late latent if penicillin cannot be used", "CHECK: not confirmed for neurosyphilis regimen"]}}, "sypt": {"n": "Syphilis tests, treatment and Jarisch-Herxheimer", "c": "disease", "pg": "", "g": "syph", "sum": "Dark-field for fresh lesions. Nontreponemal (RPR, VDRL) are sensitive and quantitative, used for follow-up. Treponemal (FTA-ABS, TPHA, TPPA) confirm and stay positive for life. Penicillin is the drug of choice.", "rows": {"Lesion": "Histology in any stage: endarteritis and plasma cell infiltrate (endothelial binding by spirochetes). Jarisch-Herxheimer reaction: fever, chills, headache, myalgia and worse skin lesions within 4-6 hours of penicillin, gone in 18-24 hours.", "Cause": "Nontreponemal: cardiolipin-cholesterol-lecithin antigen, not T. pallidum. False positives happen. Treponemal: specific antibodies, qualitative.", "Key sign": "Nontreponemal: RPR, VDRL, positive 5-6 weeks after infection, highest in secondary, fall after therapy or turn negative. Treponemal: FTA-ABS, MHA-TP, TPHA, TPPA, EIA IgG and IgM, positive for life.", "Tests": "Positive nontreponemal test needs confirmation by a treponemal test. Treponemal tests are more sensitive and specific but expensive. Standard for detection at all stages: serology.", "Treatment": "Penicillin. Doxycycline best alternative. Follow-up clinical and serologic at 3, 6, 12 months in early syphilis. JHR is not an allergic reaction. Cure rate of early syphilis over 95%."}, "bk": 1, "rs": {"Lesion": "Endarteritis and plasma cells. Jarisch-Herxheimer: fever within 4-6 hours of penicillin.", "Cause": "Nontreponemal use cardiolipin antigen (false positives). Treponemal are specific.", "Key sign": "RPR/VDRL for follow-up. FTA-ABS, TPHA stay positive for life.", "Tests": "Positive RPR/VDRL needs a treponemal confirmation.", "Treatment": "Penicillin. JHR is not an allergy. Early syphilis cure over 95%."}, "rb": {"Lesion": ["Histology in any stage: endarteritis and plasma cell infiltrate (spirochetes bind endothelium)", "Jarisch-Herxheimer: fever, chills, headache, myalgia, worse skin lesions within 4-6 hours of penicillin; gone in 18-24 hours"], "Cause": ["Nontreponemal: cardiolipin-cholesterol-lecithin antigen, not T. pallidum; false positives happen", "Treponemal: specific antibodies, qualitative"], "Key sign": ["Nontreponemal (RPR, VDRL): positive 5-6 weeks after infection, highest in secondary, fall or turn negative after therapy", "Treponemal (FTA-ABS, MHA-TP, TPHA, TPPA, EIA IgG and IgM): positive for life"], "Tests": ["Positive nontreponemal test needs treponemal confirmation", "Treponemal tests: more sensitive and specific, expensive", "Standard for detection at all stages: serology"], "Treatment": ["Penicillin; doxycycline best alternative", "Follow up clinically and serologically at 3, 6, 12 months in early syphilis", "JHR is not an allergic reaction", "Cure rate of early syphilis over 95%"]}}, "ery": {"n": "Erythroderma", "c": "disease", "pg": "", "g": "ery", "sum": "Erythema and scaling over more than 90% of the skin. Not a diagnosis, a presentation. Commonest cause: generalization of a pre-existing dermatosis. Pruritus is the commonest symptom.", "rows": {"Lesion": "Erythema and scaling over more than 90% of body surface.", "Cause": "Commonest: generalized pre-existing dermatosis: psoriasis, lichen planus, atopic dermatitis, pityriasis rubra pilaris. Also tinea corporis, Norwegian crusted scabies, pemphigus foliaceus, drug reaction.", "Key sign": "Pruritus in up to 90% (lichenification in one-third). Lymphadenopathy in about half, even without lymphoma. Edema about 50%, tachycardia 40% with risk of high-output cardiac failure, hyperthermia 37% (hypothermia 4%), hyperpigmentation in chronic cases, cachexia, anemia, hepatomegaly 20% (more in drug hypersensitivity), splenomegaly rare (lymphoma).", "Tests": "Biopsy for cause. Lymph node biopsy if large nodes (lymphoma). Check for anemia and fluids.", "Treatment": "Treat the cause, fluids, emollients, monitor heat loss and heart. CHECK: not confirmed."}, "bk": 1, "rb": {"Lesion": ["Erythema and scaling over more than 90% of body surface"], "Cause": ["Commonest: generalization of a pre-existing dermatosis: psoriasis, lichen planus, atopic dermatitis, PRP", "Also tinea corporis, Norwegian crusted scabies, pemphigus foliaceus, drug reaction"], "Key sign": ["Pruritus up to 90% (lichenification in one-third)", "Lymphadenopathy about half, even without lymphoma", "Edema about 50%; tachycardia 40% (risk of high-output cardiac failure); hyperthermia 37% (hypothermia 4%)", "Hyperpigmentation in chronic cases, cachexia, anemia, hepatomegaly 20% (more in drug hypersensitivity), splenomegaly rare (lymphoma)"], "Tests": ["Biopsy for cause; lymph node biopsy if large nodes (lymphoma)", "Check for anemia and fluids"], "Treatment": ["Treat the cause, fluids, emollients, monitor heat loss and heart", "CHECK: not confirmed"]}}, "skin": {"n": "Skin structure and functions", "c": "disease", "g": "init", "pg": "", "sum": "Skin structure, functions and histology terms. Epidermis layers from top: corneum, granulosum, spinosum, basale. Know hyperkeratosis, parakeratosis, acanthosis, spongiosis, acantholysis.", "rows": {"Definition": "Largest organ: about 3000 square inches, 2.7 kg (nearly double the brain or liver), receives one-third of the circulating blood. Functions: protection, temperature regulation (sweat), sensation, excretion (small urea and uric acid), vitamin D synthesis, UV screening (melanin), blood pressure regulation (arteriovenous shunts), absorption (nicotine patch), psychogenic (fear raises hair).", "Key points": "Epidermis: horny layer (non-nucleated cells full of keratin); granular layer (2-3 layers of diamond-shaped cells with keratohyalin granules); prickle layer (3-5 layers of polygonal cells joined by desmosomes); basal layer (single row, melanocytes between the cells). Basement membrane separates epidermis from dermis. Dermis: thicker, flexible connective tissue with appendages, nerves, capillary plexuses; papillary layer (loose, vascular) and reticular layer (deep, fibrous). Subcutis: loose fatty areolar tissue.", "Exam hook": "Hyperkeratosis: thick stratum corneum. Parakeratosis: nuclei retained in the stratum corneum. Orthokeratosis: thick keratin with normal maturation (no nuclei). Hypergranulosis: thick granular layer. Acanthosis: thick prickle layer (uniform, saw-tooth, or test-tube). Spongiosis: edema of the prickle layer. Acantholysis: loss of cohesion between prickle cells."}, "bk": 1, "rb": {"Definition": ["Largest organ: about 3000 square inches, 2.7 kg (nearly double brain or liver); receives one-third of circulating blood", "Functions: protection, temperature regulation (sweat), sensation, excretion (small urea and uric acid), vitamin D synthesis, UV screening (melanin), blood pressure regulation (arteriovenous shunts), absorption (nicotine patch), psychogenic (fear raises hair)"], "Key points": ["Epidermis: horny layer (non-nucleated, keratin); granular (2-3 layers, diamond-shaped, keratohyalin); prickle (3-5 layers, polygonal, desmosomes); basal (single row, melanocytes between cells)", "Basement membrane separates epidermis from dermis", "Dermis: thicker, flexible connective tissue with appendages, nerves, capillary plexuses; papillary (loose, vascular) and reticular (deep, fibrous)", "Subcutis: loose fatty areolar tissue"], "Exam hook": ["Hyperkeratosis: thick stratum corneum", "Parakeratosis: nuclei retained in stratum corneum", "Orthokeratosis: thick keratin, normal maturation (no nuclei)", "Hypergranulosis: thick granular layer", "Acanthosis: thick prickle layer (uniform, saw-tooth, test-tube)", "Spongiosis: edema of prickle layer", "Acantholysis: loss of cohesion between prickle cells"]}}, "les": {"n": "Primary and secondary lesions", "c": "disease", "g": "init", "pg": "", "sum": "Primary lesions: macule/patch, papule/plaque, nodule, vesicle/bulla. Secondary: pustule, cyst, scale, crust, erosion, ulcer, fissure, atrophy, scar, lichenification. Specific lesions point to one disease.", "rows": {"Definition": "Macule: color change under 1 cm (patch over 1 cm). Papule: solid elevation under 1 cm (plaque over 1 cm); dome-shaped, flat-topped (lichenoid), umbilicated, verrucous. Nodule: solid with dermal extension, felt more than seen. Vesicle: fluid under 1 cm; bulla over 1 cm. Flaccid bulla is intraepidermal (thin wall); tense bulla is subepidermal (thick wall). Secondary: pustule (pus); cyst (closed sac with lining, transilluminates); crust (dried exudate); erosion (part of epidermis, heals without scar); ulcer (epidermis and part of dermis, scars); fissure; atrophy (thin, wrinkled, cigarette-paper skin); scar (fibrous replacement); lichenification (thickening, hyperpigmentation, accentuated markings, chronic eczema).", "Key points": "Scales: fine branny (pityriasis versicolor), greasy (seborrheic dermatitis), lamellar layers (psoriasis), fish-like (ichthyosis), collarette (pityriasis rosea), horny adherent (discoid lupus). Wheal: urticaria, migratory, transient (under 30 minutes). Scutulum: favus (golden-yellow cup). Comedone: acne (blackhead or whitehead). Burrow: scabies (7-12 mm, vesicle at one end, blind at other). Target lesion: erythema multiforme (3 zones: cyanotic center, pale, red outer); herpes iris has a central vesicle. Herald patch: pityriasis rosea.", "Exam hook": "Cyst vs bulla: the epithelial lining. Most common umbilicated lesion: molluscum contagiosum. Most common papule: dome-shaped. Nail pitting: psoriasis and alopecia areata. Most common presenting complaint: disfigurement. HSV-1 above the umbilicus, HSV-2 below. Mucosa: erosion, ulcer, plaque, pigmentation, lace-like white streaks (lichen planus). Nails: pitting, discoloration, paronychia, dystrophy; white streaks in LP. Hair: diffuse or patchy loss; non-cicatricial (follicles visible, good prognosis) vs cicatricial (follicles destroyed, bad prognosis). Hirsutism: hair in abnormal sites in females."}, "bk": 1, "rb": {"Definition": ["Macule: color change under 1 cm (patch over 1 cm)", "Papule: solid elevation under 1 cm (plaque over 1 cm); dome-shaped, flat-topped (lichenoid), umbilicated, verrucous", "Nodule: solid with dermal extension, felt more than seen", "Vesicle: fluid under 1 cm; bulla over 1 cm. Flaccid bulla: intraepidermal (thin wall). Tense bulla: subepidermal (thick wall)", "Secondary: pustule (pus); cyst (closed sac with lining, transilluminates); crust (dried exudate); erosion (part of epidermis, no scar); ulcer (epidermis and part of dermis, scars); fissure; atrophy (thin wrinkled cigarette-paper skin); scar (fibrous replacement); lichenification (thickening, hyperpigmentation, accentuated markings; chronic eczema)"], "Key points": ["Scales: fine branny (PV), greasy (seborrheic), lamellar layers (psoriasis), fish-like (ichthyosis), collarette (pityriasis rosea), horny adherent (discoid lupus)", "Wheal: urticaria, migratory, transient (under 30 minutes)", "Scutulum: favus (golden-yellow cup); comedone: acne; burrow: scabies (7-12 mm, vesicle at one end, blind at other)", "Target lesion: erythema multiforme (3 zones: cyanotic center, pale, red outer); herpes iris has central vesicle", "Herald patch: pityriasis rosea"], "Exam hook": ["Cyst vs bulla: epithelial lining", "Commonest umbilicated lesion: molluscum contagiosum; commonest papule: dome-shaped", "Nail pitting: psoriasis and alopecia areata; commonest presenting complaint: disfigurement", "HSV-1 above umbilicus, HSV-2 below", "Mucosa: erosion, ulcer, plaque, pigmentation, lace-like white streaks (lichen planus)", "Nails: pitting, discoloration, paronychia, dystrophy; white streaks in LP", "Hair loss: non-cicatricial (follicles visible, good prognosis) vs cicatricial (follicles destroyed, bad prognosis); hirsutism: hair in abnormal sites in females"]}}, "dx": {"n": "Diagnostic aids and vehicles", "c": "disease", "g": "init", "pg": "", "sum": "History, examination, investigations and topical therapy. Wood lamp colors, KOH scraping, patch test, immunofluorescence, biopsy. Cream for wet lesions, ointment for dry lesions. Fingertip unit about 500 mg.", "rows": {"Definition": "History: personal (age, sex, occupation, residence), present (complaint, onset, course), past, family (ichthyosis, scabies), drug history (drug eruption). Examination: general, then skin from a distance (distribution: discrete, unilateral, generalized over 50% BSA, grouped, linear or Koebner, zosteriform, follicular) and close up (border well or ill defined, circinate: spreads at the edge and heals at the center), palpation (tenderness, warmth, base, thickness, consistency, blanching, friability). Appendages: mucosae, nails, hair.", "Key points": "Wood lamp (UV): normal skin violet; pityriasis versicolor golden yellow; erythrasma coral red; tinea capitis (microsporum) bright green; favus bluish white; vitiligo accentuated white. Scraping with scalpel and 10% KOH: hyphae in skin and nails; in tinea capitis, spores outside the hair (ectothrix) or inside (endothrix). Patch test: allergen strips on the back covered 48 hours, read for erythema and vesicles. Immunofluorescence: direct detects antibody in skin (biopsy), indirect detects antibody in serum. Biopsy: usually diagnostic.", "Exam hook": "Principles: wet lesions need creams, dry lesions need ointments; do no harm; do not overtreat; instruct the patient how to apply; correct amount; change therapy with response; continue after clearing to prevent recurrence. Agents: antipruritic (calamine), keratoplastic (tar), keratolytic (salicylic 4-6%, urea 20-40%, lactic acid), antieczematous (steroids), antiparasitic (permethrin 5%), emollient (cold cream, Vaseline). Compresses: potassium permanganate 1/8000. Drying: gentian violet 1%. Cream: oil-in-water, cooling, for acute oozing. Ointment: anhydrous, for chronic dry. Gel: non-greasy, for hairy areas. Lotion: powder and water, unsuitable for xerosis. Foam: easy, sensitive skin. Fingertip unit about 500 mg treats both hands once; amounts for 14 days twice daily: hand 15 g, arm 30 g, leg 60 g, entire body 480-960 g."}, "bk": 1, "rb": {"Definition": ["History: personal (age, sex, occupation, residence), present (complaint, onset, course), past, family (ichthyosis, scabies), drug (drug eruption)", "Examination: general, then skin from a distance: distribution (discrete, unilateral, generalized over 50% BSA, grouped, linear or Koebner, zosteriform, follicular) and close up: border well or ill defined, circinate (spreads at edge, heals at center)", "Palpation: tenderness, warmth, base, thickness, consistency, blanching, friability; appendages: mucosae, nails, hair"], "Key points": ["Wood lamp (UV): normal skin violet; PV golden yellow; erythrasma coral red; tinea capitis (Microsporum) bright green; favus bluish white; vitiligo accentuated white", "Scraping with scalpel and 10% KOH: hyphae in skin and nails; tinea capitis spores outside hair (ectothrix) or inside (endothrix)", "Patch test: allergen strips on back covered 48 hours; read erythema and vesicles", "Immunofluorescence: direct detects antibody in skin (biopsy), indirect in serum", "Biopsy: usually diagnostic"], "Exam hook": ["Wet lesions need creams, dry lesions need ointments; do no harm, do not overtreat, teach application, correct amount, adjust with response, continue after clearing to prevent recurrence", "Agents: antipruritic (calamine), keratoplastic (tar), keratolytic (salicylic 4-6%, urea 20-40%, lactic acid), antieczematous (steroids), antiparasitic (permethrin 5%), emollient (cold cream, Vaseline)", "Compress: potassium permanganate 1/8000; drying: gentian violet 1%", "Cream: oil-in-water, cooling, acute oozing. Ointment: anhydrous, chronic dry. Gel: non-greasy, hairy areas. Lotion: powder and water, unsuitable for xerosis. Foam: easy, sensitive skin", "Fingertip unit about 500 mg treats both hands once; 14 days twice daily: hand 15 g, arm 30 g, leg 60 g, entire body 480-960 g"]}}, "minf": {"n": "Male infertility", "c": "disease", "pg": "", "g": "mi", "sum": "No pregnancy after 1 year of regular unprotected intercourse. Sperm production problems cause 60%. Semen analysis is the key test. Azoospermia work-up uses FSH, LH and testicular biopsy.", "rows": {"Definition and causes": "Definition: 1 year, regular (2-3 a week), unprotected. 15% of couples: female factor 35-39%, male alone 30%, both 20%, unexplained 15%. Causes: sperm production 60%, blockage 30%, hormonal 10%, deposition 5%. Pre-testicular: hypogonadotropic hypogonadism (Kallmann, Prader-Willi, Laurence-Moon-Biedl), isolated LH deficiency (fertile eunuch), isolated FSH deficiency, thalassemia, prolactinoma (bromocriptine). Testicular: Klinefelter 47,XXY, Down, myotonic dystrophy, Y microdeletion, anorchia, orchitis, torsion, sickle cell, Sertoli-cell-only (azoospermia), radiation, chemotherapy, leprosy, alcohol, smoking, varicocele (stagnation raises temperature, optimum 35.8-36 C). Post-testicular: ductal blockage (failure of canalization, cystic fibrosis, immotile cilia, chlamydia, gonorrhea, TB, surgery, antisperm antibodies), retrograde ejaculation (bladder sphincter weakness, diabetes, prostatectomy: aspermia, sperm in post-ejaculation urine), anejaculation (diabetes, spinal cord injury), hypospadias, impotence.", "History and examination": "Drugs: spironolactone, cyproterone, ketoconazole, cimetidine (antiandrogen), nitrofurantoin, colchicine, methotrexate, phenytoin, calcium channel blockers, tetracycline. Mumps after puberty, heat, smoking, marijuana. Exam: testis volume over 20 ml (orchidometer, firm), epididymis, vas present both sides, varicocele (bag of worms), penis (meatus, hypospadias), rectal exam, secondary sex characters.", "Semen analysis": "Abstain 2-3 days, process within 1 hour, 2-3 samples. Volume 1.5-5 ml. Liquefaction 5-25 minutes. Motility over 32% progressive or 40% total motile (below: asthenozoospermia). Density over 15 million/ml and 39 million total (below 15: oligospermia, below 5: severe, none: azoospermia, check centrifuged sample and post-ejaculation urine). Normal forms over 4% (below: teratospermia). Vitality over 58% (necrospermia). White cells: leucospermia. No ejaculate: aspermia.", "Hormones and biopsy": "FSH, LH, testosterone, prolactin. Azoospermia with low FSH and LH: pre-testicular. High FSH and LH: primary testicular (Klinefelter: tall, abnormal body proportions). Normal hormones: biopsy. No sperm on biopsy: primary testicular failure. Sperm present: obstruction. Biopsy is for azoospermia with normal testis size and hormones.", "Treatment": "Normal gonadotropins (idiopathic): anti-estrogens, clomiphene or tamoxifen. Low gonadotropins: hormone replacement; prolactinoma: bromocriptine. Antibiotics for infection, high ligation for varicocele, corrective anastomosis for obstruction. Artificial insemination (low parameters or impotence), IVF (very low parameters), ICSI, TESE or TESA for obstructive azoospermia."}, "bk": 1, "rb": {"Definition and causes": ["Definition: 1 year, regular (2-3 a week), unprotected intercourse. 15% of couples: female factor 35-39%, male alone 30%, both 20%, unexplained 15%", "Causes: sperm production 60%, blockage 30%, hormonal 10%, deposition 5%", "Pre-testicular: hypogonadotropic hypogonadism (Kallmann, Prader-Willi, Laurence-Moon-Biedl), isolated LH deficiency (fertile eunuch), isolated FSH deficiency, thalassemia, prolactinoma (bromocriptine)", "Testicular: Klinefelter 47,XXY, Down, myotonic dystrophy, Y microdeletion, anorchia, orchitis, torsion, sickle cell, Sertoli-cell-only (azoospermia), radiation, chemotherapy, leprosy, alcohol, smoking, varicocele (stagnation raises temperature; optimum 35.8-36 C)", "Post-testicular: ductal blockage (failed canalization, cystic fibrosis, immotile cilia, chlamydia, gonorrhea, TB, surgery, antisperm antibodies); retrograde ejaculation (weak bladder sphincter, diabetes, prostatectomy: aspermia, sperm in post-ejaculation urine); anejaculation (diabetes, spinal cord injury); hypospadias; impotence"], "History and examination": ["Drugs: spironolactone, cyproterone, ketoconazole, cimetidine (antiandrogen), nitrofurantoin, colchicine, methotrexate, phenytoin, calcium channel blockers, tetracycline", "Mumps after puberty, heat, smoking, marijuana", "Exam: testis volume over 20 ml (orchidometer, firm), epididymis, vas both sides, varicocele (bag of worms), penis (meatus, hypospadias), rectal exam, secondary sex characters"], "Semen analysis": ["Abstain 2-3 days, process within 1 hour, 2-3 samples", "Volume 1.5-5 ml; liquefaction 5-25 minutes", "Motility over 32% progressive or 40% total (below: asthenozoospermia)", "Density over 15 million/ml and 39 million total (below 15: oligospermia; below 5: severe; none: azoospermia, check centrifuged sample and post-ejaculation urine)", "Normal forms over 4% (below: teratospermia); vitality over 58% (necrospermia)", "White cells: leucospermia; no ejaculate: aspermia"], "Hormones and biopsy": ["FSH, LH, testosterone, prolactin", "Azoospermia + low FSH and LH: pre-testicular. High FSH and LH: primary testicular (Klinefelter: tall, abnormal body proportions)", "Normal hormones: biopsy. No sperm: primary testicular failure. Sperm present: obstruction", "Biopsy is for azoospermia with normal testis size and hormones"], "Treatment": ["Normal gonadotropins (idiopathic): anti-estrogens, clomiphene or tamoxifen", "Low gonadotropins: hormone replacement; prolactinoma: bromocriptine", "Antibiotics for infection, high ligation for varicocele, corrective anastomosis for obstruction", "Artificial insemination (low parameters or impotence), IVF (very low parameters), ICSI, TESE or TESA for obstructive azoospermia"]}}, "lepx": {"n": "Leprosy (other points)", "c": "disease", "g": "lep", "pg": "", "sum": "Leprosy overview and reactions. Spectrum set by cell-mediated immunity. Type 1 reversal reaction and type 2 ENL. WHO MDT by number of lesions. Follow up 2 years (paucibacillary) or 5 years (multibacillary).", "rows": {"Immunity": "Chronic infection by Mycobacterium leprae with a preference for peripheral nerves and skin. Cell-mediated immunity decides the type: tuberculoid (intact), lepromatous (depressed), three borderline types between.", "Skin lesions": "Hypopigmented anesthetic patches (tuberculoid); annular lesions (borderline); symmetric nodules, leonine face (lepromatous). Neural: thickened nerves, sensory loss, claw hand, foot drop.", "Nerves": "Reactions come from conflict between the bacillus and immunity. Type 1 reversal (upgrading): delayed hypersensitivity, mostly borderline. Type 2: ENL, immune complex vasculitis, lepromatous or borderline lepromatous.", "Smear / histology": "Skin smear from earlobes with Fite or Ziehl-Neelsen. Skin biopsy. Lepromin shows immunity and does not diagnose.", "Other features": "M. leprae needs about 35 C. Differentiating features: hypopigmented anesthetic patches (tuberculoid), nasal bleeding (lepromatous), annular lesions (borderline).", "Treatment": "WHO multidrug therapy: multibacillary (over 5 lesions) rifampin 600 mg monthly, clofazimine 300 mg monthly and 50 mg daily, dapsone 100 mg daily, 12-18 months. Paucibacillary (2-5): rifampin and dapsone 6-9 months. Single lesion: rifampin 600, ofloxacin 400, minocycline 100 single dose. Follow up 2 years PB, 5 years MB."}, "bk": 1, "rb": {"Immunity": ["Chronic M. leprae infection, prefers peripheral nerves and skin", "Cell-mediated immunity decides type: tuberculoid (intact), lepromatous (depressed), three borderline types between", "Mnemonic: المناعة بطارية بتفصل:§شحن 100% (TT)§75% (BT)§50% (BB)§25% (BL)§فاضي (LL)"], "Skin lesions": ["Tuberculoid: hypopigmented anesthetic patches", "Borderline: annular lesions", "Lepromatous: symmetric nodules, leonine face", "Neural: thickened nerves, sensory loss, claw hand, foot drop"], "Nerves": ["Reactions: conflict between bacillus and immunity", "Type 1 reversal (upgrading): delayed hypersensitivity, mostly borderline", "Type 2: ENL, immune complex vasculitis, lepromatous or borderline lepromatous"], "Smear / histology": ["Skin smear from earlobes: Fite or Ziehl-Neelsen", "Skin biopsy", "Lepromin shows immunity, does not diagnose"], "Other features": ["M. leprae needs about 35 C", "Differentiating: hypopigmented anesthetic patches (tuberculoid), nasal bleeding (lepromatous), annular lesions (borderline)"], "Treatment": ["WHO MDT. Multibacillary (over 5 lesions): rifampin 600 mg monthly + clofazimine 300 mg monthly and 50 mg daily + dapsone 100 mg daily, 12-18 months", "Paucibacillary (2-5): rifampin + dapsone, 6-9 months", "Single lesion: rifampin 600 + ofloxacin 400 + minocycline 100, one dose", "Follow up 2 years (PB), 5 years (MB)"]}}, "bmisc": {"n": "SJS, TEN and drug blistering", "c": "disease", "g": "bull", "pg": "", "sum": "SJS and TEN: drug-induced apoptosis of keratinocytes, onset 24-72 hours after the drug. Panepidermal necrosis, subepidermal split, bulla filled with serum not pus. Stop the drug; IVIG early.", "rows": {"Lesion": "Apoptotic blistering: erythema multiforme, SJS, TEN. TEN: large serum-filled bullae. Drugs: analgesics, NSAIDs, anticonvulsants, anxiolytics, rarely antibiotics (also allopurinol, sulfonamides).", "Split level": "Panepidermal necrosis with subepidermal separation, few lymphocytes. Deeper than SSSS.", "Key sign": "Idiosyncratic reaction; symptoms 24-72 hours after drug intake. SJS under 10% BSA, overlap 10-30%, TEN over 30%. Urgent skin biopsy.", "Antigen / immunity": "Keratinocyte apoptosis. Other blister types: ballooning (herpes simplex, zoster), spongiotic (allergic contact), genetic (epidermolysis bullosa), toxin (SSSS, bullous impetigo).", "Treatment": "Stop the offending drug. Steroids are of questionable effect. IVIG has an anti-apoptotic effect, best given early. Supportive burn-unit care."}, "bk": 1, "rb": {"Lesion": ["Apoptotic blistering: erythema multiforme, SJS, TEN; TEN has large serum-filled bullae", "Drugs: analgesics, NSAIDs, anticonvulsants, anxiolytics, rarely antibiotics; allopurinol, sulfonamides"], "Split level": ["Panepidermal necrosis, subepidermal split, few lymphocytes; deeper than SSSS"], "Key sign": ["Idiosyncratic reaction, 24-72 hours after drug", "SJS under 10% BSA, overlap 10-30%, TEN over 30%", "Urgent skin biopsy"], "Antigen / immunity": ["Keratinocyte apoptosis", "Other blister types: ballooning (HSV, zoster), spongiotic (allergic contact), genetic (EB), toxin (SSSS, bullous impetigo)"], "Treatment": ["Stop the drug", "Steroids: questionable effect", "IVIG: anti-apoptotic, best early", "Supportive burn-unit care"]}}, "vmisc": {"n": "Other viral skin infections", "c": "disease", "g": "vir", "pg": "", "sum": "Viral skin infections in one view. Vesicles (degenerative pattern: HSV, VZV) vs papules (proliferative: HPV, poxvirus). Primary infections are disseminated with systemic signs and nodes; recurrent ones are localized.", "rows": {"Lesion": "Degenerative pattern: ballooning and degeneration of epidermal cells gives vesicles (HSV-1, HSV-2, VZV). Burning or tingling. Proliferative pattern: papules, nodules, tumor-like lesions (HPV, poxviruses).", "Cause": "Herpesviruses (alpha, beta, gamma groups): linear dsDNA, icosahedral capsid, envelope with glycoprotein spikes. Most viral skin infections spread by skin contact; VZV mainly by respiratory droplets; others by fomites, sexual, vertical.", "Key sign": "Shortcut: disseminated plus systemic symptoms plus nodes means primary infection. Localized plus no systemic symptoms plus no nodes means recurrent. Dominant symptom: HSV genital erosions and pain, chickenpox itching, zoster pain with burning prodrome, warts and molluscum cosmetic concern.", "Smear / histology": "Tzanck smear (multinucleated giant cells) for HSV and VZV. Zoster is unilateral in one dermatome; bilateral or widespread suggests immunocompromise. DDx of herpes: genodermatoses, pemphigus, SJS and TEN. Clues: grouped vesicles, burning, recurrence, erosions and crusts.", "Complications": "Ocular HSV: corneal ulcer, scarring, blindness (emergency). Eczema herpeticum and neonatal HSV are emergencies. HPV types 16 and 18: cervical, anal, oropharyngeal cancers.", "Treatment": "Acyclovir or valacyclovir for herpes. Cryotherapy for genital warts in pregnancy; avoid podophyllin. Imiquimod mainly for external genital and perianal warts; it stimulates local cell-mediated and interferon pathways, also used for actinic keratosis and superficial BCC."}, "bk": 1, "rb": {"Lesion": ["Degenerative pattern: ballooning gives vesicles (HSV-1, HSV-2, VZV); burning or tingling", "Proliferative pattern: papules,
