ency topical corticosteroid", "d": ["Retinoid alone", "Coal tar alone", "Systemic methotrexate"], "e": "First line: high-potency topical steroid, alone or in rotation with calcipotriene (vitamin D analogue).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "The most frequent side effect of topical calcipotriene is:", "c": "Skin irritation", "d": ["Skin atrophy", "Hypopigmentation", "Striae"], "e": "Calcipotriene (vitamin D analogue): irritation, photosensitivity, but no contraindication with UVB.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "A 30-year-old psoriatic woman is 24 weeks pregnant, poorly controlled on topicals, 50% BSA. Best choice?", "c": "Narrow-band UVB phototherapy", "d": ["Methotrexate", "Systemic steroids", "Acitretin"], "e": "Methotrexate is teratogenic: phototherapy is the best option in pregnancy.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "Safest treatment option for chronic generalized psoriasis?", "c": "Narrow-band UVB", "d": ["Systemic steroids", "Oral methotrexate", "PUVA"], "e": "NB-UVB is safe and effective. Systemic steroids should never be used.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "A 40-year-old woman has elbow plaques, finger pain and stiffness with edema, and nail pitting. Which treatment fits?", "c": "Systemic methotrexate", "d": ["NB-UVB", "Systemic PUVA", "Topical steroid only"], "e": "Plaque psoriasis with psoriatic arthritis and nail disease: methotrexate treats both skin and joints.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "Which of these drugs can exacerbate psoriasis?", "c": "Propranolol", "d": ["Omalizumab", "Azithromycin", "Paracetamol"], "e": "Worsen psoriasis: beta blockers, ACE inhibitors, lithium, aspirin/NSAIDs, antimalarials, interferons, sulfa drugs, systemic steroid withdrawa -old HIV-positive man has numerous pink umbilicated papules, 1-3 mm, on his genitals, thighs and lower abdomen. White material can be expressed. Single most likely diagnosis?", "c": "Molluscum contagiosum", "d": ["Mycobacterium avium intracellulare", "Verruca vulgaris", "Condylomata acuminata"], "e": "Extensive molluscum in HIV.", "src": "", "dz": "mc", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 9-year-old with atopic eczema has multiple discrete pearly white 2-5 mm dome-shaped papules on the face with central umbilication in clusters. Single most likely diagnosis?", "c": "Molluscum contagiosum", "d": ["Verruca vulgaris", "Verruca plana", "Condylomata acuminata"], "e": "Atopic children get more molluscum.", "src": "", "dz": "mc", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "What is the dose of the systemic sensitizer in PUVA?", "c": "Psoralen 0.5 mg/kg", "d": ["Psoralen 0.1% solution"], "e": "Systemic psoralen: 0.5 mg/kg (8-MOP 0.6 mg/kg in some references). Topical: 0.05-0.1% solution. CHECK: not confirmed.", "src": "", "dz": "vit", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "What is the dose of the psoralen sensitizer in topical PUVA?", "c": "0.05-0.1% solution", "d": ["0.5 mg/kg", "0.5-1% solution"], "e": "Topical psoralen is diluted to avoid blistering.", "src": "", "dz": "vit", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is NOT a feature of oculocutaneous albinism?", "c": "Reticulate pattern pigmentation", "d": ["Milky white skin", "Nystagmus"], "e": "OCA: white skin and hair, nystagmus, photophobia, pale iris.", "src": "", "dz": "alb", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A newborn has hypopigmented irises, white hair and nystagmus. His parents are cousins. Most likely diagnosis?", "c": "Albinism", "d": ["Vitiligo", "Waardenburg syndrome"], "e": "Autosomal recessive (consanguinity). Melanocytes are present, tyrosinase is defective.", "src": "", 0 year old female patient presented with two localized dusky red erythematous plaques covered with silvery white lamellar scales over both elbows, along with pain and stiffness of her fingers accompanied with edema and nail pitting in many of her finger nails. What treatment would be appropriate for this patient?", "c": "Systemic methotrexate.", "d": ["NB-UVB.", "Systemic PUVA", "Systemic acitretin."], "e": "Plaque psoriasis with psoriatic arthritis (painful stiff joints, dactylitis) and nail changes. Methotrexate treats skin and joints.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the characteristic dermoscopic feature of psoriasis?", "c": "Regularly arranged dotted vessels", "d": ["Whitish structureless areas.", "Yellow dots.", "Thick arborizing vessels."], "e": "Dermoscopy of psoriasis: light red background, regular dotted vessels, white scales.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "What is the most appropriate topical treatment for localized dusky red plaque with silvery white scales affecting less than 5 percent body surface area?", "c": "corticosteroid", "d": ["calciptriol", "coal tar", "retenoid"], "e": "Potent topical steroid (often with calcipotriene) is first line for localized plaques under 5% BSA.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45-year-old male patient presented with well-defined intense erythematous itchy lesions scattered on the trunk. On examination the interphalangeal joints were swollen and painful. Nail changes were present. Which nail change is more specific for this disease?", "c": "Oil drop sign", "d": ["Subungual hyperkeratosis", "Onycholysis", "Longitudinal ridging"], "e": "Subungual hyperkeratosis and onycholysis occur in many nail diseases. Oil drop (salmon patch) is the specific one for psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"  ["Systemic steroids", "Oral methotrexate", "PUVA therapy"], "e": "NB-UVB has a low long-term risk. Safer than oral immunosuppressants or PUVA (higher cancer risk).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A patient develops small papular skin lesions with central scales following a respiratory tract infection. What is the likely diagnosis?", "c": "Guttate psoriasis", "d": ["Psoriasis vulgaris", "Seborrheic dermatitis", "Lichen planus"], "e": "Small drop-like papules appearing suddenly after strep pharyngitis or a chest infection = guttate psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A young female developed erythematous papules with scales following pharyngitis. What is the most likely diagnosis?", "c": "Guttate psoriasis", "d": ["Psoriasis vulgaris", "Seborrheic dermatitis", "Lichen planus"], "e": "Guttate psoriasis follows strep pharyngitis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is a diagnostic feature of psoriasis?", "c": "Dotted bleeding on scratching", "d": ["Lesions limited to flexures", "Scales with surface telangiectasia", "Honey-colored crusts"], "e": "Auspitz sign: pinpoint bleeding when the scale is scraped off. Thin suprapapillary plates over long dermal papillae.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which type of psoriasis is characterized by well-demarcated erythematous plaques with overlying silvery scales?", "c": "Plaque psoriasis", "d": ["Inverse psoriasis", "Guttate psoriasis", "Pustular psoriasis"], "e": "Plaque psoriasis (vulgaris) is the commonest type: sharp red plaques with silvery scales.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which psoriasis type is often triggered by corticosteroid withdrawal and can be life- threatening when generalized?", "c": "Pustular psoriasis", "d": ["Plaque psoriasis", "Inverse psoriasis", "Nail psoriasis"], "e": "Stopping systemic steroids suddenly can cause generalized pustular psoriasis. Emergency: high fever and toxicity.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What feature is characteristic of nail psoriasis?", "c": "Pitting and oil drop sign", "d": ["Large pustules", "Silver scaling", "Generalized erythema"], "e": "Nail pitting (nail matrix) and oil drop or salmon patch (nail bed) are the main nail signs of psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which type of psoriasis involves erythematous plaques located in the skin folds?", "c": "Inverse psoriasis", "d": ["Guttate psoriasis", "Palmoplantar psoriasis", "Erythrodermic psoriasis"], "e": "Inverse (flexural) psoriasis: axillae, groin, inframammary folds. Smooth red plaques with little scale because of moisture.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Psoriatic arthritis is most commonly seen between which ages?", "c": "30-50 years", "d": ["10-20 years", "20-30 years", "50-70 years"], "e": "Psoriatic arthritis can start at any age but peaks at 30-50 years.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Oral psoriasis is more commonly seen in which type of psoriasis?", "c": "Pustular psoriasis", "d": ["Plaque psoriasis", "Guttate psoriasis", "Inverse psoriasis"], "e": "Oral lesions (geographic tongue, pustules) are much commoner in severe forms: pustular and erythrodermic psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "In psoriasis, which of the following is commonly observed in the stratum corneum?", "c": "Parakeratosis", "d": ["Hyperkeratosis", "Acanthosis", "Erosion"], "e": "Parakeratosis (nuclei kept in the stratum corneum) from fast epidermal turnover.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which histopathological feature is absent in psoriatic lesions?", "c": "Stratum granulosum", "d": ["Stratum corneum", "Stratum basale", "Stratum lucidum"], "e": "Psoriasis: the granular layer is thin or absent (hypogranulosis).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What dermoscopic feature is characteristic of psoriasis?", "c": "Whitish areas with scales and dotted blood vessels underneath", "d": ["Yellowish discoloration with no visible blood vessels", "Blister formation with a clear fluid", "Red patches with no underlying vascular changes"], "e": "Dermoscopy: white scales and evenly spread dotted vessels on a red background.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is a side effect associated with calcipotriene used for psoriasis?", "c": "Skin irritation", "d": ["Photosensitivity", "Staining of clothes", "Acne"], "e": "Local irritation and burning is the commonest side effect of calcipotriene (vitamin D3 analogue).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A25 year-old male patient presented with severely itchy, flat topped shiny papules scattered allover the body of 3 weeks duration. which history data is important to-ask about it in this patient ?", "c": "Hepatitis C virus infection", "d": ["Personal contact with infected animals", "Family history of a similar condition", "History of prolonged exposure to sunlight"], "e": "Lichen planus is linked to hepatitis C. Screen for HCV in widespread or mucosal LP.", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45 year old female presented with a symptomatic linear white streaks on the buccal mucosa, the patient is hypertensive. What class of antihypertensive better to be avoided in this patient?", "c": "Angiotens in converting enzyme inhibitors", "d": ["Calcium channel blockers", "alpha2-receptor agonists", "Alpha blockers"], "e": "ACE inhibitors, beta blockers and thiazides can trigger lichenoid drug eruptions and oral lichenoid reactions.", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the initial lesion of lichen planus?", "c": "Flat-topped violaceous papule with white lines", "d": ["Vesicle on erythematous base", "Nummular plaque with scaling", "Target lesion"], "e": "Lichen planus lesion: flat-topped, polygonal, violet, itchy papule with fine white lines (Wickham striae).", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is a distinctive feature seen in the papules of Lichen Planus?", "c": "Wickham striae", "d": ["Telangiectasia", "Pustules", "Bullae"], "e": "Wickham striae: fine white lines or network on LP papules and oral lesions. Pathognomonic.", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the cause of post-inflammatory hyperpigmentation in Lichen Planus?", "c": "Melanin pigmentary incontinence in the upper dermis", "d": ["Increased melanin production in the epidermis", "Increased blood vessel density", "Accumulation of keratin in the epidermis"], "e": "Basal layer vacuolation and apoptotic keratinocytes let melanin drop into the upper dermis, where macrophages take it up (melanophages).", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 38-year-old male presented with a truncal rash of recent onset. It began with a single erythematous patch, 20 x 40 mm in size, on the abdomen, with central clearing and peripheral scaling. Two weeks later, multiple smaller reddish plaques and papules appeared symmetrically over the trunk. He did not respond to topical miconazole. What is the most likely diagnosis?", "c": "Pityriasis rosea", "d": ["Plaque psoriasis vulgaris", "Tinea corporis", "Pityriasis rubra pilaris"], "e": "Single herald patch (2-4 cm, central clearing, peripheral scale), then a generalized symmetric eruption 1-2 weeks later that does not respond to antifungals = pityriasis rosea.", "src": "", "dz": "pr", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Spongiosis is a histopathologic feature mainly seen in which of these diseases ?", "c": "Allergic contact dermatitis", "d": ["Acute lichen planus", "Acute urticaria", "Guttate psoriasis"], "e": "Spongiosis (intercellular edema of the epidermis) is the histological sign of eczematous dermatitis, particularly acute allergic contact dermatitis.", "src": "", "dz": "acd", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is needed to induce allergic contact dermatitis?", "c": "Sensitized T lymphocytes", "d": ["Sensitized B lymphocytes", "Activated eosinophils", "High IgE level"], "e": "Allergic contact dermatitis is a classic Type IV hypersensitivity reaction mediated mainly by antigen-specific sensitized T lymphocytes.", "src": "", "dz": "acd", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is a major criterion of atopic dermatitis diagnosis?", "c": "Chronic relapsing course.", "d": ["Pityriasis alba", "Prurigo nodularis", "Dennie morgan sign"], "e": "Hanifin and Rajka major criteria for AD: pruritus, typical morphology and distribution, chronic relapsing course, personal or family atopy. The other options are minor.", "src": "", "dz": "ad", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is against the diagnosis of dermatophytid reaction?", "c": "Presence of fungi in scraping and culture of the dermatophytid reaction.", "d": ["Proven focus of dermatophytosis.", "+ve skin test to dermatophytic antigen.", "Clearing of dermatophytids after the dermatophytosis has been eradicated by anti-fungal"], "e": "A dermatophytid reaction is a secondary immunological skin reaction at a distant site that is strictly sterile, meaning fungi are absent on microscopic scraping and culture.", "src": "", "dz": "infd", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A60 years old male patient presenting with dry, scaly erythematous skin of the lower lim and exaggerated skin markings, with increasing severity in the winter time. He was taking diuretics and lipid lowering agents. What is your diagnosis?", "c": "Asteatotic eczema.", "d": ["Atopic dermatitis", "Irritant contact dermatitis", "Discoid eczema"], "e": "Asteatotic eczema (eczema craquelé): elderly, winter, dry cracked scaly shins. Worse with diuretics, lipid-lowering drugs, low humidity, frequent bathing.", "src": "", "dz": "ast", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A patient is diagnosed with acute eczema. Which of the following histopathological findings is most characteristic of this condition?", "c": "Spongiotic vesicles", "d": ["Hyperkeratosis with parakeratosis", "Acantholysis with suprabasal clefting", "Dense lymphocytic infiltrate at the dermoepidermal junction"], "e": "Acute eczema is histologically with main intercellular epidermal edema (spongiosis), which coalesces to form intraepidermal spongiotic vesicles.", "src": "", "dz": "eczg", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following happens in pathophysiology of allergic contact dermatitis?", "c": "The formation of protein hapten conjugates", "d": ["Immunoglobulin mediated reaction", "Non immunologically mediated reaction", "Occurs on first exposure to allergen"], "e": "Small chemicals are not immunogenic on their own; they must bind to carrier skin proteins to form hapten-protein conjugates that can be processed and presented by Langerhans cells.", "src": "", "dz": "acd", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "An 85-year-old patient presents with dry, itchy, and cracked skin in the winter. What is the most likely diagnosis?", "c": "Asteatotic eczema", "d": ["Lichen simplex chronicus", "Psoriasis", "Contact dermatitis"], "e": "Asteatotic eczema (eczema craquelé): elderly people in cold dry winter.", "src": "", "dz": "ast", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "An elderly patient with varicose veins develops itchy, inflamed skin over the lower limbs. What is the most likely diagnosis?", "c": "Gravitational eczema", "d": ["Atopic dermatitis", "Nummular eczema", "Contact dermatitis"], "e": "Gravitational (stasis) eczema develops on the lower limbs of elderly or predisposed patients from venous insufficiency and varicose veins.", "src": "", "dz": "grav", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is true about irritant contact dermatitis?", "c": "Bullous lesions may be seen", "d": ["Immune mediated", "Delayed hypersensitivity", "IgE-mediated reaction"], "e": "Severe acute irritant contact dermatitis (e.g., from strong acids or alkalis) can cause tissue destruction giving vesicles or large bullous lesions.", "src": "", "dz": "icd", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which clinical feature is associated with acute eczema?", "c": "Red, scaly skin with crusting", "d": ["Lichenification", "Thickened skin with fissures", "Patchy spongiosis"], "e": "Acute eczema features intense erythema, edema, vesicles, oozing, and golden crusting.", "src": "", "dz": "eczg", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "Which of the following is a common management approach for acute irritant contact dermatitis?", "c": "Wet dressings with Burow's solution", "d": ["Systemic glucocorticoids", "Barrier creams", "Shaving of hair"], "e": "Acute oozing or vesiculobullous irritant contact dermatitis is managed with cool, wet astringent compresses to dry up lesions and soothe inflammation.", "src": "", "dz": "icd", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the primary difference between phototoxic and photoallergic reactions in photo- sensitization?", "c": "Phototoxic reactions occur immediately, while photoallergic reactions occur after sensitization and are delayed.", "d": ["Phototoxic reactions are immunological, while photoallergic reactions are non-immunological.", "Phototoxic reactions are delayed, while photoallergic reactions occur immediately.", "Phototoxic reactions are caused by UV radiation alone, while photoallergic reactions require chemical exposure."], "e": "Sensitization and are delayed. Phototoxic reactions are non-immunological, direct cell damage responses occurring on first exposure; photoallergic reactions are T-cell-mediated delayed hypersensitivity responses requiring a prior sensitization phase.", "src": "", "dz": "photo", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "In photoallergic contact dermatitis, what is the role of the photo-antigen?", "c": "It forms a hapten when combined with UV radiation, leading to an immune response.", "d": ["It directly causes immediate irritation upon UV exposure.", "It acts as a primary irritant that does not require UV exposure.", "It neutralizes the effect of UV radiation on the skin"], "e": "Response. In photoallergic reactions, UV radiation alters the pro-hapten chemical into a reactive hapten that binds to skin proteins, triggering a cell-mediated immune response.", "src": "", "dz": "photo", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which type of dermatitis is associated with direct contact with microorganisms?", "c": "Infective dermatitis", "d": ["Photo-allergic dermatitis", "Irritant contact dermatitis", "Allergic contact dermatitis"], "e": "Infective dermatitis is an eczematous response triggered by direct skin contact with bacterial pathogens or their products.", "src": "", "dz": "infd", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is NOT a criterion for diagnosing dermatophytid?", "c": "Presence of fungi in scrapings at the distant site", "d": ["Proven focus of dermatophytosis", "Positive skin test to dermatophytic antigen", "Clearing of dermatophytid after antifungal treatment of the primary infection"], "e": "Dermatophytid reactions are secondary immunologic eruptions at a distant site that are strictly sterile.", "src": "", "dz": "infd", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the primary cause of asteatotic eczema (senile eczema)?", "c": "Decrease in ceramides and skin lipids with aging", "d": ["Overproduction of skin lipids and moisture", "Allergic reactions to environmental allergens", "Genetic predisposition in young adults"], "e": "Asteatotic eczema is caused by a marked reduction in epidermal lipids combined with decreased sebum secretion and age-related transepidermal water loss.", "src": "", "dz": "ast", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which type of eczema is associated with coin-shaped or discoid plaques?", "c": "Nummular eczema", "d": ["Asteatotic eczema", "Dyshidrotic eczema", "Seborrheic dermatitis"], "e": "Nummular (discoid) eczema shows distinct, coin-shaped (nummular), intensely pruritic erythematous scaly or crusted plaques.", "src": "", "dz": "num", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the most likely prognosis for nummular (discoid) eczema?", "c": "Gradual resolution within 2-3 years", "d": ["Lifelong condition without remission", "Progressive worsening with age", "Rapid improvement with antifungal treatment"], "e": "Nummular eczema tends to follow a chronic, relapsing course that often undergoes gradual resolution over a few years with proper skin care and treatment.", "src": "", "dz": "num", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is a clinical feature of gravitational eczema?", "c": "Brown pigmentation and edema on the inner aspect of the lower legs", "d": ["Flaky patches on the scalp and face", "Vesicular eruption on the palms and soles", "Coin-shaped lesions on the arms and legs"], "e": "Gravitational eczema features lower leg edema, stasis purpura, hyperpigmentation, and eczematous changes on the medial lower extremity.", "src": "", "dz": "grav", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the primary mechanism involved in the development of gravitational (stasis) eczema?", "c": "Increased venous pressure leading to capillary distension and fibrin deposition", "d": ["Immune response to fungal antigens", "Infection by bacteria such as Staphylococcus aureus", "Allergic reaction to topical irritants"], "e": "Venous hypertension impairs microvascular circulation, driving capillary distension, extravasation of red blood cells, pericapillary fibrin cuff formation, and tissue ischemia that triggers stasis dermatitis.", "src": "", "dz": "grav", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is a hallmark symptom of atopic dermatitis (AD)?", "c": "Pruritus", "d": ["Ulceration", "Hypopigmentation", "Vesicle formation"], "e": "Itch is the main symptom of AD and a must for diagnosis (the itch that rashes).", "src": "", "dz": "ad", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is considered a major criterion for the diagnosis of atopic dermatitis according to Hanifin and Rajka's criteria?", "c": "Pruritus", "d": ["Periorbital pigmentation", "Cheilitis", "Pityriasis alba"], "e": "Pruritus is one of the 4 major Hanifin and Rajka criteria. The others listed are minor.", "src": "", "dz": "ad", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Which treatment method is most effective for managing lichen simplex chronicus?", "c": "Occlusive bandages and topical glucocorticoids", "d": ["Oral antibiotics", "Phototherapy", "Oral corticosteroids"], "e": "Breaking the itch-scratch cycle is the priority in lichen simplex chronicus; application of high-potency topical steroids under occlusion physically blocks scratching.", "src": "", "dz": "lsc", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "Which of these drugs can be used to prevent the attacks of angioedema?", "c": "Anti fibrinolytic", "d": ["Cyclosporine", "Low dose systemic corticosteroid", "High dose of antihistamine"], "e": "Antifibrinolytics as well as attenuated androgens or C1-INH concentrates are used as prophylactic agents to prevent attacks in patients with hereditary or acquired C1-inhibitor deficiency angioedema.", "src": "", "dz": "ang", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of these mediators induce angioedema without wheals?", "c": "Bradykinin", "d": ["Serotonin", "Histamine", "dopamine"], "e": "Bradykinin-mediated angioedema presents as deep dermal and subcutaneous edema without wheals/urticaria or marked pruritus.", "src": "", "dz": "ang", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the most common cause of chronic urticaria?", "c": "Idiopathic", "d": ["Food allergy", "Hidden malignancy", "Chronic infections"], "e": "Chronic spontaneous urticaria is mostly idiopathic (50-80% have no trigger). Many have an autoimmune basis.", "src": "", "dz": "urt", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Which drug could adversely cause angioedema?", "c": "Captopril", "d": ["Atropine", "Paracetamol", "Cyclosporine"], "e": "Captopril is an ACE inhibitor (ACEI). ACE inhibitors prevent the breakdown of bradykinin, giving accumulated bradykinin levels and triggering drug-induced angioedema.", "src": "", "dz": "ang", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the most common cause of acute urticaria?", "c": "Idiopathic causes", "d": ["Physical stimuli like heat or cold", "Bacterial infections", "Penicillin and cephalosporin allergy"], "e": "Viral infection is the commonest identified trigger, but many acute cases stay idiopathic.", "src": "", "dz": "urt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which disease is characterized by subcorneal intragranular bullae?", "c": "Bullous impetigo", "d": ["Dermatitis herpetiform", "Pemphigus vulgaris", "Steven Johnson syndrome"], "e": "Staph aureus exfoliative toxin cuts desmoglein 1 in the upper granular layer: superficial subcorneal split.", "src": "", "dz": "pem", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "A 35-year-old male presented by severe itching in the back, arms and knees of several months duration which did not respond to antiscabitics. Examination revealed few intact vesicleswith excoriations and erosions in the same distribution. Immunofluorescence showed granularlgA deposits at dermo-epidermal junction. What is the most likely diagnosis for this case?", "c": "Dermatitis herpetiformis", "d": ["Pemphigus vulgaris", "Pemphigus foliaceous", "Bullous impetigo"], "e": "Symmetric extensor lesions, severe itch, no response to scabicides and granular IgA on DIF = dermatitis herpetiformis.", "src": "", "dz": "dh", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 40-year-old man with a history of celiac disease presents with itchy, grouped vesicles on his elbows and knees. What is the most likely diagnosis?", "c": "Dermatitis herpetiformis", "d": ["Bullous pemphigoid", "Psoriasis", "Erythema multiforme"], "e": "Dermatitis herpetiformis goes with celiac disease: grouped, very itchy lesions on elbows and knees.", "src": "", "dz": "dh", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 50-year-old woman presents with painful oral erosions and flaccid blisters on her skin. The blisters easily rupture, leaving raw areas. What is the most likely diagnosis?", "c": "Pemphigus vulgaris", "d": ["Bullous pemphigoid", "Stevens-Johnson syndrome", "Contact dermatitis"], "e": "Flaccid blisters, positive Nikolsky and painful mucosal lesions = pemphigus vulgaris.", "src": "", "dz": "pem", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "What is the treatment of choice for dermatitis herpetiformis based on histopathology?", "c": "Dapsone", "d": ["Acyclovir", "Methotrexate", "Topical steroids"], "e": "Dapsone blocks neutrophil recruitment and function. Fast and the treatment of choice.", "src": "", "dz": "dh", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "In which blistering disorder does subepidermal separation occur, leading to tense bullae?", "c": "Bullous pemphigoid", "d": ["Pemphigus vulgaris", "Dermatitis herpetiformis", "Epidermolysis bullosa"], "e": "Antibodies against BP180 and BP230 give a deep subepidermal split with tense bullae that do not burst easily.", "src": "", "dz": "bp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "The Nikolsky sign is associated with which of the following conditions?", "c": "Pemphigus vulgaris", "d": ["Bullous pemphigoid", "Epidermolysis bullosa", "Dermatitis herpetiformis"], "e": "Nikolsky positive (normal epidermis slides off with sideways pressure): intraepidermal split of pemphigus vulgaris, also TEN.", "src": "", "dz": "pem", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Pemphigus foliaceus is characterized by which type of blistering?", "c": "Subcorneal intragranular acantholysis", "d": ["Suprabasal acantholysis", "Subepidermal separation", "Spongiotic vesicles"], "e": "Anti-Dsg1 antibodies split the epidermis high up, subcorneal and intragranular.", "src": "", "dz": "pf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Toxic Epidermal Necrolysis (TEN) is most commonly caused by which of the following?", "c": "Drug reactions", "d": ["Viral infections", "Autoimmune conditions", "Bacterial infections"], "e": "Over 80% of TEN is drug induced: allopurinol, antiepileptics, sulfonamides, NSAIDs.", "src": "", "dz": "bmisc", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following correctly describes the pathological findings in Toxic Epidermal Necrolysis (TEN)?", "c": "Subepidermal separation with pan-epidermal necrosis", "d": ["Subcorneal blister formation with neutrophil infiltration", "Intracellular edema with ballooning degeneration", "Intraepidermal separation between keratinocytes"], "e": "Widespread apoptosis gives full-thickness epidermal necrosis and a subepidermal split.", "src": "", "dz": "bmisc", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "What is the role of intravenous immunoglobulin (IVIG) in the management of Toxic Epidermal Necrolysis (TEN)?", "c": "IVIG has an anti-apoptotic effect and is best given early", "d": ["IVIG is used to treat secondary infections", "IVIG helps reduce itching and inflammation", "IVIG is only used in cases of bacterial infection"], "e": "IVIG has anti-Fas antibodies that block keratinocyte apoptosis. Best early in the acute phase.", "src": "", "dz": "bmisc", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 2-year-old child is brought to the dermatologist by his parents due to persistent dry, scaly skin since birth. The parents describe the skin as thickened and plate-like, with large, dark scales, particularly noticeable on the trunk and extremities. The child's skin appears tight and shiny, and there is some ectropion (outward turning of the eyelids). The parents report that they have tried various moisturizing creams, but the condition persists. There is no family history of similar skin conditions. What is the most likely diagnosis ?", "c": "Lamellar ichthyosis", "d": ["Atopic dermatitis", "Psoriasis", "Seborrheic dermatitis"], "e": "Present at birth, plate-like dark scales, ectropion, no response to moisturizers, negative family history (AR) = lamellar ichthyosis.", "src": "", "dz": "lam", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "What is the mainstay of treatment for lamellar ichthyosis ?", "c": "Oral retinoids", "d": ["Systemic corticosteroids", "Antifungal creams", "Immunosuppressive agents"], "e": "Emollients only help symptoms. Oral retinoids (acitretin) are the main systemic treatment for severe lamellar ichthyosis.", "src": "", "dz": "lam", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which disease is characterized by the separation of skin layers at the lamina lucida?", "c": "Junctional epidermolysis bullosa", "d": ["Epidermolysis bullosa simplex", "Dystrophic epidermolysis bullosa", "Bullous pemphigoid RT"], "e": "Junctional EB: split inside the basement membrane at the lamina lucida.", "src": "", "dz": "eb", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "At what age do patients with Xeroderma Pigmentosum commonly develop skin cancer?", "c": "Before age 10", "d": ["During adolescence", "In their 20s", "In their 30s"], "e": "Without UV protection, xeroderma pigmentosum children get skin cancer at a median age of 8-9 years, often before 10.", "src": "", "dz": "xp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is a characteristic feature of xeroderma pigmentosa?", "c": "Early onset photosensitivity", "d": ["Posterior segment of the eye is more affected than the anterior segment", "Appearance of freckles in adolescence", "Melanoma is the commonest associated skin tumour"], "e": "Xeroderma pigmentosum: severe sunburn after minimal sun, from early infancy.", "src": "", "dz": "xp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Broad nasal root leading to the presence of dystopia canthorum is a manifestation of which of the following diseases?", "c": "Waardenburg Syndrome", "d": ["Piebaldism", "Vitiligo", "Chediak-Higashi Syndrome"], "e": "Dystopia canthorum (inner canthi displaced sideways) with a broad nasal root = Waardenburg type 1.", "src": "", "dz": "mel", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which disease typically affects the central nervous system, eyes, ears, and skin in sequence?", "c": "Vogt-Koyanagi-Harada syndrome", "d": ["Sarcoidosis", "Neurofibromatosis", "Multiple sclerosis"], "e": "VKH comes in phases: meningism, then uveitis or retinal detachment, then tinnitus and deafness, then skin (vitiligo, poliosis, alopecia).", "src": "", "dz": "vkh", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is true about melanocytes?", "c": "Arise from neural crest", "d": ["Found only in dermis", "Arise from bone marrow", "Produce keratin"], "e": "Melanocytes come from the neural crest and migrate to the basal layer and hair follicles.", "src": "", "dz": "mel", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following conditions is associated with congenital deafness, heterochromia irides, and broad nasal root dystopia?", "c": "Waardenburg Syndrome", "d": ["Chediak-Higashi Syndrome", "Piebaldism", "Vogt-Koyanagi Syndrome"], "e": "Waardenburg: sensorineural deafness, iris heterochromia, white forelock, dystopia canthorum.", "src": "", "dz": "mel", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which autoimmune disease is commonly associated with vitiligo?", "c": "Autoimmune thyroiditis", "d": ["Rheumatoid arthritis", "Lupus erythematosus", "Celiac disease"], "e": "Autoimmune thyroid disease (Hashimoto, Graves) is the commonest autoimmune association of vitiligo.", "src": "", "dz": "vit", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which autoimmune diseases are commonly associated with vitiligo?", "c": "Addison's disease, thyroid disease, and diabetes", "d": ["Rheumatoid arthritis and SLE", "Multiple sclerosis and Crohn's disease", "Ulcerative colitis and myasthenia gravis"], "e": "Hashimoto, Graves, type 1 diabetes and Addison disease cluster with vitiligo.", "src": "", "dz": "vit", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which disorder causes Cicatricial alopecia?", "c": "Lichen planus", "d": ["Psoriasis", "Alopecia areata", "Disseminated lupus erythematosus"], "e": "Lichen planopilaris and DLE destroy the hair follicle stem cells: scarring alopecia.", "src": "", "dz": "hair", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 23 year old female patient presented with severe diffuse hair fall for the last month. She had a major accident with severe blood loss 5 months ago, and she had to be hospitalized for a month. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Female pattern hair loss", "Anagen effluvium", "Alopecia areata"], "e": "Major trauma, big blood loss or hospital stay push anagen hairs into telogen. Shedding starts about 2-5 months later.", "src": "", "dz": "te", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A patient presents with premature termination of the anagen phase and a shift to the telogen phase of the hair cycle, which in some cases is due to nutritional deficiency. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Androgenic alopecia", "Alopecia areata", "Trichotillomania"], "e": "Telogen effluvium: anagen ends early and follicles enter telogen together. Triggers: nutritional deficiency, severe stress, systemic illness.", "src": "", "dz": "te", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "A scalp biopsy of a 12-year-old female shows 65% of the hairs to be in the anagen phase, while 35% in the telogen. She is complaining of diffuse hair loss of 8 months duration. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Androgenetic alopecia", "Diffuse alopecia areata", "Anagen effluvium"], "e": "Normal scalp: 85-90% anagen, 10-15% telogen. 35% telogen confirms telogen effluvium.", "src": "", "dz": "te", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45-year-old woman with diabetes, hypertension, and a history of breast cancer presents with diffuse hair loss for 2 weeks. A hair pull test shows 5-7 hairs with dark tapering ends. What is the most likely diagnosis?", "c": "Alopecia areata", "d": ["Androgenetic alopecia", "Telogen effluvium", "Tinea capitis"], "e": "Acute hair loss with a pull test showing dark tapered hairs (exclamation mark, dystrophic anagen hairs) = acute diffuse alopecia areata.", "src": "", "dz": "aa", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 25-year-old woman presents with sudden onset of patchy hair loss on her scalp. She has no other symptoms and no history of hair loss. On examination, you find several smooth, circular patches of hair loss with exclamation point hairs at the margins. What is the most likely diagnosis?", "c": "Alopecia areata", "d": ["Telogen effluvium", "Androgenetic alopecia", "Tinea capitis"], "e": "Sudden smooth non-scarring round patches with exclamation mark hairs at the edge = alopecia areata.", "src": "", "dz": "aa", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45-year-old man presents with gradual hair thinning on the crown and temples. He has a family history of hair loss. On examination, you find miniaturized hairs in the affected areas. What is the most likely diagnosis?", "c": "Androgenetic alopecia", "d": ["Telogen effluvium", "Alopecia areata", "Tinea capitis"], "e": "Slow thinning at the crown and temples, family history, miniaturized hairs = male pattern androgenetic alopecia.", "src": "", "dz": "aga", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 30-year-old woman presents with diffuse hair shedding that started 3 months ago after a stressful event. She has no other symptoms. On examination, you find no scalp abnormalities. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Alopecia areata", "Androgenetic alopecia", "Tinea capitis"], "e": "Diffuse shedding about 3 months after a big stress, no scalp inflammation = acute telogen effluvium.", "src": "", "dz": "te", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Wearing a tight ponytail over time may lead to which type of hair loss?", "c": "Traction alopecia", "d": ["Alopecia areata", "Telogen effluvium", "Anagen effluvium"], "e": "Persistent mechanical tension from tight hairstyles causes mechanical follicular trauma known as traction alopeci.", "src": "", "dz": "ttm", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is characterized by perifollicular lymphocytic infiltrate?", "c": "Alopecia areata", "d": ["Androgenetic alopecia", "Telogen effluvium", "Anagen effluvium"], "e": "Alopecia areata histology: dense perifollicular lymphocytes around anagen bulbs (swarm of bees).", "src": "", "dz": "aa", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which type of alopecia is characterized by partial or complete loss of hair, particularly on the scalp, without scarring?", "c": "Alopecia areata", "d": ["Cicatricial alopecia", "Androgenetic alopecia", "Diffuse hair loss"], "e": "Alopecia areata is autoimmune. Patchy or widespread non-scarring loss, follicle stem cells stay intact.", "src": "", "dz": "aa", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A 20-year-old man presents with sudden onset of diffuse hair loss on his scalp. He has been undergoing chemotherapy for cancer. What is the most likely diagnosis?", "c": "Anagen effluvium", "d": ["Telogen effluvium", "Alopecia areata", "Androgenetic alopecia"], "e": "Heavy hair shedding within days to weeks of cytotoxic chemotherapy = anagen effluvium.", "src": "", "dz": "te", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 40-year-old woman presents with hair loss on the top of her head. She has a history of hypothyroidism. On examination, you find diffuse hair thinning with no scalp abnormalities. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Alopecia areata", "Anagen effluvium", "Androgenetic alopecia"], "e": "Thyroid disease (hypo or hyper) causes chronic telogen effluvium: diffuse non-scarring thinning.", "src": "", "dz": "te", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A35 year old male patient presented to the out patient clinic with single painless ulcer on the glans penis The patient said this lesion appeared after unprotected sexual intercourse. What is the expected time lapse between sexual intercourse and appearance of this lesion?", "c": "3 weeks", "d": ["6 weeks", "1 week", "8 weeks"], "e": "Incubation of primary syphilis (exposure to chancre) is about 21 days.", "src": "", "dz": "sypt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 35-year-old male patient presented to the outpatient clinic with single painless ulcer on the glans penis. The patient said this lesion appeared alter The unprotected sexual intercourse. What is/are the other expected findings in this patient?", "c": "Inguinal lymphadenopathy", "d": ["Pityriasiform lesions on the trunk", "Snail track ulcers", "Flat sessile perianal papules"], "e": "Primary syphilis: painless indurated chancre with firm non-tender non-suppurative inguinal nodes.", "src": "", "dz": "sypt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45-year-old male patient presented with well-defined, non-itchy erythematous scaly patches on both palms and soles of 1 month's duration. Examination revealed generalized lymphadenopathy and an ulcer on his palate. What is the most likely diagnosis?", "c": "Secondary stage syphilis", "d": ["Psoriasis", "Contact dermatitis", "tenia manus"], "e": "Non-itchy scaly palm and sole rash, mucous patches and generalized nodes = secondary syphilis.", "src": "", "dz": "syp2", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 25-year-old male patient presents with widespread maculopapular, scaly, non-itchy, and non-tender oral and genital lesions, along with non-tender lymphadenopathy. What is the most likely diagnosis?", "c": "Secondary stage syphilis", "d": ["Lichen planus", "Guttate psoriasis", "Plaque psoriasis"], "e": "Widespread non-itchy scaly maculopapular rash including palms, soles and genital mucosa, with non-tender generalized nodes = secondary syphilis.", "src": "", "dz": "syp2", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Tertiary syphilis is most commonly associated with which of the following pathological features?", "c": "Necrotizing granulomas", "d": ["Mucosal erosions", "Condyloma lata", "Maculopapular rash"], "e": "Tertiary syphilis: gummas, destructive necrotizing granulomas (delayed hypersensitivity).", "src": "", "dz": "syp3", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "What is the recommended first-line treatment for gonorrhea?", "c": "Ceftriaxone 250 mg IM single dose", "d": ["Ciprofloxacin 500 mg oral single dose", "Spectinomycin 2 g IM single dose", "Azithromycin 1 g oral single dose"], "e": "Single IM dose of ceftriaxone is the base of treatment for uncomplicated gonorrhea.", "src": "", "dz": "gon", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which type of erection is mainly dopaminergic?", "c": "Psychogenic.", "d": ["Priapism.", "Nocturnal.", "Reflexogenic."], "e": "Psychogenic erections are mainly triggered by central nervous system processing where dopamine acts as a key central neurotransmitter facilitating erectile response.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is meant by erectile dysfunction?", "c": "Inability to achieve and maintain erection adequate for satisfaction of both partners", "d": ["An inability to have orgasm during sexual intercourse", "Inability to achieve erection due to decreased libido", "Rapid ejaculation before the satisfaction of both male and his female partner"], "e": "Partners Erectile dysfunction is formally defined as the consistent or recurrent inability to attain and/or maintain a penile erection sufficient for satisfactory sexual performance.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 56-year-old male patient presents with progressive erectile dysfunction over the past 3 years. Penile duplex ultrasound reveals a peak systolic velocity (PSV) of 45 cm/s and an end diastolic velocity (EDV) of 15 cm/s. What is the most likely diagnosis in this patient?", "c": "Venous leakage", "d": ["Psychogenic", "Mixed arterial and venous defect", "Arterial insufficiency"], "e": "On penile duplex ultrasound, a normal PSV excludes arterial disease.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What does a RigiScan assessment measure during nocturnal penile tumescence?", "c": "Rigidity and tumescence of the penis", "d": ["Blood pressure in the penis", "Hormone levels in the bloodstream", "Lipid profile and glucose levels"], "e": "The RigiScan device is used during nocturnal penile tumescence monitoring to objectively measure both changes in penile circumference and buckling resistance.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which test assesses the change in penile circumference during an erection?", "c": "RigiScan", "d": ["Intracavernosal injection", "Penile brachial index", "Doppler wave form assessment"], "e": "RigiScan records circumference and rigidity at tip and base during sleep. Separates organic from psychogenic ED.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "If After 2 years of marriage, the wife of a 35 year man did not get pregnant. He sought medical advice. His genital examination was normal while his repeated semen profile revealed absent sperm in the ejaculate. His doctor asked for a hormonal assay that revealed normal LH, FSH levels, what would be the possible cause of his infertility?", "c": "Genital tract obstruction", "d": ["Prolactinoma induced infertility", "Anti-sperm antibody induced infertility", "Anejaculation induced infertility"], "e": "Azoospermia with normal testis size, normal FSH and LH and normal exam = obstructive (absent vas, ejaculatory duct obstruction).", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "After 2 years of marriage, the wife of a 35 year man did not get pregnant. He sought medical advice. His genital examination was normal while his repeated semen profile revealed azoospermia. How can the semen findings be interpreted?", "c": "Absent sperm in the ejaculate", "d": ["Low sperm motility", "Absent ejaculate", "Low semen volume"], "e": "Azoospermia = no sperm at all in the centrifuged ejaculate.", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A penile duplex ultrasound with peak systolic velocity 40 and end diastolic velocity 12 is diagnostic for which condition?", "c": "Venous leakage", "d": ["Arterial insufficiency", "Mixed arterial and venous insufficiency", "Psychogenic erectile dysfunction"], "e": "A peak systolic velocity of 40 cm/s means Normal arterial flow.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A 40-year-old man was unable to father a child since 2 years. He asked for medical advice. Genital examination was normal. His hormonal profile revealed normal serum levels of LH & FSH. His doctor didn't find any cause of his infertility after thorough medical history and examination. What is the essential drug to be used to treat his condition?", "c": "Clomiphene citrate", "d": ["Dopamine antagonist", "Bromocriptine", "Testosterone"], "e": "Idiopathic male infertility with normal gonadotropins: empirical clomiphene or tamoxifen.", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A man complained of male infertility. His semen analysis showed a sperm count of 30 million per mL, 20% of the sperm had rapid forward progression, and 99% were deformed. What is the most likely diagnosis?", "c": "Teratozoospermia", "d": ["Oligozoospermia", "Asthenozoospermia", "Azoospermia"], "e": "Normal count (30 million/mL) and motility (20% is borderline) but 99% abnormal forms = teratozoospermia.", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "An infertile man had a normal genital examination. His semen analysis showed a sperm count of 12 million per mL, with 75% abnormal forms and 60% of the sperm showing forward progression. What is the most likely diagnosis?", "c": "Oligoteratozoospermia", "d": ["Asthenozoospermia", "Teratozoospermia", "Oligospermia"], "e": "Low count (12 million/mL) plus 75% abnormal forms = oligoteratozoospermia.", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A 40-year-old man was unable to father a child for 2 years. He asked for medical advice. Genital examination was normal. His hormonal profile revealed low gonadotropin releasinghormone with subsequent low LH and FSH: His radiological examination showed a pituitarymass: What is the essential drug to be used to treat his condition?", "c": "Bromocriptine", "d": ["Tamoxifen", "Testosterone", "Clomiphene citrate"], "e": "Pituitary prolactinoma with hypogonadotropic hypogonadism (low GnRH, LH, FSH): dopamine agonists, bromocriptine or cabergoline.", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A male patient presents with infertility but has normal FSH and LH levels. Which of the following is the most appropriate treatment for his condition?", "c": "Clomiphene citrate", "d": ["No treatment", "Bromocriptine", "Testosterone replacement therapy"], "e": "Idiopathic male infertility with normal gonadotropins: empirical clomiphene.", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is the most specific phosphodiesterase-5 inhibitor used for erectile dysfunction?", "c": "Avanafil", "d": ["Sildenafil", "Tadalafil", "Vardenafil"], "e": "Avanafil is noted for having one of the highest selectivities for phosphodiesterase-5 over other PDE enzymes, minimizing off-target visual or cardiac side effects.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A male has no sperm in his ejaculate but has a normal hormonal profile. What is the likely cause?", "c": "Genital tract obstruction", "d": ["Primary testicular failure", "Klinefelter syndrome"], "e": "No sperm with normal FSH, LH and testosterone: spermatogenesis is normal, the block is after the testis (e.g. congenital absent vas).", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "How is asthenozoospermia defined?", "c": "Less than 50% motile sperm with forward progression", "d": ["Less than 20 million sperm/mL", "Absence of sperm", "Sperm with abnormal morphology"], "e": "Asthenozoospermia is defined by World Health Organization standards as having a progressive motility percentage below the lower reference limit.", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which is common characteristic of impetigo?", "c": "Honey combed crusts", "d": ["Thick dry scales", "Painful blisters", "Red itchy patches with haemorrhagic crusts"], "e": "Non-bullous impetigo is clinically with thin-roofed vesicles that rupture and dry to form classic golden-yellow or \"honey-comb\" crusts.", "src": "", "dz": "imp", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "A 50-year-old female presented with well defined, asymptomatic hyper pigmented patch on both axillae of 3 months duration. What is the most appropriate systemic treatment for her?", "c": "Erythromycin", "d": ["Itraconazole", "Griseofulvin", "Tetracycline"], "e": "The clinical presentation of well-defined hyperpigmented patches in the axillae without scale and showing coral-red fluorescence is erythrasma, caused by Corynebacterium minutissimum.", "src": "", "dz": "eryth", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 32-year-old woman presents to the clinic with painful sores on her lower legs. She mentions that these started as small blisters but have since broken down into deep ulcers with thick, adherent crusts. She has a history of poorly controlled diabetes mellitus. On examination, there are several ulcerative lesions with purulent discharge and a surrounding area of erythema. What is the most likely diagnosis ?", "c": "Ecthyma", "d": ["Impetigo", "Herpes simplex virus infection", "Pyoderma gangrenosum"], "e": "Ecthyma is a deeper form of impetigo that penetrates through the epidermis into the dermis, forming deep \"punched-out\" ulcers with thick crusts.", "src": "", "dz": "ecth", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "Which of the following is the most appropriate management for this condition?", "c": "Oral antibiotics such as penicillin or cephalexin", "d": ["Topical mupirocin", "Surgical debridement", "Oral antifungal therapy"], "e": "Because ecthyma is a deeper bacterial infection, systemic oral antibiotic therapy is required for proper healing.", "src": "", "dz": "ecth", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the most probable diagnosis of erythematous, hot, tender and painful swelling on the back with multiple pus discharging orifices?", "c": "Carbuncle", "d": ["Infection of multiple follicular ostia", "Furuncle", "Acne fulminans"], "e": "A carbuncle is a deeper, coalescent infection of multiple contiguous hair follicles presenting as a hot, painful, erythematous mass discharging pus.", "src": "", "dz": "fur", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "A 45-year-old male patient presented to dermatology clinic with diffuse red painful and hot swelling of his left leg. Doppler ultrasound showed patent venous system of lower limbs. What drug can be used for treatment of this patient?", "c": "Intramuscular benzathine penicillin", "d": ["Oral Prednisolone.", "Oral terbinafine", "Intravenous heparin"], "e": "Diffuse, hot, painful leg swelling with a patent venous system is classic for cellulitis or erysipelas, for which penicillin is the primary treatment.", "src": "", "dz": "cell", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A4 year old boy presented to dermatology clinic with multiple yellowish crusted lesions over his chin. The main symptom was itching. His cousin had similar lesions. The boy is generally good. What is the most probable diagnosis?", "c": "Impetigo", "d": ["Folliculitis", "Herpetic infection", "Eczema herpeticum"], "e": "Young child, itchy yellow-crusted lesions on the chin, spreads to contacts = impetigo.", "src": "", "dz": "imp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the clinical presentation of classical erythrasma?", "c": "It is well defined hyper pigmented patch with finely wrinkled surface", "d": ["It is well defined patch, erythematous, surrounded by small satellite pustules", "It usually affects the flexural areas"], "e": "Classical presentation consists of well-demarcated, reddish-brown, or hypigmented patches with fine scaling and a characteristic finely wrinkled surface.", "src": "", "dz": "eryth", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "A 4-year-old boy presented to dermatology clinic with multiple yellowish crusted lesions over his chin and scalp. The main symptom was itching. His close cousin had similar lesions. Which drug could be used for treatment of this child?", "c": "Flucloxacillin", "d": ["Acyclovir", "Salicylic acid", "Terbinafine"], "e": "Impetigo is Staph aureus or Strep pyogenes. Widespread: oral anti-staph beta-lactam, flucloxacillin or cephalexin.", "src": "", "dz": "imp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following types of bacterial infections is most likely to leave a scar?", "c": "Ecthyma", "d": ["Bockhart's impetigo", "Bullous impetigo", "Cellulitis"], "e": "Unlike superficial impetigo which heals without scarring, ecthyma extends deep into the dermis and heals with scar formation.", "src": "", "dz": "ecth", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of these clinical presentations is predominantly caused by streptococci?", "c": "Painful tender swelling with diffuse border", "d": ["Painful tender swelling with multiple orifices discharging pus", "Large bullae covered with thin crusts", "Multiple follicular orifices discharging pus"], "e": "Erysipelas and cellulitis: painful tender red swelling, sharp or diffuse border. Mostly beta-hemolytic strep.", "src": "", "dz": "cell", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 70-year-old male patient who is obese and suffering from diabetes presents with a scaly brownish skin lesion in the axilla. KOH examination from the lesion is negative. What is the likely result upon Wood's light examination?", "c": "Coral red fluorescence", "d": ["Golden yellow fluorescence", "Brilliant green fluorescence", "Accentuation of the brownish colour"], "e": "Erythrasma produces characteristic coral-red fluorescence under Wood's lamp examination from porphyrins produced by Corynebacterium minutissimum.", "src": "", "dz": "eryth", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "What is the drug of choice for prophylaxis against recurrent erysipelas?", "c": "Long-acting Penicillin G", "d": ["Ceftriaxone", "Erythromycin", "Vancomycin"], "e": "Long-acting benzathine penicillin G administered intramuscularly every 2 to 4 weeks is the drug of choice for preventing recurrent episodes of erysipelas.", "src": "", "dz": "cell", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following infections may present with fever and headache?", "c": "Carbuncle", "d": ["Tinea corporis", "Molluscum contagiosum", "Verruca vulgaris"], "e": "Deep, extensive skin infections like carbuncles are often accompanied by systemic constitutional symptoms such as fever, malaise, and headache.", "src": "", "dz": "fur", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which bacterial skin infection usually requires surgical intervention?", "c": "Carbuncle", "d": ["Impetigo", "Folliculitis", "Furuncle"], "e": "Due to deep tissue necrosis, loculated pus collection, and multiple draining sinuses, mature carbuncles often require surgical incision and drainage alongside antibiotics.", "src": "", "dz": "fur", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the type of leprosy with the highest bacterial load?", "c": "Lepromatous leprosy", "d": ["Tuberculoid leprosy", "Borderline tuberculoid leprosy", "Borderline lepromatous leprosy"], "e": "Lepromatous leprosy: huge bacterial load, millions of AFB inside macrophages (Virchow cells), because of anergy to M. leprae.", "src": "", "dz": "lep_ll", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the main mode of transmission of mycobacterium leprae?", "c": "Droplet infection", "d": ["Blood products", "Transplacental", "Skin Contact"], "e": "M. leprae spreads by droplets from nasal secretions of untreated multibacillary patients.", "src": "", "dz": "lepx", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "What is the WHO regimen for the treatment of multibacillary leprosy?", "c": "Rifampicin 600 mg once /month, clofazimine 300mg once/month, clofazimine 50 mg daily and dapsone 100mg daily for 12-18 months", "d": ["Rifampicin 600mg once /month and dapsone 100mg daily for 12-18 months", "Rifampicin 600mg once /month and dapsone 100mg/month for 12-18 months", "Rifampicin 600mg once/month and clofazimine 50 mg daily for 12-18 months"], "e": "MB leprosy (WHO MDT): monthly supervised rifampicin and clofazimine, daily dapsone and clofazimine, for 12-18 months.", "src": "", "dz": "lepx", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is a distinct feature of depromatous leprosy?", "c": "Naked granuloma with reticulin", "d": ["Normal Cell Mediated Immunity", "Macrophage granuloma", "Epithelioid cells"], "e": "Lepromatous histology: Grenz zone under the epidermis, diffuse sheets of foamy macrophages with no lymphocyte wall.", "src": "", "dz": "lepx", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the characteristic of Peripheral nerves affection in tuberculoid leprosy?", "c": "asymmetrical and occurring early in the disease", "d": ["symmetrical and occurring early in the disease", "symmetrical and occurring late in the disease", "asymmetrical and occuring late in the disease"], "e": "Tuberculoid: early asymmetric nerve involvement near the skin lesions, marked sensory loss and thick nerves.", "src": "", "dz": "lep_tt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 10-year-old boy presented with multiple patches of alopecia with hair cut few mm above the scalp: Which of these dermatophytes is the probable cause?", "c": "M. auduinii", "d": ["T. mentagrophyle", "T. tonsurans", "M. canis"], "e": "Microsporum audouinii (along with Microsporum canis) is a classic anthropophilic dermatophyte known to cause Gray Patch Tinea Capitis.", "src": "", "dz": "tcap", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is true about moulds?", "c": "Form hyphae", "d": ["They are non filamentous fungi", "Always pathogenic", "Form pseudo hyphae"], "e": "Moulds are filamentous fungi with the formation of multicellular, branching tubular structures known as hyphae that weave together to form mycelia.", "src": "", "dz": "fgen", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following Tinea manus and tinea pedis lesions is exclusively seen on the dorsum of the hands and feet?", "c": "Eczematous or vesiculobullous type", "d": ["Interdigital type", "Erythematous scaly type", "Hyperkeratotic type"], "e": "The eczematous or vesiculobullous type of tinea manus/pedis, often representing an immunological \"dermatophytid\" reaction or acute inflammatory dermatophytosis, usually presents with vesicles and bullae prominently on the palms, soles, and dorsum of the hands and feet.", "src": "", "dz": "tmp", "lk": [], "up": true, "pr": false}, {"t": "Pathology", "s": "A 12-year-old male child presented with a localized area of hair fall. Clinical examination revealed hair stumps and scales. On microscopic examination, endothrix spores were seen. What is the causative organism of this presentation?", "c": "Trichophyton tonsurans", "d": ["Trichophyton rubrum", "Trichophyton mentagrophytes", "Microsporum Audouini"], "e": "Endothrix hair invasion, where arthrospores fill the interior of the hair shaft.", "src": "", "dz": "tcap", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "Which of the following drugs is fungicidal?", "c": "Terbinafine", "d": ["Itraconazole", "Griseofulvin", "Ketoconazole"], "e": "Terbinafine is a synthetic allylamine antifungal that exerts a fungicidal effect against dermatophytes by inhibiting squalene epoxidase.", "src": "", "dz": "fgen", "lk": [], "up": true, "pr": false}, {"t": "Pathology", "s": "A45 year old female patient presented with thickening and discoloration of the nail most prominent near the proximal nail fold. Microscopic examination of culture mounts revealed spherical cells and pseudo hyphae. What is the most appropriate treatment?", "c": "Itraconazole", "d": ["Terbinafine", "Griseofulvin", "Tolnaftate"], "e": "Infections near the proximal nail fold involving spherical cells and pseudohyphae point to proximal subungual onychomycosis or candidal nail infection, for.", "src": "", "dz": "onyx", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "A 19-year-old male presented by recurrent itchy tense vesiculobullous lesions the right foot of 2 months duration, with no other similar lesions in the skin or mucous membranes elsewhere. Two web spaces in this foot had fine scaly annular itchy lesions of 3 months duration. Which of the following is the most appropriate management?", "c": "Oral terbinafine", "d": ["Potent topical steroids", "Systemic steroids", "Send for patch testing e. K permanganate soaks and topical antibiotics"], "e": "Fungal infection, systemic antifungal therapy with Oral terbinafine is the most appropriate management to eradicate the dermatophytes and then resolve both the web space scaling and the secondary inflammatory blistering.", "src": "", "dz": "tmp", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following conditions is characterized by the presence of sulfur cup shaped structure in the scalp of a child?", "c": "Favus", "d": ["Grey patch", "Black dot", "Kerion celsi"], "e": "Favus: sulfur-yellow cup-shaped crusts (scutula) of hyphae and spores around hair follicles.", "src": "", "dz": "favus", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 25-year-old athlete complains of itchy, scaling skin between their toes. The skin is macerated and fissured. What is the most likely diagnosis?", "c": "Interdigital tinea pedis", "d": ["Contact dermatitis", "Erythrasma", "Psoriasis"], "e": "Itchy, scaling, macerated, and fissured skin restricted to the toe webs is the classic presentation of interdigital tinea pedis.", "src": "", "dz": "tmp", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "In which of these fungal infections treatment with Griseofulvin may be used?", "c": "Tinea corporis", "d": ["Interdigital monilia", "Tinea versicolor", "Oral thrush"], "e": "Griseofulvin is an oral systemic antifungal specifically indicated for dermatophytosis of the skin, hair, and nails, but it is ineffective against yeasts like Candida or Malassezia.", "src": "", "dz": "tcorp", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 30-year-old woman presents with an itchy, red, circular rash on her arm. The rash has a raised, scaly border and a clear center. What is the most likely diagnosis?", "c": "Tinea corporis", "d": ["Eczema", "Psoriasis", "Contact dermatitis"], "e": "An annular, circular scaly rash with an active, raised peripheral border and central clearing is the key sign clinical presentation of tinea corporis.", "src": "", "dz": "tcorp", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 60-year-old man with diabetes presents with thickened, discolored toenails. The nails are brittle and easily crumble. What is the most likely diagnosis?", "c": "Onychomycosis", "d": ["Psoriasis", "Eczema", "Ingrown toenail"], "e": "Thickened, discolored, brittle, and crumbly toenails in a patient with diabetes point toward fungal nail infection (onychomycosis).", "src": "", "dz": "onyx", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A patient presents with asymptomatic macules and patches on the trunk. What is the likely diagnosis?", "c": "Tinea versicolor", "d": ["Psoriasis", "Vitiligo", "Seborrheic dermatitis"], "e": "Pityriasis versicolor usually presents as asymptomatic or mildly pruritic macules and patches with fine branny scales distributed over the trunk and upper chest.", "src": "", "dz": "pv", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which condition presents with swelling of the nail fold as the initial lesion?", "c": "Paronychia", "d": ["Onychomycosis", "Felon", "Herpetic whitlow"], "e": "Acute or chronic paronychia usually begins as painful inflammation, erythema, and swelling of the periungual nail fold.", "src": "", "dz": "onyx", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which condition is characterized by a cup-shaped crust with a mousy odor and a bluish- white fluorescence under Wood's light?", "c": "Favus", "d": ["Black dot ringworm", "Gray patch ringworm", "Kerion"], "e": "Favus: yellow cup-shaped crusts, mousy odor, dull blue-white Wood lamp fluorescence.", "src": "", "dz": "favus", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is a characteristic feature of Tinea circinata?", "c": "Single or multiple well-defined erythematous scaly patches with central hyperpigmentation", "d": ["Itchy, brownish-red lesions with minute scales and a well-defined margin", "Well-defined erythematous patches with central crusting and no active margin", "Lesions with a bluish-white fluorescence under Wood's light"], "e": "Hyperpigmentation (Option a): The characteristic lesion of tinea circinata is described as an annular (ring-shaped), plaque or patch.", "src": "", "dz": "tcorp", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following causative organisms is associated with Tinea cruris?", "c": "Epidermophyton floccosum", "d": ["Trichophyton tonsurans", "Candida albicans", "Microsporum canis"], "e": "Tinea cruris (jock itch) is often caused by dermatophytes such as Trichophyton rubrum, Trichophyton mentagrophytes, and Epidermophyton floccosum.", "src": "", "dz": "tcr", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the typical clinical presentation of Tinea cruris?", "c": "Itchy, brownish-red lesions with well-defined margins and active margins", "d": ["Pustular lesions with significant central crusting", "Single or multiple erythematous patches with central scarring", "Dry, scaly lesions with a bluish-white fluorescence"], "e": "Tinea cruris affects the groin and inner thighs, presenting as pruritic, serpiginous, erythematous-to-brownish plaques with sharp, raised, scaling active borders.", "src": "", "dz": "tcr", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 14 year old female patient presented with itchy scalp and enlarged cervical lymph nodes. On inspection of her hair, there were multiple minute whitish pin point structures firmly attached to the hair and pus glued the hair together. What is the most appropriate diagnosis?", "c": "Infected pediculosis", "d": ["Seborrheic dermatitis", "Follicular impetigo", "Kerion celsi"], "e": "Severe pediculosis capitis with secondary bacterial superinfection usually causes hair matting, purulent exudate, and reactive occipital/cervical lymphadenopathy.", "src": "", "dz": "ped", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the characteristic features of nits?", "c": "Firmly adherent to the hair shaft", "d": ["Difficult to see by the naked eye", "Its color change with the color of the hair", "Easily washed by hot water"], "e": "Nits are encapsulated structures cemented securely to the side of hair shafts via a chitinous substance, making them impossible to brush or wash off easily.", "src": "", "dz": "ped", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "What is the most common presentation of pediculosis (lice infestation)?", "c": "Pruritus (itching)", "d": ["Fever and malaise", "Skin ulceration", "Lymphadenopathy"], "e": "Severe localized pruritus is the chief and most common presenting symptom of pediculosis.", "src": "", "dz": "ped", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 2-year-old child presents with a pruritic rash that started on the scalp and spread to the trunk and extremities over the past few days following a prodrome of upper respiratory tract infection. The rash consists of macules, papules, and vesicles in different stages of development, with some lesions crusted over. The child is otherwise well, with no significant medical history. Which of the following is the primary mode of transmission of this condition ?", "c": "Airborne droplets", "d": ["Direct contact with lesions", "Ingestion of contaminated food or water", "Vector-borne (mosquitoes)"], "e": "Chickenpox spreads by respiratory droplets and airborne aerosols from the upper airway.", "src": "", "dz": "vmisc", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A50 year old male patient presented with acute painful vesicular eruption on the auricle of the right ear with tinnitus and car pain. What is most probable diagnosis in this case?", "c": "Ramsy Hunt syndrome", "d": ["Secondary herpes simplex", "Herpes sine herpete", "Chediak Higashi syndrome 208 ial"], "e": "Ramsay Hunt (zoster oticus): VZV reactivation in the geniculate ganglion. Vesicles on the auricle with ear pain and tinnitus.", "src": "", "dz": "vmisc", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is clinically described as pleomorphic?", "c": "Chicken pox", "d": ["Herpes zoster", "Molluscum contagiosum", "Kaposi varicelliform eruption"], "e": "Chickenpox lesions are pleomorphic: macules, papules, vesicles and crusts together, in crops.", "src": "", "dz": "vmisc", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "In a case of herpes zoster, Hutchinson sign indicates involvement of which of the following nerves?", "c": "Nasociliary nerve", "d": ["Facial nerve", "Ramsy-funt hutchinson", "Geniculate ganglion"], "e": "Hutchinson sign: vesicles on the tip or side of the nose in zoster ophthalmicus. Nasociliary branch of the ophthalmic nerve.", "src": "", "dz": "zos", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which type of cancer is most commonly associated with human papillomavirus (HPV)?", "c": "Cervical cancer", "d": ["Skin cancer", "Lung cancer", "Prostate cancer"], "e": "Persistent high-risk HPV is the main cause of cervical cancer.", "src": "", "dz": "warts", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "What is the recommended treatment for genital warts during pregnancy?", "c": "Cryotherapy", "d": ["Podophyllin", "Topical imiquimod", "Chemical treatment with TCA"], "e": "Genital warts in pregnancy: cryotherapy with liquid nitrogen or other physical destruction is safe.", "src": "", "dz": "warts", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Hutchinson's sign in herpes zoster ophthalmicus indicates the involvement of which structure?", "c": "Nasociliary branch of the trigeminal nerve", "d": ["External auditory canal", "Supra-orbital nerve", "Facial nerve"], "e": "Hutchinson sign = nasociliary branch involved. High risk of eye inflammation and keratitis.", "src": "", "dz": "zos", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Condylomata plana, or flat cervical warts, are most commonly associated with which HPV types?", "c": "HPV-16, HPV-18, and HPV-31", "d": ["HPV-6 and HPV-11", "HPV-45 and HPV-33", "HPV-6 and HPV-45"], "e": "Flat cervical lesions and high-grade neoplasia: high-risk HPV types 16, 18, 31.", "src": "", "dz": "warts", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following HPV types is most commonly associated with cervical cancer?", "c": "HPV-16", "d": ["HPV-6", "HPV-11", "HPV-42"], "e": "HPV-16 is the commonest high-risk type behind cervical and anogenital cancer.", "src": "", "dz": "warts", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Which treatment modality is commonly used for plantar warts?", "c": "Cryotherapy", "d": ["Podophyllin", "5-Fluorouracil", "Topical Imiquimod"], "e": "Painful plantar warts: liquid nitrogen cryotherapy is a standard treatment.", "src": "", "dz": "warts", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is the main cytokine in pathogenesis of acne?", "c": "Interleukin-| alpha (IL-1 alpha)", "d": ["Tumor necrosis factor alpha", "Transforming growth factor beta", "Interferon alpha"], "e": "IL-1 alpha starts comedogenesis and the inflammation in acne vulgaris.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the most common adverse effect of oral isotretinoin?", "c": "Skin and mucous membranes dryness", "d": ["Elevated liver transaminases", "Increase in serum triglyceride and/or cholesterol levels", "Myalgias"], "e": "Dryness of skin, lips and nose is the commonest side effect of oral isotretinoin.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A17 year old male patient presented with multiple black heads on the face. What is the optimal topical treatment?", "c": "Tretinoin", "d": ["Benzoyl peroxide", "Clindamycin", "Fusidic acid"], "e": "Comedonal acne: topical retinoid (tretinoin) is first line. It normalizes follicular keratinization.", "src": "", "dz": "acne", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the most appropriate topical medication
