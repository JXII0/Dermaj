<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Derma Theory MCQ</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#1f232c;--line:#2a2f3a;--tx:#e8eaf0;--mut:#9aa3b2;--ac:#7c9cff;--ok:#3ecf8e;--bad:#ff6b6b;--warn:#f5c451;--pu:#b388ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0f1115ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{max-width:860px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.top h1{font-size:18px;margin:0}.top small{color:var(--mut)}
nav{max-width:860px;margin:auto;display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto}
nav button{flex:0 0 auto;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#0b1020;border-color:var(--ac);font-weight:600}
main{max-width:860px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{margin:4px 0 10px;font-size:20px}h3{margin:14px 0 6px;font-size:16px;color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#0b1020;border-color:var(--ac);font-weight:600}
.btn{background:var(--ac);color:#0b1020;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.q{font-size:17px;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:16px;cursor:pointer}
.opt:hover{border-color:var(--ac)}.opt.ok{border-color:var(--ok);background:#14301f}.opt.bad{border-color:var(--bad);background:#34171a}.opt.dim{opacity:.6}
.exp{border-left:3px solid var(--pu);background:#1c1730;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:15px}
.src{color:var(--mut);font-size:12px;margin-top:6px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#26304f;color:var(--ac);margin-right:6px}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:24px;cursor:pointer;background:linear-gradient(160deg,#1b2140,#181b22)}
.core li{margin:6px 0}.hot{color:var(--warn);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}th{background:var(--card2)}
.timer{font-variant-numeric:tabular-nums;color:var(--warn);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
label{color:var(--mut);font-size:14px}select,input[type=number]{max-width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px}
.dz{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.dz b{font-size:17px}.dz small{color:var(--mut)}
.pill{display:inline-block;margin:3px 4px 3px 0;padding:5px 11px;border-radius:999px;font-size:13px;cursor:pointer;border:1px solid var(--line)}
.t-disease{background:#1c2b57;color:#a9c0ff;border-color:#3a55a0}.t-lookalike{background:#2a2a33;color:#cfd3dc}
.t-sign{background:#3a2a10;color:#ffd08a;border-color:#7a5a1c}.t-histology{background:#2b1c4a;color:#d0b6ff;border-color:#5b3fa0}
.t-treatment{background:#10321f;color:#9ff0c4;border-color:#1f7a4a}.t-trigger{background:#3a1519;color:#ffb0b0;border-color:#8a2f36}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.scroll table{min-width:900px}.scroll td:first-child,.scroll th:first-child{position:sticky;left:0;background:var(--card2);font-weight:600;min-width:90px}
.scroll th{position:sticky;top:0}.scroll td{min-width:150px}
svg text{fill:#e8eaf0;font-size:11px;pointer-events:none;paint-order:stroke;stroke:#12151b;stroke-width:3.5px;stroke-linejoin:round}svg .n{cursor:pointer}
.lk{margin-top:8px;font-size:14px;color:var(--mut)}.lk .pill{font-size:12px}
</style></head><body>

<script>
const Q=[{"t": "Clinical", "s": "A 40-year-old man has well-defined erythematous plaques with lamellar silvery scales on the lower back. Which is the most common form of this disease?", "c": "Plaque psoriasis", "d": ["Guttate psoriasis", "Inverse psoriasis", "Pustular psoriasis"], "e": "Plaque (vulgaris) psoriasis affects 80-90% of patients: well-demarcated erythematous plaques with silvery scale, symmetric and bilateral.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "Which finding is a diagnostic feature of psoriasis?", "c": "Dotted bleeding on scratching (Auspitz sign)", "d": ["Lesions limited to the flexures", "Scales with surface telangiectasia", "Honey-colored crusts"], "e": "Auspitz sign: bleeding after removing the scale, from superficial vessel enlargement and thinning of the suprapapillary plates.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "A 10-year-old healthy boy has acute onset of multiple small erythematous scaly papules on the trunk. What is the most probable predisposing factor?", "c": "Upper respiratory tract infection", "d": ["Exposure to hot humid environment", "Vigorous exercise", "High consumption of processed food"], "e": "This is guttate psoriasis (raindrop lesions), often preceded by streptococcal pharyngitis / URTI. Good prognosis.", "src": "", "dz": "psoriasis", "lk": ["pr"], "up": false, "pr": true}, {"t": "Clinical", "s": "A young female develops erythematous papules with scales after pharyngitis. Most likely diagnosis?", "c": "Guttate psoriasis", "d": ["Psoriasis vulgaris", "Seborrheic dermatitis", "Lichen planus"], "e": "Acute drop-like (raindrop, 1-10 mm) papules after strep pharyngitis = guttate psoriasis.", "src": "", "dz": "psoriasis", "lk": ["pr"], "up": false, "pr": true}, {"t": "Clinical", "s": "Which type of psoriasis involves erythematous plaques in the skin folds and often lacks scale?", "c": "Inverse (flexural) psoriasis", "d": ["Guttate psoriasis", "Palmoplantar psoriasis", "Erythrodermic psoriasis"], "e": "Axilla, groin, inframammary folds. Moisture removes the scale.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "A 35-year-old has high fever and bad general condition. The whole body is erythematous, studded with small pustules. Which is the best known trigger for this condition?", "c": "Withdrawal of systemic corticosteroids", "d": ["Streptococcal pharyngitis", "Topical calcipotriene", "Sun exposure"], "e": "Generalized pustular psoriasis (von Zumbusch): sterile neutrophilic pustules, often triggered by corticosteroid withdrawal.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "Which nail sign is the MOST SPECIFIC for nail psoriasis?", "c": "Oil drop sign", "d": ["Onycholysis", "Subungual hyperkeratosis", "Longitudinal ridging"], "e": "Oil drop = yellow-orange discoloration seen through the nail plate.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "A 45-year-old man has itchy erythematous lesions on the trunk, swollen painful interphalangeal joints and nail changes. Which nail change is more specific for this disease?", "c": "Oil drop sign", "d": ["Subungual hyperkeratosis", "Onycholysis", "Longitudinal ridging"], "e": "Psoriasis with psoriatic arthritis. Oil drop sign is the most specific nail sign.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "A 30-year-old woman has well-defined erythematous scaly plaques on both palms, with swelling at the metacarpophalangeal joints for one year. Diagnosis?", "c": "Palmoplantar psoriasis (with arthritis)", "d": ["Eczema herpeticum", "Contact dermatitis", "Chronic hand eczema"], "e": "Palmoplantar psoriasis can be plaque or pustular type; joint swelling points to psoriatic arthritis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "Geographic tongue is more commonly seen in which disease?", "c": "Psoriasis", "d": ["Lichen planus", "Pemphigus vulgaris", "Vitiligo"], "e": "Oral psoriasis can look like geographic tongue (red patches with raised yellow/white borders).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "Oral psoriasis is more common in which type?", "c": "Pustular psoriasis", "d": ["Plaque psoriasis", "Guttate psoriasis", "Inverse psoriasis"], "e": "Oral lesions are more common in severe forms such as pustular psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "Psoriatic arthritis most commonly starts at which age?", "c": "30-50 years", "d": ["10-20 years", "20-30 years", "50-70 years"], "e": "Can occur at any age, but most common at 30-50.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "What percentage of psoriasis patients typically have a first-degree relative with the disease?", "c": "About 30% (about 1/3)", "d": ["About 10%", "About 50%", "About 80%"], "e": "Strong genetic component. Onset has two peaks: 20-30 and 50-60 years.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Pathology", "s": "Which histological finding is typically associated with psoriasis?", "c": "Parakeratosis", "d": ["Ballooning degeneration", "Spongiosis", "Granulomatous inflammation"], "e": "Parakeratosis (retained nuclei in the stratum corneum) is typical.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Pathology", "s": "In psoriasis, retention of nuclei in the stratum corneum is called:", "c": "Parakeratosis", "d": ["Hyperkeratosis", "Acanthosis", "Spongiosis"], "e": "Rapid turnover prevents nuclei loss: parakeratosis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Pathology", "s": "Which epidermal layer is absent in psoriatic lesions?", "c": "Stratum granulosum", "d": ["Stratum corneum", "Stratum spinosum", "Stratum basale"], "e": "Psoriasis: parakeratosis + absent granular layer + acanthosis.", "src": "", "dz": "psoriasis", "lk": ["lp"], "up": false, "pr": true}, {"t": "Treatment", "s": "What is the most appropriate topical treatment for a localized dusky red plaque with silvery scales covering less than 5% BSA?", "c": "High-potency topical corticosteroid", "d": ["Retinoid alone", "Coal tar alone", "Systemic methotrexate"], "e": "First line: high-potency topical steroid, alone or in rotation with calcipotriene (vitamin D analogue).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "The most frequent side effect of topical calcipotriene is:", "c": "Skin irritation", "d": ["Skin atrophy", "Hypopigmentation", "Striae"], "e": "Calcipotriene (vitamin D analogue): irritation, photosensitivity, but no contraindication with UVB.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "A 30-year-old psoriatic woman is 24 weeks pregnant, poorly controlled on topicals, 50% BSA. Best choice?", "c": "Narrow-band UVB phototherapy", "d": ["Methotrexate", "Systemic steroids", "Acitretin"], "e": "Methotrexate is teratogenic: phototherapy is the best option in pregnancy.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "Safest treatment option for chronic generalized psoriasis?", "c": "Narrow-band UVB", "d": ["Systemic steroids", "Oral methotrexate", "PUVA"], "e": "NB-UVB is safe and effective. Systemic steroids should never be used.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "A 40-year-old woman has elbow plaques, finger pain and stiffness with edema, and nail pitting. Which treatment fits?", "c": "Systemic methotrexate", "d": ["NB-UVB", "Systemic PUVA", "Topical steroid only"], "e": "Plaque psoriasis with psoriatic arthritis and nail disease: methotrexate treats both skin and joints.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Treatment", "s": "Which of these drugs can exacerbate psoriasis?", "c": "Propranolol", "d": ["Omalizumab", "Azithromycin", "Paracetamol"], "e": "Worsen psoriasis: beta blockers, ACE inhibitors, lithium, aspirin/NSAIDs, antimalarials, interferons, sulfa drugs, systemic steroid withdrawal.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "What is the primary lesion of lichen planus?", "c": "Flat-topped violaceous polygonal papule with fine white lines", "d": ["Vesicle on an erythematous base", "Nummular plaque with scaling", "Target lesion"], "e": "Small, polygonal, violaceous, flat-topped, shiny papule. Wickham striae are the fine white network on top.", "src": "", "dz": "lp", "lk": ["psoriasis", "pr"], "up": false, "pr": true}, {"t": "Clinical", "s": "Which feature is distinctive in the papules of lichen planus?", "c": "Wickham striae", "d": ["Telangiectasia", "Pustules", "Bullae"], "e": "Wickham striae are from focal hypergranulosis.", "src": "", "dz": "lp", "lk": [], "up": false, "pr": true}, {"t": "Pathology", "s": "What causes post-inflammatory hyperpigmentation in lichen planus?", "c": "Melanin pigmentary incontinence in the upper dermis", "d": ["Increased melanocyte number", "Dermal fibrosis", "Hemosiderin deposition"], "e": "Basal layer vacuolation lets melanin leak into the upper dermis, where macrophages take it up.", "src": "", "dz": "lp", "lk": [], "up": false, "pr": true}, {"t": "Clinical", "s": "Which history is important to ask about in a patient with widespread severely itchy flat-topped papules?", "c": "Hepatitis C virus infection", "d": ["Contact with infected animals", "Family history of psoriasis", "Recent streptococcal sore throat"], "e": "LP is linked to HCV, and to drugs: ACE inhibitors, thiazides, antimalarials; vaccines (influenza).", "src": "", "dz": "lp", "lk": ["psoriasis"], "up": false, "pr": true}, {"t": "Treatment", "s": "A hypertensive woman has asymptomatic linear white streaks on the buccal mucosa. Which antihypertensive class is better avoided?", "c": "ACE inhibitors", "d": ["Calcium channel blockers", "Alpha blockers", "Alpha-2 agonists"], "e": "ACE inhibitors, thiazides and antimalarials can trigger lichenoid reactions. (ACE inhibitors also worsen psoriasis.).", "src": "", "dz": "lp", "lk": ["psoriasis"], "up": false, "pr": true}, {"t": "Clinical", "s": "A 22-year-old has a single oval salmon-pink patch on the trunk with a collarette of scale. One to two weeks later, many smaller oval lesions appear along the skin cleavage lines (Christmas tree). Diagnosis?", "c": "Pityriasis rosea", "d": ["Tinea corporis", "Guttate psoriasis", "Secondary syphilis"], "e": "Herald patch (80%), then exanthem after 1-2 weeks with marginal collarettes.", "src": "", "dz": "pr", "lk": ["psoriasis", "syph2"], "up": true, "pr": true}, {"t": "Clinical", "s": "A young man has hypopigmented, finely scaly macules on the upper trunk. Wood's lamp shows yellowish fluorescence. Diagnosis?", "c": "Tinea (pityriasis) versicolor", "d": ["Vitiligo", "Pityriasis alba", "Tinea corporis"], "e": "Malassezia yeast. Fine scaly macules (hypo or hyperpigmented) on the upper trunk, worse in summer; yellow fluorescence.", "src": "", "dz": "pv", "lk": ["pr", "sd"], "up": true, "pr": true}, {"t": "Clinical", "s": "Brownish scaly patches on the chest and back appearing after the summer, with yellow Wood's lamp fluorescence. Diagnosis?", "c": "Tinea versicolor", "d": ["Erythrasma", "Seborrheic dermatitis", "Pityriasis rosea"], "e": "Erythrasma gives coral-red fluorescence. Seborrheic dermatitis is greasy scales in seborrheic areas.", "src": "", "dz": "pv", "lk": ["sd", "pr"], "up": true, "pr": true}, {"t": "Clinical", "s": "Which scale is typical of seborrheic dermatitis?", "c": "Greasy yellow-orange scale in sebaceous areas", "d": ["Silvery lamellar scale on extensor surfaces", "Honey-colored crusts", "White dry scale with Wickham striae"], "e": "Face, scalp, presternal area and body folds. Malassezia may play a role.", "src": "", "dz": "sd", "lk": ["psoriasis", "lp"], "up": true, "pr": false}, {"t": "Clinical", "s": "Seborrheic dermatitis is more frequent in which patients?", "c": "Parkinson disease and HIV/immunosuppressed", "d": ["Rheumatoid arthritis", "Hypothyroidism only", "Iron deficiency"], "e": "Also infants (cradle cap, Leiner disease).", "src": "", "dz": "sd", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "Effective shampoo for adult seborrheic dermatitis of the scalp?", "c": "2% ketoconazole", "d": ["Isotretinoin lotion", "Calcipotriene solution", "Permethrin"], "e": "Also selenium sulfide, zinc pyrithione, tar; low-potency steroid or pimecrolimus for more severe cases.", "src": "", "dz": "sd", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 3-month-old male shows a dirty neck appearance and scales which are attached at the center and free at the periphery. The most appropriate diagnosis is:", "c": "X-linked ichthyosis", "d": ["Ichthyosis vulgaris", "Lamellar ichthyosis", "None of the above"], "e": "Large dark scales on the sides of the neck from the first months in a male.", "src": "", "dz": "xli", "lk": ["iv", "lam"], "up": true, "pr": false}, {"t": "Clinical", "s": "One of the features of xeroderma pigmentosum is:", "c": "Early onset photosensitivity", "d": ["Appearance of freckles at adolescence", "Skin cancer after age 50", "Autosomal dominant inheritance"], "e": "AR disease. Photosensitivity and freckles start in infancy, cancers before age 20.", "src": "", "dz": "xp", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "In ichthyosis vulgaris, the histology shows:", "c": "Diminished granular layer", "d": ["Increased granular layer", "Acantholysis", "Munro microabscesses"], "e": "Compact orthokeratosis with a thin granular layer. Lamellar ichthyosis has a normal granular layer.", "src": "", "dz": "iv", "lk": ["lam", "psoriasis"], "up": true, "pr": fals }, {"t": "Clinical", "s": "A 35-year-old woman has a vulvar lesion (painless indurated nodule), occasional headaches and memory loss, unprotected sex with multiple partners, a diastolic murmur and aortic arch calcification on X-ray, positive VDRL, mild pleocytosis in CSF with positive CSF VDRL, negative HIV. Which best describes the vulvar lesion?", "c": "Gumma", "d": ["A chancre", "Condylomata acuminata", "Condylomata lata", "Granuloma inguinale"], "e": "Tertiary syphilis (aortitis, neurosyphilis) with a gumma. CHECK: not confirmed.", "src": "", "dz": "syp3", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A woman who is an intravenous drug abuser and sex worker for 20 years now has aortitis. She has no mucosal ulcerations or exanthems. Her VDRL is negative and FTA-ABS is positive. Most likely diagnosis?", "c": "Tertiary syphilis", "d": ["Early primary syphilis", "Lyme disease", "Secondary syphilis"], "e": "Cardiovascular syphilis. Non-treponemal tests can turn negative in late disease. FTA-ABS stays positive.", "src": "", "dz": "syp3", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "In primary syphilis, lymphadenopathy is:", "c": "Regional, painless, mobile, firm", "d": ["Generalized, painless, mobile, hard", "Regional, painful, mobile, firm"], "e": "CHECK: not confirmed.", "src": "", "dz": "syp1", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is true about syphilis?", "c": "Once FTA-Abs are positive it will always be positive", "d": ["Infectious in tertiary stage", "Non-treponemal tests are highly specific"], "e": "FTA-ABS stays positive for life. CHECK: not confirmed.", "src": "", "dz": "sypt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the definition of erythroderma?", "c": "Erythema and scaling involving >90% of the skin surface", "d": ["Erythema and scaling involving >50% of the skin surface", "Diffuse redness of the skin without scaling", "An isolated rash affecting the face and upper limbs"], "e": "More than 90% of body surface (some books say 90%).", "src": "", "dz": "ery", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is the most common cause of erythroderma?", "c": "Generalization of pre-existing dermatoses", "d": ["Drug reaction", "Infection", "Lymphoma", "Autoimmune vasculitis"], "e": "Psoriasis, eczema, then drugs.", "src": "", "dz": "ery", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following best explains heart failure in erythroderma?", "c": "Increased blood flow through the skin and excessive fluid loss", "d": ["Direct myocardial toxicity", "Drug-induced cardiomyopathy", "Secondary bacterial endocarditis"], "e": "High-output heart failure from skin vasodilation.", "src": "", "dz": "ery", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 19-year-old female has fever, rash and joint pain after unprotected sex, pustular skin lesions on the extremities, tenosynovitis, and blood cultures positive for Neisseria gonorrhoeae. Most likely diagnosis?", "c": "Disseminated gonococcal infection", "d": ["Secondary syphilis", "Lyme disease", "Rheumatoid arthritis"], "e": "Arthritis-dermatitis syndrome: tenosynovitis, pustules, polyarthralgia. CHECK: not confirmed.", "src": "", "dz": "gon", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is a cause of physiologic urethral discharge in a male?", "c": "Prostatorrhea", "d": ["Urethral stone", "Foley catheter", "Instrumentation"], "e": "Prostatorrhea: prostatic discharge, e.g. after straining or defecation.", "src": "", "dz": "gon", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Physiological cause of male urethral discharge:", "c": "Spermatorrhea", "d": ["Semen", "Catheterization", "Urinary stone"], "e": "", "src": "", "dz": "gon", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 21-year-old female has fever, rash and joint pain with blood cultures positive for Neisseria gonorrhoeae. Most likely route of infection?", "c": "Hematogenous spread", "d": ["Direct inoculation", "Respiratory droplets", "Fecal-oral transmission"], "e": "Disseminated gonococcemia.", "src": "", "dz": "gon", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A plaque is a:", "c": "Patch of abnormal change of skin texture", "d": ["Area of depigmentation", "The primary lesion of acne vulgaris", "Localized epidermal collection of fluid", "Deroofed burrow"], "e": "Plaque: raised flat-topped lesion over 1 cm (texture change). Patch: flat color change.", "src": "", "dz": "les", "lk": [], "up": true, "pr": false}, {"t": "Pathology", "s": "The skin appendages include all of the following EXCEPT:", "c": "Melanocytes", "d": ["Sebaceous glands", "Eccrine sweat glands", "Apocrine sweat glands", "Hair follicles"], "e": "Appendages are glands, hair, nails. Melanocytes are epidermal cells.", "src": "", "dz": "skin", "lk": [], "up": true, "pr": false}, {"t": "Pathology", "s": "Reticular layer is rich in:", "c": "Hair follicles", "d": ["Granular cells", "Keratin", "Melanocytes"], "e": "Reticular dermis has hair follicles, glands and coarse collagen.", "src": "", "dz": "skin", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "Ingredient placed in gel is:", "c": "Methyl cellulose", "d": ["Powder and water", "Oil and water", "Potassium permanganate"], "e": "Gel = semisolid with methyl cellulose. Good for hairy areas.", "src": "", "dz": "dx", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Green color in Wood light can indicate presence of:", "c": "Taenia capitis", "d": ["Taenia versicolor", "Erythrasma", "Favus"], "e": "Microsporum tinea capitis glows green. Favus is pale green-blue (but the answer here is tinea capitis).", "src": "", "dz": "dx", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "Skin functions are all EXCEPT:", "c": "Excretion", "d": ["Synthesis of vitamin E", "Absorption", "Temperature regulation"], "e": "CHECK: ambiguous. Skin does excrete (sweat). The quiz writes 'vitamin E' (it is vitamin D), and most picked it, but the answer given is excretion.", "src": "", "dz": "skin", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "The difference between cyst and bulla is in:", "c": "Epithelial lining", "d": ["Size", "Content", "None of the above"], "e": "A cyst has an epithelial lining.", "src": "", "dz": "les", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Wood's light of PVC (pityriasis versicolor) is:", "c": "Yellow", "d": ["Green", "White", "Red"], "e": "Pityriasis versicolor: yellow-gold fluorescence. CHECK: 'PVC' read as pityriasis versicolor.", "src": "", "dz": "pv", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Coral red color in Wood light can indicate presence of:", "c": "Erythrasma", "d": ["Taenia capitis", "Taenia versicolor", "Favus"], "e": "Erythrasma: Corynebacterium minutissimum porphyrins.", "src": "", "dz": "dx", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Sarah, a 24-year-old female, has a two-week rash beginning with a prominent patch on her chest, then multiple smaller oval patches on her back and abdomen. The patch has 3 concentric zones: central cafe au lait, peripheral erythematous, intermediate collarette scale. Most probable diagnosis?", "c": "Pityriasis rosea", "d": ["Guttate psoriasis", "Tinea corporis", "Erythema multiforme"], "e": "Herald patch, then a secondary eruption with collarette scale.", "src": "", "dz": "pr", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A10-year-old healthy boy presented with acute onset of multiple, small sized, erythematous scaly papules scattered on the trunk. According to your provisional diagnosis, what is the most probable predisposing factor for development of his condition?", "c": "Upper respiratory tract infection", "d": ["Exposure to hot humid environment for long time", "Vigorous exercise", "High consumption of processed food"], "e": "Guttate psoriasis: small papules on the trunk in a child or young adult, usually after group A strep URTI or pharyngitis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A 35-year-old patient presented with a high fever and bad general condition. On examination, the whole body is erythematous, studded with small pustules. Which of the following drugs is most suitable for treatment?", "c": "Methotrexate", "d": ["Low dose systemic corticosteroid", "Azathioprine", "Adalimumab"], "e": "Generalized pustular psoriasis. First line systemic: methotrexate, cyclosporine, acitretin or infliximab. No systemic steroids, withdrawal flares it.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A40 year old female patient presented with two localized dusky red erythematous plaques covered with silvery white lamellar scales over both elbows, along with pain and stiffness of her fingers accompanied with edema and nail pitting in many of her finger nails. What treatment would be appropriate for this patient?", "c": "Systemic methotrexate.", "d": ["NB-UVB.", "Systemic PUVA", "Systemic acitretin."], "e": "Plaque psoriasis with psoriatic arthritis (painful stiff joints, dactylitis) and nail changes. Methotrexate treats skin and joints.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the characteristic dermoscopic feature of psoriasis?", "c": "Regularly arranged dotted vessels", "d": ["Whitish structureless areas.", "Yellow dots.", "Thick arborizing vessels."], "e": "Dermoscopy of psoriasis: light red background, regular dotted vessels, white scales.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "What is the most appropriate topical treatment for localized dusky red plaque with silvery white scales affecting less than 5 percent body surface area?", "c": "corticosteroid", "d": ["calciptriol", "coal tar", "retenoid"], "e": "Potent topical steroid (often with calcipotriene) is first line for localized plaques under 5% BSA.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45-year-old male patient presented with well-defined intense erythematous itchy lesions scattered on the trunk. On examination the interphalangeal joints were swollen and painful. Nail changes were present. Which nail change is more specific for this disease?", "c": "Oil drop sign", "d": ["Subungual hyperkeratosis", "Onycholysis", "Longitudinal ridging"], "e": "Subungual hyperkeratosis and onycholysis occur in many nail diseases. Oil drop (salmon patch) is the specific one for psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 30-year-old female patient presented with well-defined erythematous scaly plaques on the palms of both hands, associated with swelling at the metacarpophalangeal joints for a duration of one year. What is the most likely diagnosis?", "c": "Palmoplantar psoriasis", "d": ["Eczema herpeticum", "Contact dermatitis", "Chronic Eczema"], "e": "Well-demarcated red scaly plaques on the palms plus painful swollen MCP joints = palmoplantar psoriasis with arthritis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A 30-year-old psoriatic woman is 24 weeks pregnant. Her psoriasis is poorly controlled ontopical medications and progressed to involve 50% of the body surface area. Her pregnancy isstable, and fetal wellbeing parameters are reassuring. Which of the following would you choosefor her management?", "c": "Narrow-band UVB phototherapy", "d": ["Methotrexate", "Systemic steroids", "Biologies"], "e": "Pregnancy: NB-UVB is the safest second line when topicals fail. Methotrexate is teratogenic (category X).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Geographical tongue is more commonly seen in which of these skin diseases?", "c": "Psoriasis", "d": ["2ry stage syphilis bald", "Lichen planus", "Recurrent oral herpes"], "e": "Geographic tongue has the same histology as psoriasis and is more common in psoriatics.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Which of these drugs are known to exacerbate psoriasis?", "c": "Propranolol", "d": ["Omalizumab", "Azithromycin", "ACE inhibitors"], "e": "Drugs that trigger or worsen psoriasis: beta blockers (propranolol), lithium, antimalarials, NSAIDs, ACE inhibitors.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "Which of the following is the safest treatment option for chronic generalized psoriasis?", "c": "Narrowband UVB", "d": ["Systemic steroids", "Oral methotrexate", "PUVA therapy"], "e": "NB-UVB has a low long-term risk. Safer than oral immunosuppressants or PUVA (higher cancer risk).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A patient develops small papular skin lesions with central scales following a respiratory tract infection. What is the likely diagnosis?", "c": "Guttate psoriasis", "d": ["Psoriasis vulgaris", "Seborrheic dermatitis", "Lichen planus"], "e": "Small drop-like papules appearing suddenly after strep pharyngitis or a chest infection = guttate psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A young female developed erythematous papules with scales following pharyngitis. What is the most likely diagnosis?", "c": "Guttate psoriasis", "d": ["Psoriasis vulgaris", "Seborrheic dermatitis", "Lichen planus"], "e": "Guttate psoriasis follows strep pharyngitis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is a diagnostic feature of psoriasis?", "c": "Dotted bleeding on scratching", "d": ["Lesions limited to flexures", "Scales with surface telangiectasia", "Honey-colored crusts"], "e": "Auspitz sign: pinpoint bleeding when the scale is scraped off. Thin suprapapillary plates over long dermal papillae.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What percentage of psoriasis patients typically have a first-degree relative with the disease?", "c": "30%", "d": ["10%", "20%", "50%"], "e": "About 30% of psoriatics have a first-degree relative with psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which type of psoriasis is characterized by well-demarcated erythematous plaques with overlying silvery scales?", "c": "Plaque psoriasis", "d": ["Inverse psoriasis", "Guttate psoriasis", "Pustular psoriasis"], "e": "Plaque psoriasis (vulgaris) is the commonest type: sharp red plaques with silvery scales.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which psoriasis type is often triggered by corticosteroid withdrawal and can be life- threatening when generalized?", "c": "Pustular psoriasis", "d": ["Plaque psoriasis", "Inverse psoriasis", "Nail psoriasis"], "e": "Stopping systemic steroids suddenly can cause generalized pustular psoriasis. Emergency: high fever and toxicity.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What feature is characteristic of nail psoriasis?", "c": "Pitting and oil drop sign", "d": ["Large pustules", "Silver scaling", "Generalized erythema"], "e": "Nail pitting (nail matrix) and oil drop or salmon patch (nail bed) are the main nail signs of psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which type of psoriasis involves erythematous plaques located in the skin folds?", "c": "Inverse psoriasis", "d": ["Guttate psoriasis", "Palmoplantar psoriasis", "Erythrodermic psoriasis"], "e": "Inverse (flexural) psoriasis: axillae, groin, inframammary folds. Smooth red plaques with little scale because of moisture.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Psoriatic arthritis is most commonly seen between which ages?", "c": "30-50 years", "d": ["10-20 years", "20-30 years", "50-70 years"], "e": "Psoriatic arthritis can start at any age but peaks at 30-50 years.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Oral psoriasis is more commonly seen in which type of psoriasis?", "c": "Pustular psoriasis", "d": ["Plaque psoriasis", "Guttate psoriasis", "Inverse psoriasis"], "e": "Oral lesions (geographic tongue, pustules) are much commoner in severe forms: pustular and erythrodermic psoriasis.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "In psoriasis, which of the following is commonly observed in the stratum corneum?", "c": "Parakeratosis", "d": ["Hyperkeratosis", "Acanthosis", "Erosion"], "e": "Parakeratosis (nuclei kept in the stratum corneum) from fast epidermal turnover.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which histopathological feature is absent in psoriatic lesions?", "c": "Stratum granulosum", "d": ["Stratum corneum", "Stratum basale", "Stratum lucidum"], "e": "Psoriasis: the granular layer is thin or absent (hypogranulosis).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What dermoscopic feature is characteristic of psoriasis?", "c": "Whitish areas with scales and dotted blood vessels underneath", "d": ["Yellowish discoloration with no visible blood vessels", "Blister formation with a clear fluid", "Red patches with no underlying vascular changes"], "e": "Dermoscopy: white scales and evenly spread dotted vessels on a red background.", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is a side effect associated with calcipotriene used for psoriasis?", "c": "Skin irritation", "d": ["Photosensitivity", "Staining of clothes", "Acne"], "e": "Local irritation and burning is the commonest side effect of calcipotriene (vitamin D3 analogue).", "src": "", "dz": "psoriasis", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A25 year-old male patient presented with severely itchy, flat topped shiny papules scattered allover the body of 3 weeks duration. which history data is important to-ask about it in this patient ?", "c": "Hepatitis C virus infection", "d": ["Personal contact with infected animals", "Family history of a similar condition", "History of prolonged exposure to sunlight"], "e": "Lichen planus is linked to hepatitis C. Screen for HCV in widespread or mucosal LP.", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45 year old female presented with a symptomatic linear white streaks on the buccal mucosa, the patient is hypertensive. What class of antihypertensive better to be avoided in this patient?", "c": "Angiotens in converting enzyme inhibitors", "d": ["Calcium channel blockers", "alpha2-receptor agonists", "Alpha blockers"], "e": "ACE inhibitors, beta blockers and thiazides can trigger lichenoid drug eruptions and oral lichenoid reactions.", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the initial lesion of lichen planus?", "c": "Flat-topped violaceous papule with white lines", "d": ["Vesicle on erythematous base", "Nummular plaque with scaling", "Target lesion"], "e": "Lichen planus lesion: flat-topped, polygonal, violet, itchy papule with fine white lines (Wickham striae).", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is a distinctive feature seen in the papules of Lichen Planus?", "c": "Wickham striae", "d": ["Telangiectasia", "Pustules", "Bullae"], "e": "Wickham striae: fine white lines or network on LP papules and oral lesions. Pathognomonic.", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the cause of post-inflammatory hyperpigmentation in Lichen Planus?", "c": "Melanin pigmentary incontinence in the upper dermis", "d": ["Increased melanin production in the epidermis", "Increased blood vessel density", "Accumulation of keratin in the epidermis"], "e": "Basal layer vacuolation and apoptotic keratinocytes let melanin drop into the upper dermis, where macrophages take it up (melanophages).", "src": "", "dz": "lp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 38-year-old male presented with a truncal rash of recent onset. It began with a single erythematous patch, 20 x 40 mm in size, on the abdomen, with central clearing and peripheral scaling. Two weeks later, multiple smaller reddish plaques and papules appeared symmetrically over the trunk. He did not respond to topical miconazole. What is the most likely diagnosis?", "c": "Pityriasis rosea", "d": ["Plaque psoriasis vulgaris", "Tinea corporis", "Pityriasis rubra pilaris"], "e": "Single herald patch (2-4 cm, central clearing, peripheral scale), then a generalized symmetric eruption 1-2 weeks later that does not respond to antifungals = pityriasis rosea.", "src": "", "dz": "pr", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is a major criterion of atopic dermatitis diagnosis?", "c": "Chronic relapsing course.", "d": ["Pityriasis alba", "Prurigo nodularis", "Dennie morgan sign"], "e": "Hanifin and Rajka major criteria for AD: pruritus, typical morphology and distribution, chronic relapsing course, personal or family atopy. The other options are minor.", "src": "", "dz": "eczema", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A60 years old male patient presenting with dry, scaly erythematous skin of the lower lim and exaggerated skin markings, with increasing severity in the winter time. He was taking diuretics and lipid lowering agents. What is your diagnosis?", "c": "Asteatotic eczema.", "d": ["Atopic dermatitis", "Irritant contact dermatitis", "Discoid eczema"], "e": "Asteatotic eczema (eczema craquelé): elderly, winter, dry cracked scaly shins. Worse with diuretics, lipid-lowering drugs, low humidity, frequent bathing.", "src": "", "dz": "eczema", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "An 85-year-old patient presents with dry, itchy, and cracked skin in the winter. What is the most likely diagnosis?", "c": "Asteatotic eczema", "d": ["Lichen simplex chronicus", "Psoriasis", "Contact dermatitis"], "e": "Asteatotic eczema (eczema craquelé): elderly people in cold dry winter.", "src": "", "dz": "eczema", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is a hallmark symptom of atopic dermatitis (AD)?", "c": "Pruritus", "d": ["Ulceration", "Hypopigmentation", "Vesicle formation"], "e": "Itch is the main symptom of AD and a must for diagnosis (the itch that rashes).", "src": "", "dz": "eczema", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is considered a major criterion for the diagnosis of atopic dermatitis according to Hanifin and Rajka's criteria?", "c": "Pruritus", "d": ["Periorbital pigmentation", "Cheilitis", "Pityriasis alba"], "e": "Pruritus is one of the 4 major Hanifin and Rajka criteria. The others listed are minor.", "src": "", "dz": "eczema", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the most common cause of chronic urticaria?", "c": "Idiopathic", "d": ["Food allergy", "Hidden malignancy", "Chronic infections"], "e": "Chronic spontaneous urticaria is mostly idiopathic (50-80% have no trigger). Many have an autoimmune basis.", "src": "", "dz": "urt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the most common cause of acute urticaria?", "c": "Infections", "d": ["Drug sensitivity", "Autoimmune", "Food allergy"], "e": "Infections, mainly viral URTI, are the commonest cause of acute urticaria.", "src": "", "dz": "urt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "What is the most common cause of acute urticaria?", "c": "Idiopathic causes", "d": ["Physical stimuli like heat or cold", "Bacterial infections", "Penicillin and cephalosporin allergy"], "e": "Viral infection is the commonest identified trigger, but many acute cases stay idiopathic.", "src": "", "dz": "urt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which disease is characterized by subcorneal intragranular bullae?", "c": "Bullous impetigo", "d": ["Dermatitis herpetiform", "Pemphigus vulgaris", "Steven Johnson syndrome"], "e": "Staph aureus exfoliative toxin cuts desmoglein 1 in the upper granular layer: superficial subcorneal split.", "src": "", "dz": "pem", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "A 35-year-old male presented by severe itching in the back, arms and knees of several months duration which did not respond to antiscabitics. Examination revealed few intact vesicleswith excoriations and erosions in the same distribution. Immunofluorescence showed granularlgA deposits at dermo-epidermal junction. What is the most likely diagnosis for this case?", "c": "Dermatitis herpetiformis", "d": ["Pemphigus vulgaris", "Pemphigus foliaceous", "Bullous impetigo"], "e": "Symmetric extensor lesions, severe itch, no response to scabicides and granular IgA on DIF = dermatitis herpetiformis.", "src": "", "dz": "dh", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 40-year-old man with a history of celiac disease presents with itchy, grouped vesicles on his elbows and knees. What is the most likely diagnosis?", "c": "Dermatitis herpetiformis", "d": ["Bullous pemphigoid", "Psoriasis", "Erythema multiforme"], "e": "Dermatitis herpetiformis goes with celiac disease: grouped, very itchy lesions on elbows and knees.", "src": "", "dz": "dh", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 50-year-old woman presents with painful oral erosions and flaccid blisters on her skin. The blisters easily rupture, leaving raw areas. What is the most likely diagnosis?", "c": "Pemphigus vulgaris", "d": ["Bullous pemphigoid", "Stevens-Johnson syndrome", "Contact dermatitis"], "e": "Flaccid blisters, positive Nikolsky and painful mucosal lesions = pemphigus vulgaris.", "src": "", "dz": "pem", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "What is the treatment of choice for dermatitis herpetiformis based on histopathology?", "c": "Dapsone", "d": ["Acyclovir", "Methotrexate", "Topical steroids"], "e": "Dapsone blocks neutrophil recruitment and function. Fast and the treatment of choice.", "src": "", "dz": "dh", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "In which blistering disorder does subepidermal separation occur, leading to tense bullae?", "c": "Bullous pemphigoid", "d": ["Pemphigus vulgaris", "Dermatitis herpetiformis", "Epidermolysis bullosa"], "e": "Antibodies against BP180 and BP230 give a deep subepidermal split with tense bullae that do not burst easily.", "src": "", "dz": "bp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "The Nikolsky sign is associated with which of the following conditions?", "c": "Pemphigus vulgaris", "d": ["Bullous pemphigoid", "Epidermolysis bullosa", "Dermatitis herpetiformis"], "e": "Nikolsky positive (normal epidermis slides off with sideways pressure): intraepidermal split of pemphigus vulgaris, also TEN.", "src": "", "dz": "pem", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Pemphigus foliaceus is characterized by which type of blistering?", "c": "Subcorneal intragranular acantholysis", "d": ["Suprabasal acantholysis", "Subepidermal separation", "Spongiotic vesicles"], "e": "Anti-Dsg1 antibodies split the epidermis high up, subcorneal and intragranular.", "src": "", "dz": "pf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Toxic Epidermal Necrolysis (TEN) is most commonly caused by which of the following?", "c": "Drug reactions", "d": ["Viral infections", "Autoimmune conditions", "Bacterial infections"], "e": "Over 80% of TEN is drug induced: allopurinol, antiepileptics, sulfonamides, NSAIDs.", "src": "", "dz": "bmisc", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following correctly describes the pathological findings in Toxic Epidermal Necrolysis (TEN)?", "c": "Subepidermal separation with pan-epidermal necrosis", "d": ["Subcorneal blister formation with neutrophil infiltration", "Intracellular edema with ballooning degeneration", "Intraepidermal separation between keratinocytes"], "e": "Widespread apoptosis gives full-thickness epidermal necrosis and a subepidermal split.", "src": "", "dz": "bmisc", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "What is the role of intravenous immunoglobulin (IVIG) in the management of Toxic Epidermal Necrolysis (TEN)?", "c": "IVIG has an anti-apoptotic effect and is best given early", "d": ["IVIG is used to treat secondary infections", "IVIG helps reduce itching and inflammation", "IVIG is only used in cases of bacterial infection"], "e": "IVIG has anti-Fas antibodies that block keratinocyte apoptosis. Best early in the acute phase.", "src": "", "dz": "bmisc", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "A 2-year-old child is brought to the dermatologist by his parents due to persistent dry, scaly skin since birth. The parents describe the skin as thickened and plate-like, with large, dark scales, particularly noticeable on the trunk and extremities. The child's skin appears tight and shiny, and there is some ectropion (outward turning of the eyelids). The parents report that they have tried various moisturizing creams, but the condition persists. There is no family history of similar skin conditions. What is the most likely diagnosis ?", "c": "Lamellar ichthyosis", "d": ["Atopic dermatitis", "Psoriasis", "Seborrheic dermatitis"], "e": "Present at birth, plate-like dark scales, ectropion, no response to moisturizers, negative family history (AR) = lamellar ichthyosis.", "src": "", "dz": "lam", "lk": [], "up": true, "pr": false}, {"t": "Treatment", "s": "What is the mainstay of treatment for lamellar ichthyosis ?", "c": "Oral retinoids", "d": ["Systemic corticosteroids", "Antifungal creams", "Immunosuppressive agents"], "e": "Emollients only help symptoms. Oral retinoids (acitretin) are the main systemic treatment for severe lamellar ichthyosis.", "src": "", "dz": "lam", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which disease is characterized by the separation of skin layers at the lamina lucida?", "c": "Junctional epidermolysis bullosa", "d": ["Epidermolysis bullosa simplex", "Dystrophic epidermolysis bullosa", "Bullous pemphigoid RT"], "e": "Junctional EB: split inside the basement membrane at the lamina lucida.", "src": "", "dz": "eb", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "At what age do patients with Xeroderma Pigmentosum commonly develop skin cancer?", "c": "Before age 10", "d": ["During adolescence", "In their 20s", "In their 30s"], "e": "Without UV protection, xeroderma pigmentosum children get skin cancer at a median age of 8-9 years, often before 10.", "src": "", "dz": "xp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is a characteristic feature of xeroderma pigmentosa?", "c": "Early onset photosensitivity", "d": ["Posterior segment of the eye is more affected than the anterior segment", "Appearance of freckles in adolescence", "Melanoma is the commonest associated skin tumour"], "e": "Xeroderma pigmentosum: severe sunburn after minimal sun, from early infancy.", "src": "", "dz": "xp", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Broad nasal root leading to the presence of dystopia canthorum is a manifestation of which of the following diseases?", "c": "Waardenburg Syndrome", "d": ["Piebaldism", "Vitiligo", "Chediak-Higashi Syndrome"], "e": "Dystopia canthorum (inner canthi displaced sideways) with a broad nasal root = Waardenburg type 1.", "src": "", "dz": "mel", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which disease typically affects the central nervous system, eyes, ears, and skin in sequence?", "c": "Vogt-Koyanagi-Harada syndrome", "d": ["Sarcoidosis", "Neurofibromatosis", "Multiple sclerosis"], "e": "VKH comes in phases: meningism, then uveitis or retinal detachment, then tinnitus and deafness, then skin (vitiligo, poliosis, alopecia).", "src": "", "dz": "vkh", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is true about melanocytes?", "c": "Arise from neural crest", "d": ["Found only in dermis", "Arise from bone marrow", "Produce keratin"], "e": "Melanocytes come from the neural crest and migrate to the basal layer and hair follicles.", "src": "", "dz": "mel", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following conditions is associated with congenital deafness, heterochromia irides, and broad nasal root dystopia?", "c": "Waardenburg Syndrome", "d": ["Chediak-Higashi Syndrome", "Piebaldism", "Vogt-Koyanagi Syndrome"], "e": "Waardenburg: sensorineural deafness, iris heterochromia, white forelock, dystopia canthorum.", "src": "", "dz": "mel", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which autoimmune disease is commonly associated with vitiligo?", "c": "Autoimmune thyroiditis", "d": ["Rheumatoid arthritis", "Lupus erythematosus", "Celiac disease"], "e": "Autoimmune thyroid disease (Hashimoto, Graves) is the commonest autoimmune association of vitiligo.", "src": "", "dz": "vit", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which autoimmune diseases are commonly associated with vitiligo?", "c": "Addison's disease, thyroid disease, and diabetes", "d": ["Rheumatoid arthritis and SLE", "Multiple sclerosis and Crohn's disease", "Ulcerative colitis and myasthenia gravis"], "e": "Hashimoto, Graves, type 1 diabetes and Addison disease cluster with vitiligo.", "src": "", "dz": "vit", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which disorder causes Cicatricial alopecia?", "c": "Lichen planus", "d": ["Psoriasis", "Alopecia areata", "Disseminated lupus erythematosus"], "e": "Lichen planopilaris and DLE destroy the hair follicle stem cells: scarring alopecia.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 23 year old female patient presented with severe diffuse hair fall for the last month. She had a major accident with severe blood loss 5 months ago, and she had to be hospitalized for a month. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Female pattern hair loss", "Anagen effluvium", "Alopecia areata"], "e": "Major trauma, big blood loss or hospital stay push anagen hairs into telogen. Shedding starts about 2-5 months later.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A patient presents with premature termination of the anagen phase and a shift to the telogen phase of the hair cycle, which in some cases is due to nutritional deficiency. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Androgenic alopecia", "Alopecia areata", "Trichotillomania"], "e": "Telogen effluvium: anagen ends early and follicles enter telogen together. Triggers: nutritional deficiency, severe stress, systemic illness.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Pathology", "s": "A scalp biopsy of a 12-year-old female shows 65% of the hairs to be in the anagen phase, while 35% in the telogen. She is complaining of diffuse hair loss of 8 months duration. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Androgenetic alopecia", "Diffuse alopecia areata", "Anagen effluvium"], "e": "Normal scalp: 85-90% anagen, 10-15% telogen. 35% telogen confirms telogen effluvium.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45-year-old woman with diabetes, hypertension, and a history of breast cancer presents with diffuse hair loss for 2 weeks. A hair pull test shows 5-7 hairs with dark tapering ends. What is the most likely diagnosis?", "c": "Alopecia areata", "d": ["Androgenetic alopecia", "Telogen effluvium", "Tinea capitis"], "e": "Acute hair loss with a pull test showing dark tapered hairs (exclamation mark, dystrophic anagen hairs) = acute diffuse alopecia areata.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 25-year-old woman presents with sudden onset of patchy hair loss on her scalp. She has no other symptoms and no history of hair loss. On examination, you find several smooth, circular patches of hair loss with exclamation point hairs at the margins. What is the most likely diagnosis?", "c": "Alopecia areata", "d": ["Telogen effluvium", "Androgenetic alopecia", "Tinea capitis"], "e": "Sudden smooth non-scarring round patches with exclamation mark hairs at the edge = alopecia areata.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45-year-old man presents with gradual hair thinning on the crown and temples. He has a family history of hair loss. On examination, you find miniaturized hairs in the affected areas. What is the most likely diagnosis?", "c": "Androgenetic alopecia", "d": ["Telogen effluvium", "Alopecia areata", "Tinea capitis"], "e": "Slow thinning at the crown and temples, family history, miniaturized hairs = male pattern androgenetic alopecia.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 30-year-old woman presents with diffuse hair shedding that started 3 months ago after a stressful event. She has no other symptoms. On examination, you find no scalp abnormalities. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Alopecia areata", "Androgenetic alopecia", "Tinea capitis"], "e": "Diffuse shedding about 3 months after a big stress, no scalp inflammation = acute telogen effluvium.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which of the following is characterized by perifollicular lymphocytic infiltrate?", "c": "Alopecia areata", "d": ["Androgenetic alopecia", "Telogen effluvium", "Anagen effluvium"], "e": "Alopecia areata histology: dense perifollicular lymphocytes around anagen bulbs (swarm of bees).", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which type of alopecia is characterized by partial or complete loss of hair, particularly on the scalp, without scarring?", "c": "Alopecia areata", "d": ["Cicatricial alopecia", "Androgenetic alopecia", "Diffuse hair loss"], "e": "Alopecia areata is autoimmune. Patchy or widespread non-scarring loss, follicle stem cells stay intact.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A 20-year-old man presents with sudden onset of diffuse hair loss on his scalp. He has been undergoing chemotherapy for cancer. What is the most likely diagnosis?", "c": "Anagen effluvium", "d": ["Telogen effluvium", "Alopecia areata", "Androgenetic alopecia"], "e": "Heavy hair shedding within days to weeks of cytotoxic chemotherapy = anagen effluvium.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 40-year-old woman presents with hair loss on the top of her head. She has a history of hypothyroidism. On examination, you find diffuse hair thinning with no scalp abnormalities. What is the most likely diagnosis?", "c": "Telogen effluvium", "d": ["Alopecia areata", "Anagen effluvium", "Androgenetic alopecia"], "e": "Thyroid disease (hypo or hyper) causes chronic telogen effluvium: diffuse non-scarring thinning.", "src": "", "dz": "alo", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A35 year old male patient presented to the out patient clinic with single painless ulcer on the glans penis The patient said this lesion appeared after unprotected sexual intercourse. What is the expected time lapse between sexual intercourse and appearance of this lesion?", "c": "3 weeks", "d": ["6 weeks", "1 week", "8 weeks"], "e": "Incubation of primary syphilis (exposure to chancre) is about 21 days.", "src": "", "dz": "sypt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 35-year-old male patient presented to the outpatient clinic with single painless ulcer on the glans penis. The patient said this lesion appeared alter The unprotected sexual intercourse. What is/are the other expected findings in this patient?", "c": "Inguinal lymphadenopathy", "d": ["Pityriasiform lesions on the trunk", "Snail track ulcers", "Flat sessile perianal papules"], "e": "Primary syphilis: painless indurated chancre with firm non-tender non-suppurative inguinal nodes.", "src": "", "dz": "sypt", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 45-year-old male patient presented with well-defined, non-itchy erythematous scaly patches on both palms and soles of 1 month's duration. Examination revealed generalized lymphadenopathy and an ulcer on his palate. What is the most likely diagnosis?", "c": "Secondary stage syphilis", "d": ["Psoriasis", "Contact dermatitis", "tenia manus"], "e": "Non-itchy scaly palm and sole rash, mucous patches and generalized nodes = secondary syphilis.", "src": "", "dz": "syp2", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A 25-year-old male patient presents with widespread maculopapular, scaly, non-itchy, and non-tender oral and genital lesions, along with non-tender lymphadenopathy. What is the most likely diagnosis?", "c": "Secondary stage syphilis", "d": ["Lichen planus", "Guttate psoriasis", "Plaque psoriasis"], "e": "Widespread non-itchy scaly maculopapular rash including palms, soles and genital mucosa, with non-tender generalized nodes = secondary syphilis.", "src": "", "dz": "syp2", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Tertiary syphilis is most commonly associated with which of the following pathological features?", "c": "Necrotizing granulomas", "d": ["Mucosal erosions", "Condyloma lata", "Maculopapular rash"], "e": "Tertiary syphilis: gummas, destructive necrotizing granulomas (delayed hypersensitivity).", "src": "", "dz": "syp3", "lk": [], "up": true, "pr": false}, {"t": "Clinical", "s": "Which of the following is true about syphilis?", "c": "Once FTA-Abs is positive, it remains positive", "d": ["FTA-Abs becomes negative after treatment", "RPR is always positive", "Treponemal test is best for screening"], "e": "Treponemal tests (FTA-ABS, TP-PA) stay positive for life even after cure.", "src": "", "dz": "sypt", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "What is the recommended first-line treatment for gonorrhea?", "c": "Ceftriaxone 250 mg IM single dose", "d": ["Ciprofloxacin 500 mg oral single dose", "Spectinomycin 2 g IM single dose", "Azithromycin 1 g oral single dose"], "e": "Single IM dose of ceftriaxone is the base of treatment for uncomplicated gonorrhea.", "src": "", "dz": "gon", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "Which test assesses the change in penile circumference during an erection?", "c": "RigiScan", "d": ["Intracavernosal injection", "Penile brachial index", "Doppler wave form assessment"], "e": "RigiScan records circumference and rigidity at tip and base during sleep. Separates organic from psychogenic ED.", "src": "", "dz": "ed", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "If After 2 years of marriage, the wife of a 35 year man did not get pregnant. He sought medical advice. His genital examination was normal while his repeated semen profile revealed absent sperm in the ejaculate. His doctor asked for a hormonal assay that revealed normal LH, FSH levels, what would be the possible cause of his infertility?", "c": "Genital tract obstruction", "d": ["Prolactinoma induced infertility", "Anti-sperm antibody induced infertility", "Anejaculation induced infertility"], "e": "Azoospermia with normal testis size, normal FSH and LH and normal exam = obstructive (absent vas, ejaculatory duct obstruction).", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "After 2 years of marriage, the wife of a 35 year man did not get pregnant. He sought medical advice. His genital examination was normal while his repeated semen profile revealed azoospermia. How can the semen findings be interpreted?", "c": "Absent sperm in the ejaculate", "d": ["Low sperm motility", "Absent ejaculate", "Low semen volume"], "e": "Azoospermia = no sperm at all in the centrifuged ejaculate.", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Treatment", "s": "A 40-year-old man was unable to father a child since 2 years. He asked for medical advice. Genital examination was normal. His hormonal profile revealed normal serum levels of LH & FSH. His doctor didn't find any cause of his infertility after thorough medical history and examination. What is the essential drug to be used to treat his condition?", "c": "Clomiphene citrate", "d": ["Dopamine antagonist", "Bromocriptine", "Testosterone"], "e": "Idiopathic male infertility with normal gonadotropins: empirical clomiphene or tamoxifen.", "src": "", "dz": "minf", "lk": [], "up": false, "pr": false}, {"t": "Clinical", "s": "A man complained of male infertility. His semen analysis showed a sperm count of 30 million per mL, 20% of the sperm had rapid forward progression, and 99% were deformed. What is the most likely diagnosis?", "c": "Teratozoospermia", "d": ["Oligozoospermia", "Asthenozoospermia", "Azoospermia"], "e": "Normal count (30 million/mL) and motility (20% is borderline) but 99% abnormal forms = teratozoospermia.", "src": "", "dz": "minf",
