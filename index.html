nodules, tumors (HPV, poxviruses)"], "Cause": ["Herpesviruses (alpha, beta, gamma): linear dsDNA, icosahedral capsid, enveloped with glycoprotein spikes", "Spread: skin contact; VZV mainly respiratory droplets; others fomites, sexual, vertical"], "Key sign": ["Disseminated + systemic symptoms + nodes = primary", "Localized + no systemic symptoms + no nodes = recurrent", "Dominant symptom: HSV genital erosions and pain; chickenpox itch; zoster pain with burning prodrome; warts and molluscum cosmetic"], "Smear / histology": ["Tzanck smear (multinucleated giant cells) for HSV and VZV", "Zoster unilateral in one dermatome; bilateral or widespread suggests immunocompromise", "DDx of herpes: genodermatoses, pemphigus, SJS and TEN; clues: grouped vesicles, burning, recurrence, erosions, crusts"], "Complications": ["Ocular HSV: corneal ulcer, scarring, blindness (emergency)", "Eczema herpeticum and neonatal HSV: emergencies", "HPV 16 and 18: cervical, anal, oropharyngeal cancers"], "Treatment": ["Acyclovir or valacyclovir for herpes", "Genital warts in pregnancy: cryotherapy; avoid podophyllin", "Imiquimod: external genital and perianal warts; stimulates local cell-mediated and interferon pathways; also actinic keratosis, superficial BCC"]}}, "imp": {"n": "Impetigo", "c": "disease", "pg": "", "g": "bact", "sum": "Contagious superficial pyogenic skin infection of children. Non-bullous: S. aureus or group A strep, honey-colored crusts. Bullous: S. aureus toxin, large bullae. Never treat with steroids.", "rows": {"Organism": "Non-bullous: S. aureus, group A strep or both. Bullous: S. aureus local epidermolytic toxin. Children, summer. Bullous: neonates and under 5. Predisposing: poor hygiene, malnutrition, topical steroids. Secondary (impetiginization) on atopic dermatitis, bullous disease, insect bites, wounds.", "Lesion": "Non-bullous: macule, thin vesicle, pustule, golden-yellow friable crust, then erosion. Around nose and mouth, limbs. Heals in 5-10 days without scar. Bullous: large bullae last 2-3 days, thin crust, circinate lesions, buccal mucosa may be involved.", "Key sign": "Honey-colored crust. Itch spreads it by autoinoculation. Impetigo neonatorum: bullous impetigo of the newborn, starts day 4-10, extensive large bullae, mucosa involved, fever, diarrhea, contagious and may be fatal.", "Complications": "Eczematization, furunculosis, erysipelas, cellulitis. Post-streptococcal glomerulonephritis 18-21 days after strep infection. Scarlet fever, urticaria, erythema multiforme. SSSS (toxin cleaves desmoglein-1). Neonatorum: bacteremia, pneumonia, meningitis.", "Treatment": "Hygiene and nutrition. Remove crusts: soap and water, warm potassium permanganate 1/8000, gentian violet 1%. Mild: topical mupirocin, fusidic acid, neomycin or bacitracin. Systemic if widespread, lymphadenopathy or nephritogenic strep: flucloxacillin, erythromycin, cephalosporin, amoxicillin-clavulanate. Neonatorum: isolate, IV anti-staph. NEVER steroids, immunosuppressives or Kenacomb."}, "bk": 1, "rb": {"Organism": ["Non-bullous: S. aureus, group A strep or both", "Bullous: S. aureus epidermolytic toxin; neonates and under 5", "Children, summer", "Predisposing: poor hygiene, malnutrition, topical steroids", "Secondary on atopic dermatitis, bullous disease, insect bites, wounds"], "Lesion": ["Non-bullous: macule, thin vesicle, pustule, golden-yellow friable crust, erosion; around nose and mouth, limbs; heals in 5-10 days, no scar", "Bullous: large bullae last 2-3 days, thin crust, circinate lesions; buccal mucosa may be involved"], "Key sign": ["Honey-colored crust; itch spreads it (autoinoculation)", "Impetigo neonatorum: bullous impetigo of newborn, day 4-10, extensive, mucosa involved, fever, diarrhea, contagious, may be fatal"], "Complications": ["Eczematization, furunculosis, erysipelas, cellulitis", "Post-strep glomerulonephritis 18-21 days after infection", "Scarlet fever, urticaria, erythema multiforme", "SSSS (toxin cleaves desmoglein-1)", "Neonatorum: bacteremia, pneumonia, meningitis"], "Treatment": ["Hygiene, nutrition; remove crusts (soap and water, warm potassium permanganate 1/8000, gentian violet 1%)", "Mild: topical mupirocin, fusidic acid, neomycin or bacitracin", "Systemic if widespread, nodes or nephritogenic strep: flucloxacillin, erythromycin, cephalosporin, amoxicillin-clavulanate", "Neonatorum: isolate, IV anti-staph", "NEVER steroids, immunosuppressives or Kenacomb"]}}, "ecth": {"n": "Ecthyma", "c": "disease", "pg": "", "g": "bact", "sum": "Deep ulcerative impetigo: adherent crust over a punched-out ulcer into the dermis. Lesion of neglect. Heals with scar.", "rows": {"Organism": "Strep or staph. Lesion of neglect: poor hygiene, malnutrition, excoriations, insect bites, minor trauma in diabetics, elderly, soldiers, alcoholics.", "Lesion": "Thick adherent crust. Removing it shows a purulent irregular ulcer. Mostly on the legs. Weeks to months. Painful and tender.", "Key sign": "Deep, reaches the dermis. Heals slowly with a scar. Impetigo is superficial and leaves no scar.", "Complications": "Scarring. Can start from a vesicle or pustule before ulceration.", "Treatment": "Hygiene and nutrition. Oral antibiotic active against both strep and staph: flucloxacillin, erythromycin, cephalosporin or amoxicillin-clavulanate. Topical alone is not enough."}, "bk": 1, "rb": {"Organism": ["Strep or staph; lesion of neglect", "Poor hygiene, malnutrition, excoriations, insect bites; diabetics, elderly, soldiers, alcoholics"], "Lesion": ["Thick adherent crust; removing it shows a purulent irregular ulcer", "Mostly legs; weeks to months; painful, tender"], "Key sign": ["Deep, reaches dermis; heals slowly with scar", "Impetigo: superficial, no scar"], "Complications": ["Scarring", "May start from a vesicle or pustule before ulceration"], "Treatment": ["Hygiene, nutrition", "Oral antibiotic active against strep and staph: flucloxacillin, erythromycin, cephalosporin or amoxicillin-clavulanate", "Topical alone is not enough"]}}, "fur": {"n": "Furuncle and carbuncle", "c": "disease", "pg": "", "g": "bact", "sum": "A continuum of S. aureus infection that starts in the hair follicle. Folliculitis is the ostium, furuncle is a boil, carbuncle is several coalescing furuncles. Carbuncle needs drainage plus systemic antibiotic.", "rows": {"Organism": "S. aureus via the hair follicle. Children, adolescents, young adults, boys more. Predisposing: S. aureus carrier state (nares, axillae, perineum, vagina), diabetes, obesity, poor hygiene. Carbuncle: men of middle or old age.", "Lesion": "Superficial folliculitis (Bockhart impetigo): yellow pustule with a narrow red areola at the follicle ostium, scalp and limbs of children, no scar. Furuncle: firm tender 1-2 cm nodule, becomes fluctuant, central pustule, any hairy area, throbbing pain. Carbuncle: group of contiguous follicles, red hot painful plaque draining pus from several openings, nape, extends to fascia.", "Key sign": "Deep folliculitis (furuncle, carbuncle, sycosis) heals with scar. Furuncle: no scar in the inflammatory stage, scar after pointing. Carbuncle: low-grade fever and malaise.", "Complications": "Zone of cellulitis around the furuncle. Scarring.", "Treatment": "Furuncle: antibiotic in the inflammatory stage, surgical drainage at the pointing stage. Carbuncle, abscess: incision and drainage plus systemic penicillinase-resistant antibiotic (flucloxacillin), hot compresses, topical antibacterial around. Avoid occlusive dressings."}, "bk": 1, "rb": {"Organism": ["S. aureus via the hair follicle; children, adolescents, young adults, boys more", "Predisposing: carrier state (nares, axillae, perineum, vagina), diabetes, obesity, poor hygiene", "Carbuncle: middle-aged or older men"], "Lesion": ["Superficial folliculitis (Bockhart impetigo): yellow pustule, narrow red halo at follicle ostium, scalp and limbs of children, no scar", "Furuncle: firm tender 1-2 cm nodule, becomes fluctuant, central pustule, any hairy area, throbbing pain", "Carbuncle: contiguous follicles, red hot painful plaque draining from several openings, nape, extends to fascia"], "Key sign": ["Deep folliculitis (furuncle, carbuncle, sycosis) heals with scar", "Furuncle: no scar in inflammatory stage, scar after pointing", "Carbuncle: low-grade fever, malaise"], "Complications": ["Cellulitis zone around furuncle; scarring"], "Treatment": ["Furuncle: antibiotic in inflammatory stage; drainage at pointing stage", "Carbuncle, abscess: incision and drainage + systemic penicillinase-resistant antibiotic (flucloxacillin), hot compresses, topical antibacterial around", "Avoid occlusive dressings"]}}, "cell": {"n": "Cellulitis and erysipelas", "c": "disease", "pg": "", "g": "bact", "sum": "Mostly streptococcal. Erysipelas is dermis and upper subcutis with a sharp raised edge. Cellulitis is the subcutis with a diffuse edge. Penicillin is the drug of choice.", "rows": {"Organism": "Mostly streptococci.", "Lesion": "Erysipelas: well-demarcated raised edge, blisters common. Cellulitis: diffuse edge. Erythema, heat, swelling and pain are constant.", "Key sign": "Recurrent erysipelas of the leg often has interdigital tinea pedis as the portal of entry. Fever.", "Complications": "Fasciitis, myositis, subcutaneous abscess, septicemia, nephritis in some strep cases.", "Treatment": "Penicillin for 10 days. Recurrent: long-acting penicillin prophylaxis, sometimes lifelong. Penicillin allergy: erythromycin. Systemic antibiotics are needed in carbuncle, cellulitis and erysipelas."}, "bk": 1, "rb": {"Organism": ["Mostly streptococci"], "Lesion": ["Erysipelas: well-demarcated raised edge, blisters common", "Cellulitis: diffuse edge", "Erythema, heat, swelling, pain always present"], "Key sign": ["Recurrent leg erysipelas: look for interdigital tinea pedis as portal of entry", "Fever"], "Complications": ["Fasciitis, myositis, subcutaneous abscess, septicemia; nephritis in some strep cases"], "Treatment": ["Penicillin 10 days", "Recurrent: long-acting penicillin prophylaxis, sometimes lifelong", "Penicillin allergy: erythromycin", "Systemic antibiotics needed in carbuncle, cellulitis, erysipelas"]}}, "eryth": {"n": "Erythrasma", "c": "disease", "pg": "", "g": "bact", "sum": "Mild superficial infection of the folds by Corynebacterium minutissimum. Coral-red under Wood light. Erythromycin works best.", "rows": {"Organism": "Corynebacterium minutissimum, a gram-positive rod.", "Lesion": "Sharply marginated irregular patches, red at first then brown. Groins, axillae, intergluteal and submammary folds.", "Key sign": "Coral-red fluorescence under Wood light. No raised edge, unlike tinea cruris.", "Complications": "None important.", "Treatment": "Erythromycin for 2 weeks (most effective). Topical: clotrimazole or miconazole (azoles), fusidic acid."}, "bk": 1, "rb": {"Organism": ["Corynebacterium minutissimum, gram-positive rod"], "Lesion": ["Sharp irregular patches, red then brown", "Groins, axillae, intergluteal and submammary folds"], "Key sign": ["Coral-red under Wood light", "No raised edge (unlike tinea cruris)"], "Complications": ["None important"], "Treatment": ["Erythromycin 2 weeks, most effective", "Topical: clotrimazole or miconazole, fusidic acid"]}}, "fgen": {"n": "Fungal basics and antifungals", "c": "disease", "pg": "", "g": "fung", "sum": "Dermatophytes are keratinophilic fungi (keratinase) of three genera: Trichophyton, Epidermophyton, Microsporum. KOH shows hyphae. Systemic drugs: griseofulvin, terbinafine, itraconazole, fluconazole.", "rows": {"Organism": "Moulds form hyphae (dermatophytes or non-dermatophyte saprophytes). Yeasts form pseudohyphae (Candida albicans pathogenic, Pityrosporum nonpathogenic). Dermatophytes: anthropophilic (human to human, mild chronic), zoophilic (animal, moderate acute inflammation), geophilic (soil).", "Lesion": "\"Tinea\" plus the Latin site name, for example tinea capitis is the scalp. Hair: black dot, gray patch, kerion, favus. Skin: corporis, cruris, manuum, pedis. Nail: onychomycosis.", "Key sign": "A non-dermatophyte is the cause only if: the lesion could be caused by it, it is isolated alone without a dermatophyte, and the same mould grows in 3 cultures a week apart.", "Lab / Wood light": "Wood light is for screening. KOH 10-20%: hyphae and spores. Culture on Sabouraud dextrose agar. T. rubrum: white cottony colony, red reverse, teardrop microconidia, pencil macroconidia. T. mentagrophytes: round grape-like microconidia, cigar macroconidia, spiral hyphae. T. schoenleinii: antler hyphae, no conidia. M. canis: spindle thick-walled macroconidia, yellow-orange reverse. T. violaceum: heaped violet colony.", "Treatment": "Systemic if onychomycosis, tinea capitis, extensive skin disease, extensive pityriasis versicolor, chronic recurrent pedis or manuum. Griseofulvin: fungistatic, dermatophytes only, no resistance, 10-15 mg/kg/day (capitis 6 wk, favus 8-9 wk, kerion 12-16 wk, extensive skin 4 wk, nails: hand 6-12 mo, feet 12-18 mo). Terbinafine: fungicidal, dermatophytes only, resistance exists, 250 mg/day (capitis 4 wk, nails 6 wk fingers and 12 wk toes, skin at least 2 wk). Itraconazole: fungistatic, dermatophytes, yeasts and most moulds, nails 200 mg/day 6 or 12 wk or pulse 200 mg twice daily 1 week on 3 off. Fluconazole: nails 150 mg weekly (fingers 3-6 mo, toes 9-12 mo). Ketoconazole is hepatotoxic, not used. Topical: azoles, terbinafine, tolnaftate (anti-dermatophyte)."}, "bk": 1, "rb": {"Organism": ["Moulds form hyphae (dermatophytes or non-dermatophyte saprophytes); yeasts form pseudohyphae (Candida albicans pathogenic, Pityrosporum not)", "Dermatophytes: anthropophilic (human to human, mild chronic), zoophilic (animal, moderate acute inflammation), geophilic (soil)"], "Lesion": ["Tinea + Latin site: capitis (scalp), corporis, cruris, manuum, pedis; nail: onychomycosis", "Hair types: black dot, gray patch, kerion, favus"], "Key sign": ["Non-dermatophyte is the cause only if: lesion fits, isolated without a dermatophyte, same mould in 3 cultures a week apart"], "Lab / Wood light": ["Wood light: screening. KOH 10-20%: hyphae and spores. Culture: Sabouraud dextrose agar", "T. rubrum: white cottony, red reverse, teardrop microconidia, pencil macroconidia", "T. mentagrophytes: grape-like microconidia, cigar macroconidia, spiral hyphae", "T. schoenleinii: antler hyphae, no conidia", "M. canis: spindle thick-walled macroconidia, yellow-orange reverse", "T. violaceum: heaped violet colony"], "Treatment": ["Systemic if: onychomycosis, tinea capitis, extensive skin disease, extensive PV, chronic recurrent pedis or manuum", "Griseofulvin: fungistatic, dermatophytes only, no resistance; 10-15 mg/kg/day (capitis 6 wk, favus 8-9 wk, kerion 12-16 wk, extensive skin 4 wk, nails: hand 6-12 mo, feet 12-18 mo)", "Terbinafine: fungicidal, dermatophytes only, resistance exists; 250 mg/day (capitis 4 wk, nails 6 wk fingers, 12 wk toes, skin at least 2 wk)", "Itraconazole: fungistatic, dermatophytes, yeasts, most moulds; nails 200 mg/day 6 or 12 wk, or pulse 200 mg twice daily 1 week on, 3 off", "Fluconazole: nails 150 mg weekly (fingers 3-6 mo, toes 9-12 mo)", "Ketoconazole: hepatotoxic, not used", "Topical: azoles, terbinafine, tolnaftate"]}}, "tcap": {"n": "Tinea capitis", "c": "disease", "pg": "", "g": "fung", "sum": "Dermatophyte scalp infection of school-age children. Black dot: endothrix, no fluorescence. Gray patch: ectothrix, M. audouinii. Kerion: boggy inflammatory mass, scars if late.", "rows": {"Organism": "Trichophyton and Microsporum. T. violaceum (endemic in Africa), T. tonsurans (anthropophilic), M. audouinii (anthropophilic), M. canis (zoophilic). School age. Rare in adults: sebum becomes fungicidal at puberty.", "Lesion": "Round or oval patch of alopecia with or without scale, hair stumps, single or multiple. Posterior cervical and posterior auricular nodes. Black dot: non-inflammatory, T. tonsurans or T. violaceum, hair breaks at scalp level, scanty scale. Gray patch: non-inflammatory, M. audouinii, dry scaly patch, hair breaks 2-3 mm above scalp. Kerion: inflammatory, M. canis or T. mentagrophytes, boggy purulent plaque, hair easily pulled out.", "Key sign": "Black dot: no fluorescence, endothrix (chains of large spores inside the hair). Gray patch: ectothrix (spores in a mosaic around the hair). Kerion: ectothrix (spores in regular columns). Non-inflammatory types are self-limited at puberty.", "Lab / Wood light": "Black dot: none. Gray patch (microspores): yellow-green fluorescence. Kerion: M. canis fluoresces, T. mentagrophytes does not. Wood light 365 nm.", "Treatment": "Oral antifungal always. Griseofulvin 10-15 mg/kg/day for 6 weeks (kerion 12-16 weeks). Terbinafine 4 weeks, itraconazole 4-6 weeks. Antibiotics have no role. Kerion: topical steroid may be added to the antifungal. Start at once if a non-fluctuant abscess shows ectothrix spores on KOH. Late or inadequate treatment leaves permanent scarring alopecia. DDx: alopecia areata, trichotillomania, abscess."}, "bk": 1, "rs": {"Organism": "Trichophyton and Microsporum. School-age children.", "Lesion": "Alopecia patch. Black dot, gray patch, kerion (boggy, painful).", "Key sign": "Black dot: endothrix. Gray patch and kerion: ectothrix.", "Lab / Wood light": "Black dot: no fluorescence. Gray patch: yellow-green.", "Treatment": "Oral antifungal always: griseofulvin 6 weeks, terbinafine 4 weeks."}, "rb": {"Organism": ["Trichophyton and Microsporum: T. violaceum (Africa), T. tonsurans (anthropophilic), M. audouinii (anthropophilic), M. canis (zoophilic)", "School age; rare in adults (sebum fungicidal after puberty)"], "Lesion": ["Round or oval alopecia patch, with or without scale, hair stumps; posterior cervical and auricular nodes", "Black dot: non-inflammatory, T. tonsurans or T. violaceum; hair breaks at scalp, scanty scale", "Gray patch: non-inflammatory, M. audouinii; dry scaly patch, hair breaks 2-3 mm above scalp", "Kerion: inflammatory, M. canis or T. mentagrophytes; boggy purulent plaque, hair easily pulled"], "Key sign": ["Black dot: endothrix (chains of large spores inside hair)", "Gray patch: ectothrix (mosaic of spores around hair)", "Kerion: ectothrix (spores in regular columns)", "Non-inflammatory types self-limited at puberty"], "Lab / Wood light": ["Black dot: no fluorescence", "Gray patch (microspores): yellow-green", "Kerion: M. canis fluoresces, T. mentagrophytes does not; Wood light 365 nm"], "Treatment": ["Oral antifungal always: griseofulvin 10-15 mg/kg/day 6 weeks (kerion 12-16 weeks); terbinafine 4 weeks; itraconazole 4-6 weeks", "No role for antibiotics; kerion: topical steroid may be added", "Start at once if non-fluctuant abscess shows ectothrix spores on KOH", "Late or inadequate treatment: permanent scarring alopecia", "DDx: alopecia areata, trichotillomania, abscess"]}}, "favus": {"n": "Favus", "c": "disease", "pg": "", "g": "fung", "sum": "Most severe dermatophyte hair infection. T. schoenleinii. Scutulum: yellow cup-shaped crust with mousy odor. Bluish-white Wood light. Scarring alopecia.", "rows": {"Organism": "T. schoenleinii. The only trichophyte with fluorescence.", "Lesion": "Scutulum is the first lesion: yellow sulfur-colored cup-shaped crust, convex side toward the scalp, firmly adherent, mousy odor, serosanguinous discharge when detached, a few mm to a few cm. Hair is normal length, thin, dry, friable, dull gray, looks dusted with powder.", "Key sign": "Scarring alopecia in chronic infection.", "Lab / Wood light": "Bluish-white fluorescence. KOH: hyphae and air spaces inside the hair shaft, hyphae parallel to the long axis (endothrix). Culture: antler hyphae, no conidia.", "Treatment": "Griseofulvin 10-15 mg/kg/day for 8-9 weeks."}, "bk": 1, "rb": {"Organism": ["T. schoenleinii: the only trichophyte with fluorescence"], "Lesion": ["Scutulum first: yellow sulfur-colored cup-shaped crust, convex side toward scalp, firmly adherent, mousy odor, serosanguinous discharge when detached; few mm to few cm", "Hair normal length, thin, dry, friable, dull gray, looks dusted with powder"], "Key sign": ["Scarring alopecia in chronic infection"], "Lab / Wood light": ["Wood light: bluish-white", "KOH: hyphae and air spaces inside hair shaft, parallel to long axis (endothrix)", "Culture: antler hyphae, no conidia"], "Treatment": ["Griseofulvin 10-15 mg/kg/day for 8-9 weeks"]}}, "tcorp": {"n": "Tinea corporis", "c": "disease", "pg": "", "g": "fung", "sum": "Dermatophyte infection of trunk and limbs. Circinate scaly patches with healing center and active vesicular margin. Itchy.", "rows": {"Organism": "Any dermatophyte. T. rubrum then T. mentagrophytes most often. Spread by infected people, contaminated clothing, animals (T. mentagrophytes). Incubation 1-3 weeks.", "Lesion": "Single, multiple or coalescent circinate erythematous scaly patches that spread outward. Center heals, margin is elevated, red, scaly with vesicles or pustules. Concentric rings if the center reactivates. Center may be hyperpigmented with fine scale.", "Key sign": "Persistent itch and disfigurement. Hair follicles are reservoirs, so hairy areas respond worse. Excludes hair, nails, palms, soles and groin. Dorsum of hand or foot counts as tinea corporis.", "Lab / Wood light": "KOH: hyphae (longitudinal structures).", "Treatment": "Topical azoles, terbinafine or tolnaftate. Extensive disease: systemic, griseofulvin 4 weeks or terbinafine at least 2 weeks."}, "bk": 1, "rs": {"Organism": "T. rubrum commonest. Incubation 1-3 weeks.", "Lesion": "Circinate scaly patches, healing center, active red margin.", "Key sign": "Itch. Excludes hair, nails, palms, soles, groin.", "Lab / Wood light": "KOH: hyphae.", "Treatment": "Topical azole or terbinafine. Extensive: griseofulvin or terbinafine."}, "rb": {"Organism": ["Any dermatophyte; T. rubrum then T. mentagrophytes commonest", "Spread: infected people, clothing, animals (T. mentagrophytes)", "Incubation 1-3 weeks"], "Lesion": ["Single, multiple or coalescent circinate red scaly patches spreading outward", "Center heals; margin raised, red, scaly, with vesicles or pustules", "Concentric rings if center reactivates; center may be hyperpigmented with fine scale"], "Key sign": ["Persistent itch and disfigurement", "Hair follicles are reservoirs, so hairy areas respond worse", "Excludes hair, nails, palms, soles, groin; dorsum of hand or foot counts as corporis"], "Lab / Wood light": ["KOH: hyphae (longitudinal structures)"], "Treatment": ["Topical azoles, terbinafine or tolnaftate", "Extensive: griseofulvin 4 weeks or terbinafine at least 2 weeks"]}}, "tcr": {"n": "Tinea cruris", "c": "disease", "pg": "", "g": "fung", "sum": "Dermatophyte infection of the groin and inner thighs. Sharp raised scaly advancing border with hyperpigmented center. Commoner in men.", "rows": {"Organism": "E. floccosum, T. rubrum, T. mentagrophytes. Predisposing: male sex (warm moist scrotum), obesity, sweating, tinea pedis (clothing carries it to the groin).", "Lesion": "Starts unilateral, may become bilateral. Sharply demarcated, raised erythematous scaly advancing border with pustules or vesicles, hyperpigmented center. Inner thighs and crural folds, may reach abdomen and buttocks. May turn serpiginous.", "Key sign": "T. rubrum: chronic, leathery, lichenified. T. mentagrophytes: acute with marked inflammation. Look-alikes: erythrasma (no raised edge, coral red), inverse psoriasis (no scale, no raised margin).", "Lab / Wood light": "KOH: hyphae. Wood light: no glow (erythrasma glows coral red).", "Treatment": "Topical antifungal. Chronic or extensive: systemic for 4 weeks."}, "bk": 1, "rb": {"Organism": ["E. floccosum, T. rubrum, T. mentagrophytes", "Predisposing: male sex (warm moist scrotum), obesity, sweating, tinea pedis (carried to groin by clothing)"], "Lesion": ["Starts unilateral, may become bilateral", "Sharp raised red scaly advancing border with pustules or vesicles; hyperpigmented center", "Inner thighs and crural folds; may reach abdomen and buttocks; may turn serpiginous"], "Key sign": ["T. rubrum: chronic, leathery, lichenified", "T. mentagrophytes: acute, marked inflammation", "Look-alikes: erythrasma (no raised edge, coral red), inverse psoriasis (no scale, no raised margin)"], "Lab / Wood light": ["KOH: hyphae", "Wood light: no glow (erythrasma glows coral red)"], "Treatment": ["Topical antifungal", "Chronic or extensive: systemic for 4 weeks"]}}, "tmp": {"n": "Tinea manuum and tinea pedis", "c": "disease", "pg": "", "g": "fung", "sum": "Palms and soles lack sebaceous glands. Tinea pedis is the commonest dermatophyte infection. Types: interdigital, moccasin, vesicobullous, ulcerative. Tinea manuum is often one hand with both feet.", "rows": {"Organism": "T. rubrum, T. mentagrophytes, T. interdigitale, E. floccosum. T. tonsurans in children. Predisposing: no sebaceous glands, occlusive shoes, barefoot in gyms and locker rooms. Pedis: adults, male = female.", "Lesion": "Manuum: non-inflammatory, chronic, hyperkeratotic, often unilateral, hyperkeratosis in the palm creases that does not respond to emollients. Pedis: interdigital (commonest, lateral web spaces, white macerated scale, fissures, itch), moccasin (diffuse hyperkeratosis, scale, fissures, chronic), inflammatory (vesicles and bullae on the medial foot), ulcerative (ulcers in the web spaces).", "Key sign": "Manuum: \"two feet one hand\" pattern. Tinea starts unilateral and spreads. Steroids worsen tinea but treat eczema, so do KOH if eczema is suspected. Ulcerative type: diabetics and immunocompromised.", "Lab / Wood light": "Complications: bacterial superinfection (commonest), dermatophytid (eczema-like reaction distant from the fungus), cellulitis, osteomyelitis and amputation in diabetics. DDx: psoriasis, contact dermatitis, dyshidrosis.", "Treatment": "Topical antifungal. Chronic or recurrent: systemic for 4 weeks. Examine the hands and nails for onychomycosis: if present, treat systemically."}, "bk": 1, "rb": {"Organism": ["T. rubrum, T. mentagrophytes, T. interdigitale, E. floccosum; T. tonsurans in children", "Predisposing: no sebaceous glands, occlusive shoes, barefoot in gyms and locker rooms", "Pedis: adults, male = female"], "Lesion": ["Manuum: non-inflammatory, chronic, hyperkeratotic, often unilateral; palm-crease hyperkeratosis not responding to emollients", "Pedis, interdigital (commonest): lateral web spaces, white macerated scale, fissures, itch", "Pedis, moccasin: diffuse hyperkeratosis, scale, fissures, chronic", "Pedis, inflammatory: vesicles and bullae on medial foot", "Pedis, ulcerative: ulcers in web spaces"], "Key sign": ["Manuum: \"two feet one hand\" pattern; starts unilateral then spreads", "Steroids worsen tinea but treat eczema: do KOH if eczema suspected", "Ulcerative type: diabetics, immunocompromised"], "Lab / Wood light": ["Complications: bacterial superinfection (commonest), dermatophytid (eczema-like reaction away from fungus), cellulitis, osteomyelitis and amputation in diabetics", "DDx: psoriasis, contact dermatitis, dyshidrosis"], "Treatment": ["Topical antifungal; chronic or recurrent: systemic for 4 weeks", "Check hands and nails: onychomycosis present means systemic treatment"]}}, "onyx": {"n": "Onychomycosis", "c": "disease", "pg": "", "g": "fung", "sum": "Fungal infection of the nail unit by dermatophytes, non-dermatophytes or yeasts. Tinea unguium is the dermatophyte form. T. rubrum is commonest. Long treatment, frequent relapse.", "rows": {"Organism": "T. rubrum (commonest), T. interdigitale, T. tonsurans (children), E. floccosum, Microsporum rarely. About 10% are yeasts or non-dermatophyte moulds. Predisposing: trauma, other nail disease.", "Lesion": "Ridging, yellow discoloration, onycholysis, thickening, subungual hyperkeratosis. Toenails more than fingernails, men more than women, multiple nails more than single. Usually painless: cosmetic, or pain when trimming or running.", "Key sign": "Types: distal and lateral subungual (commonest), superficial white (dorsal plate, T. interdigitale white patches), proximal subungual (via proximal nail fold, rare, HIV and immunosuppressed), endonyx (chalky white, lamellar splitting, no inflammation, T. soudanense), total dystrophic (end stage).", "Lab / Wood light": "Do KOH and culture even if psoriasis or trauma is suspected, since fungus can sit on a dystrophic nail. DDx: psoriasis, lichen planus, trauma, warts, chronic paronychia, nail tumors.", "Treatment": "Single nail: topical amorolfine 5% lacquer weekly, ciclopirox 8% daily or tioconazole 28%, for 6-12 months (toes 12 months). Multiple nails: systemic. Terbinafine 250 mg/day 6 weeks fingers, 12 weeks toes. Itraconazole 200 mg/day 6 or 12 weeks, or pulse. Fluconazole 150 mg weekly 3-6 months fingers, 9-12 months toes. Often recurs."}, "bk": 1, "rb": {"Organism": ["T. rubrum (commonest), T. interdigitale, T. tonsurans (children), E. floccosum, Microsporum rarely", "About 10% are yeasts or non-dermatophyte moulds", "Predisposing: trauma, other nail disease"], "Lesion": ["Ridging, yellow discoloration, onycholysis, thickening, subungual hyperkeratosis", "Toenails > fingernails; men > women; multiple nails > single", "Usually painless: cosmetic, or pain on trimming or running"], "Key sign": ["Distal and lateral subungual: commonest", "Superficial white: dorsal plate, T. interdigitale", "Proximal subungual: via proximal nail fold; rare, HIV and immunosuppressed", "Endonyx: chalky white, lamellar splitting, no inflammation, T. soudanense", "Total dystrophic: end stage"], "Lab / Wood light": ["KOH and culture even if psoriasis or trauma suspected (fungus can sit on a dystrophic nail)", "DDx: psoriasis, lichen planus, trauma, warts, chronic paronychia, nail tumors"], "Treatment": ["Single nail: amorolfine 5% lacquer weekly, ciclopirox 8% daily or tioconazole 28%, 6-12 months (toes 12)", "Multiple nails: systemic", "Terbinafine 250 mg/day: 6 weeks fingers, 12 weeks toes", "Itraconazole 200 mg/day 6 or 12 weeks, or pulse", "Fluconazole 150 mg weekly: 3-6 months fingers, 9-12 months toes", "Often recurs"]}}, "ped": {"n": "Pediculosis (lice)", "c": "disease", "pg": "", "g": "para", "sum": "Lice are blood-feeding insects. Nits stick firmly to hair. Itch is the main complaint. Permethrin 1% is first-line.", "rows": {"Cause": "Lice (order Phthiraptera). Head: Pediculus humanus capitis, children. Body: clothing seams, vagabond disease, vector of typhus and relapsing fever. Pubic: crabs, sexually transmitted. Nits hatch in 7-10 days, nymphs mature in 7-12 days, cycle about 3 weeks.", "Lesion": "Itching is the commonest complaint. Small gray-brown insects crawl in the hair. Nits are attached to hair shafts or clothing seams.", "Key sign": "Nits are firmly adherent to the hair shaft, unlike dandruff. Cervical, occipital and postauricular nodes should make you suspect lice. Vagabond disease = body lice + eczema + lichenification.", "Complications": "Bacterial infection, eczematization, lymphadenopathy, vagabond disease.", "Treatment": "Permethrin 1% (first-line, least toxic): damp hair 10 minutes, repeat after 7-10 days. Malathion 0.5% (ovicidal, not under 24 months). Ivermectin 1% lotion (6 months and older). Oral ivermectin 200-400 microgram/kg, repeat 7-10 days (not in pregnancy, lactation or under 15 kg). Pubic lice: shave first."}, "bk": 1, "rb": {"Cause": ["Lice (order Phthiraptera)", "Head: Pediculus humanus capitis, children", "Body: clothing seams; vagabond disease; vector of typhus and relapsing fever", "Pubic: crabs, sexually transmitted", "Nits hatch in 7-10 days, nymphs mature in 7-12 days, cycle about 3 weeks"], "Lesion": ["Itch is the commonest complaint", "Small gray-brown insects in the hair; nits on hair shafts or clothing seams"], "Key sign": ["Nits stick firmly to the hair shaft (not dandruff)", "Cervical, occipital, postauricular nodes: suspect lice", "Vagabond disease = body lice + eczema + lichenification"], "Complications": ["Bacterial infection, eczematization, lymphadenopathy, vagabond disease"], "Treatment": ["Permethrin 1%: first line, least toxic; damp hair 10 min, repeat after 7-10 days", "Malathion 0.5%: ovicidal, not under 24 months", "Ivermectin 1% lotion: 6 months and older", "Oral ivermectin 200-400 microgram/kg, repeat 7-10 days (not in pregnancy, lactation, under 15 kg)", "Pubic lice: shave first"]}}, "eczg": {"n": "Eczema basics (acute, subacute, chronic)", "c": "disease", "pg": "", "g": "ecz", "sum": "Eczema and dermatitis mean the same. Inflammatory pattern with reduced filaggrin. Acute: weeping and spongiosis. Chronic: lichenification. Exogenous (contact) or endogenous (atopic, seborrheic and others).", "rows": {"Cause": "Eczema = dermatitis. Pattern of skin inflammation with reduced filaggrin in the stratum corneum (Th2 IL-4 inhibits filaggrin). Exogenous: irritant contact, allergic contact, photo contact, infective, id eruptions. Endogenous: atopic, pityriasis alba, seborrheic, pompholyx, gravitational, nummular, asteatotic, neurodermatitis.", "Lesion": "Acute: red, edematous, weeping, crusted, papulovesicles. Chronic: lichenification (thickened stratum corneum, fissures), the end stage of any skin inflammation. Subacute: features of both.", "Key sign": "Clinical: dryness, itch, redness, scaling, clustered papulovesicles. Histology: lymphocytes around vessels, spongiosis, variable acanthosis.", "Tests": "Acute: spongiosis progressing to vesicles, epidermal and upper dermal edema, dilated vessels, lymphocyte exocytosis, no increase in mast cells. Subacute: irregular acanthosis, patchy spongiosis. Chronic: hyperkeratosis, patchy parakeratosis, irregular acanthosis, long rete ridges, mild spongiosis, mast cells and eosinophils.", "Treatment": "Acute: wet dressings and topical steroid, antihistamine, oral antibiotic if infected. Subacute: hydration and emollients. Chronic: topical anti-inflammatory, calcineurin inhibitors, antihistamines. Systemic steroid only rarely."}, "bk": 1, "rb": {"Cause": ["Eczema = dermatitis: inflammatory pattern with reduced filaggrin (Th2 IL-4 inhibits filaggrin)", "Exogenous: irritant contact, allergic contact, photo contact, infective, id eruptions", "Endogenous: atopic, pityriasis alba, seborrheic, pompholyx, gravitational, nummular, asteatotic, neurodermatitis"], "Lesion": ["Acute: red, edematous, weeping, crusted papulovesicles", "Subacute: features of both", "Chronic: lichenification (thick stratum corneum, fissures), end stage of any skin inflammation"], "Key sign": ["Clinical: dryness, itch, redness, scaling, clustered papulovesicles", "Histology: perivascular lymphocytes, spongiosis, variable acanthosis"], "Tests": ["Acute: spongiosis to vesicles, epidermal and upper dermal edema, dilated vessels, lymphocyte exocytosis; no increase in mast cells", "Subacute: irregular acanthosis, patchy spongiosis", "Chronic: hyperkeratosis, patchy parakeratosis, irregular acanthosis, long rete ridges, mild spongiosis, mast cells and eosinophils"], "Treatment": ["Acute: wet dressings, topical steroid, antihistamine; oral antibiotic if infected", "Subacute: hydration, emollients", "Chronic: topical anti-inflammatory, calcineurin inhibitors, antihistamines", "Systemic steroid only rarely"]}}, "icd": {"n": "Irritant contact dermatitis", "c": "disease", "pg": "", "g": "ecz", "sum": "Non-immunological skin damage, 80% of contact dermatitis, appears within hours in anyone. Sharply limited to the contact site, stinging or burning, no papules.", "rows": {"Cause": "Direct damage by soaps, detergents, acids, alkalis, solvents, plants, wool. Depends on concentration and skin barrier. Predisposing: atopy, low humidity, cold, occlusion. At risk: housekeeping, hairdressing, cleaning, medical staff, food handlers, painters, metalwork.", "Lesion": "Sharply demarcated erythema and edema at the contact site that does not spread. Vesicles, bullae, erosions or necrosis with strong acids or alkalis. No papules. Often linear or bizarre pattern.", "Key sign": "Stinging and burning within seconds to minutes. Onset within hours. Can occur in practically everyone. Hand eczema of housewives.", "Tests": "Clinical diagnosis. No sensitization, so patch test is not needed.", "Treatment": "Remove the irritant, gloves, barrier creams, wash at once with water. Acute: wet dressings with Burow solution every 2-3 hours, class I-II steroid. Severe: prednisone 60 mg tapering by 10 mg over 2 weeks. Change job if it persists."}, "bk": 1, "rb": {"Cause": ["Direct damage: soaps, detergents, acids, alkalis, solvents, plants, wool; depends on concentration and barrier", "Predisposing: atopy, low humidity, cold, occlusion", "At risk: housekeeping, hairdressing, cleaning, medical staff, food handlers, painters, metalwork"], "Lesion": ["Sharply demarcated erythema and edema at contact site; does not spread", "Strong acids or alkalis: vesicles, bullae, erosions, necrosis", "No papules; often linear or bizarre pattern"], "Key sign": ["Stinging and burning within seconds to minutes; onset within hours", "Can occur in practically everyone", "Hand eczema of housewives"], "Tests": ["Clinical diagnosis; no sensitization, so no patch test"], "Treatment": ["Remove irritant, gloves, barrier creams, wash at once with water", "Acute: Burow solution wet dressings every 2-3 hours, class I-II steroid", "Severe: prednisone 60 mg, taper by 10 mg over 2 weeks", "Change job if it persists"]}}, "acd": {"n": "Allergic contact dermatitis", "c": "disease", "pg": "", "g": "ecz", "sum": "Delayed type IV hypersensitivity (hapten, sensitized T cells). Appears 12-72 hours after re-exposure, itchy, papules, spreads beyond contact site. Diagnosed by patch test.", "rows": {"Cause": "Hapten-specific T-cell reaction in a sensitized person. Hapten binds a skin protein. Allergens: nickel, neomycin, balsam of Peru, fragrance mix, thimerosal, formaldehyde, paraphenylenediamine (dark dyes), rubber (thiuram, carba mix), cobalt, chromates (cement, leather), bacitracin, benzocaine, sulfonamides, poison ivy.", "Lesion": "Acute: erythema, edema, papules, vesicles, bullae, erosions, crusts. Chronic: lichenification, scaling, excoriation. Starts at the contact site (earlobe from earrings, wrist from watch, foot dorsum from shoes, neck from necklace, lips from lipstick), often linear, then may spread or generalize.", "Key sign": "Intense itch. Papules occur in ACD but not in ICD. Worse with every re-exposure. Onset 12-72 hours. Only in the sensitized.", "Tests": "Patch test: allergen on normal skin, positive = erythema and papules (maybe vesicles) at the test site. Wait at least 2 weeks after the dermatitis has cleared, test an uninvolved site. Histology: spongiosis.", "Treatment": "Find and avoid the allergen. Acute: wet dressings, topical steroid, systemic steroid if severe."}, "bk": 1, "rb": {"Cause": ["Hapten-specific T-cell reaction in a sensitized person; hapten binds a skin protein", "Allergens: nickel, neomycin, balsam of Peru, fragrance mix, thimerosal, formaldehyde, paraphenylenediamine (dark dyes), rubber (thiuram, carba mix), cobalt, chromates (cement, leather), bacitracin, benzocaine, sulfonamides, poison ivy"], "Lesion": ["Acute: erythema, edema, papules, vesicles, bullae, erosions, crusts", "Chronic: lichenification, scaling, excoriation", "Starts at contact site (earlobe/earrings, wrist/watch, foot dorsum/shoes, neck/necklace, lips/lipstick), often linear; may spread or generalize"], "Key sign": ["Intense itch", "Papules occur in ACD, not in ICD", "Worse with every re-exposure; onset 12-72 hours; only in sensitized"], "Tests": ["Patch test: allergen on normal skin; positive = erythema and papules (maybe vesicles)", "Wait at least 2 weeks after dermatitis clears; test an uninvolved site", "Histology: spongiosis"], "Treatment": ["Find and avoid the allergen", "Acute: wet dressings, topical steroid; systemic steroid if severe"]}}, "photo": {"n": "Photo contact dermatitis", "c": "disease", "pg": "", "g": "ecz", "sum": "Chemical plus UVA. Phototoxic: anyone, first exposure, exaggerated sunburn. Photoallergic: sensitized people only, eczema, 24-72 hours, photopatch test.", "rows": {"Cause": "Phototoxic (irritant): direct damage from chemical plus sunlight, immediate. Photoallergic: UV turns the chemical into a photoantigen (hapten), type IV T-cell reaction. UVA 315-400 nm. Agents: tar, furocoumarins (phototoxic); sunscreens, drugs, fragrances (photoallergic).", "Lesion": "Phototoxic: exaggerated sunburn, bullae, hyperpigmentation. Photoallergic: eczematous or vesiculobullous.", "Key sign": "Phototoxic: anyone, first exposure, minutes to days, no cross-reactivity. Photoallergic: only sensitized people, 24-72 hours, cross-reactivity possible.", "Tests": "Phototoxic: clinical, necrotic keratinocytes. Photoallergic: spongiosis, photopatch test.", "Treatment": "Avoid the chemical and sun exposure. CHECK: not confirmed."}, "bk": 1, "rb": {"Cause": ["Phototoxic (irritant): chemical + sunlight, immediate, direct damage", "Photoallergic: UV turns chemical into photoantigen (hapten), type IV T-cell reaction", "UVA 315-400 nm", "Agents: tar, furocoumarins (phototoxic); sunscreens, drugs, fragrances (photoallergic)"], "Lesion": ["Phototoxic: exaggerated sunburn, bullae, hyperpigmentation", "Photoallergic: eczematous or vesiculobullous"], "Key sign": ["Phototoxic: anyone, first exposure, minutes to days, no cross-reactivity", "Photoallergic: sensitized only, 24-72 hours, cross-reactivity possible"], "Tests": ["Phototoxic: clinical, necrotic keratinocytes", "Photoallergic: spongiosis, photopatch test"], "Treatment": ["Avoid the chemical and sun exposure", "CHECK: not confirmed"]}}, "infd": {"n": "Infective dermatitis, autosensitization and id reactions", "c": "disease", "pg": "", "g": "ecz", "sum": "Eczema from sensitization to microbes. Infective dermatitis appears at the infection site. Autosensitization and id reactions (dermatophytid, bacterid) appear at distant sites.", "rows": {"Cause": "Infective dermatitis: T-cell sensitization to microbial antigen at the primary infection, for example impetigo. Autosensitization: cytokines from a primary dermatitis make distant skin hypersensitive. Dermatophytid (fungus) and bacterid (bacteria): sensitized T cells reach a distant site.", "Lesion": "Infective: eczema around the primary infection. Autosensitization: symmetric scattered maculopapular or papulovesicular lesions on trunk, forearms, thighs, legs, for example from venous stasis dermatitis. Id of inflammatory tinea pedis: dyshidrosiform vesicles on hands and feet.", "Key sign": "Dermatophytid criteria: proven fungal focus, positive dermatophyte skin test, NO fungi in scrapings at the distant site, clears when the fungus is treated.", "Tests": "KOH of the distant lesion is negative. Scrape the primary site.", "Treatment": "Treat the primary infection (antibiotic or antifungal) and control the primary dermatitis."}, "bk": 1, "rb": {"Cause": ["Infective dermatitis: T-cell sensitization to microbial antigen at the primary infection (e.g. impetigo)", "Autosensitization: cytokines from a primary dermatitis make distant skin hypersensitive", "Dermatophytid (fungus), bacterid (bacteria): sensitized T cells reach a distant site"], "Lesion": ["Infective: eczema around the primary infection", "Autosensitization: symmetric scattered maculopapular or papulovesicular lesions on trunk, forearms, thighs, legs (e.g. from stasis dermatitis)", "Id of inflammatory tinea pedis: dyshidrosiform vesicles on hands and feet"], "Key sign": ["Dermatophytid criteria: proven fungal focus, positive dermatophyte skin test, NO fungi in scrapings at distant site, clears when fungus treated"], "Tests": ["KOH of distant lesion negative; scrape the primary site"], "Treatment": ["Treat the primary infection (antibiotic or antifungal) and control the primary dermatitis"]}}, "ad": {"n": "Atopic dermatitis", "c": "disease", "pg": "", "g": "ecz", "sum": "Chronic relapsing itchy eczema of atopic people. Barrier defect (filaggrin, low ceramides), IgE, S. aureus. Infants: face and extensors. Children: flexures. Emollients are the base of care.", "rows": {"Cause": "Filaggrin defect, low ceramides, high water loss, IgE reactivity, Th2. Triggers: dust mites, pollens, S. aureus superantigens, foods in infants (egg, milk, peanut, soy, fish, wheat), wool, stress, winter and cold, heavy sweating. Onset first 2 months, most by age 5, sometimes in adults. Slightly more males. Family history of AD, rhinitis, asthma.", "Lesion": "Acute: poorly defined red patches, papules, edema, erosions, crusts, oozing if infected. Chronic: lichenification, fissures. Infants: cheeks, extensor limbs, scalp. Age 2-12: flexures of knees and elbows, wrists, ankles, neck. Adults (under 10%): flexural lichenification.", "Key sign": "Itch is the hallmark (itch-scratch cycle). Major criteria (at least 3): pruritus, typical morphology and distribution, chronic relapsing course, personal or family atopy, early onset. Minor: xerosis, hand and foot dermatitis, pityriasis alba, nipple eczema, white dermographism, raised IgE, immediate skin reaction, skin infections, cataract. Signs: Dennie-Morgan fold, keratosis pilaris, palm hyperlinearity, eyebrow thinning, periorbital darkening. Pityriasis alba: hypopigmented ill-defined scaly patches on cheeks of dark-skinned children, clears in 2-3 months.", "Tests": "Clinical diagnosis. Complications: eczema herpeticum (commonest), eczema vaccinatum, warts, molluscum, S. aureus infection, T. rubrum infection.", "Treatment": "Emollients (main prophylaxis), mild soap, no wool, cotton clothes, short cool baths, avoid triggers. Breastfeeding, hydrolyzed formula. Acute: wet dressings, topical steroid, hydroxyzine, dicloxacillin or erythromycin if infected, mupirocin. Chronic: weakest steroid for the shortest time (weak on face, moderate up to 2 weeks), tacrolimus or pimecrolimus over 2 years (no atrophy, burning at first), narrow-band UVB or PUVA. Severe adult: cyclosporine 5 mg/kg for 3-6 months with BP and renal checks, azathioprine, mycophenolate, biologics. Avoid systemic steroid."}, "bk": 1, "rs": {"Cause": "Filaggrin defect, low ceramides, IgE, Th2. Onset first 2 months, most by age 5.", "Lesion": "Infants: cheeks, extensors. Age 2-12: flexures. Adults: flexural lichenification.", "Key sign": "Itch is the hallmark. Dennie-Morgan fold, keratosis pilaris, pityriasis alba.", "Tests": "Clinical diagnosis. Commonest complication: eczema herpeticum.", "Treatment": "Emollients first. Weakest steroid, shortest time. Tacrolimus; avoid systemic steroid."}, "rb": {"Cause": ["Filaggrin defect, low ceramides, high water loss, IgE reactivity, Th2", "Triggers: dust mites, pollens, S. aureus superantigens, infant foods (egg, milk, peanut, soy, fish, wheat), wool, stress, cold, sweating", "Onset first 2 months, most by age 5, sometimes adults; slightly more males", "Family history of AD, rhinitis, asthma"], "Lesion": ["Acute: poorly defined red patches, papules, edema, erosions, crusts; oozing if infected", "Chronic: lichenification, fissures", "Infants: cheeks, extensor limbs, scalp", "Age 2-12: flexures of knees and elbows, wrists, ankles, neck", "Adults (under 10%): flexural lichenification"], "Key sign": ["Itch is the hallmark (itch-scratch cycle)", "Major criteria (at least 3): pruritus, typical morphology and distribution, chronic relapsing course, personal or family atopy, early onset", "Minor: xerosis, hand and foot dermatitis, pityriasis alba, nipple eczema, white dermographism, raised IgE, immediate skin reaction, skin infections, cataract", "Signs: Dennie-Morgan fold, keratosis pilaris, palm hyperlinearity, eyebrow thinning, periorbital darkening", "Pityriasis alba: hypopigmented scaly patches on cheeks of dark-skinned children; clears in 2-3 months"], "Tests": ["Clinical diagnosis", "Complications: eczema herpeticum (commonest), eczema vaccinatum, warts, molluscum, S. aureus infection, T. rubrum infection"], "Treatment": ["Emollients (main prophylaxis); mild soap, cotton, no wool, short cool baths, avoid triggers; breastfeeding, hydrolyzed formula", "Acute: wet dressings, topical steroid, hydroxyzine; if infected dicloxacillin or erythromycin, mupirocin", "Chronic: weakest steroid for shortest time (weak on face, moderate up to 2 weeks)", "Tacrolimus or pimecrolimus over 2 years (no atrophy, burning at first); NB-UVB or PUVA", "Severe adult: cyclosporine 5 mg/kg for 3-6 months (BP, renal checks), azathioprine, mycophenolate, biologics", "Avoid systemic steroid"]}}, "ast": {"n": "Asteatotic eczema", "c": "disease", "pg": "", "g": "ecz", "sum": "Dry cracked eczema of the elderly legs in winter. Lost ceramides and skin lipids. Treat with emollients and weak steroid in urea base.", "rows": {"Cause": "Age 50-60 and over: lower ceramides, more water loss. Harsh cleansers, solvents, dry cold air, diuretics and lipid-lowering drugs.", "Lesion": "Legs, arms, hands. Dry slightly scaly skin, criss-cross marks, cracked finger pulps. On the legs deeper fissures and a red raised net pattern, then eczema.", "Key sign": "Worse in winter in the elderly.", "Tests": "Clinical.", "Treatment": "Humidify the room, avoid hot baths and harsh cleansers, bath oils or oatmeal, emollients daily (lanolin and paraffin), weak steroid, ideally in a urea base. Avoid wool."}, "bk": 1, "rb": {"Cause": ["Age 50-60 and over: lower ceramides, more water loss", "Harsh cleansers, solvents, dry cold air, diuretics, lipid-lowering drugs"], "Lesion": ["Legs, arms, hands: dry slightly scaly skin, criss-cross marks, cracked finger pulps", "Legs: deeper fissures, red raised net pattern, then eczema"], "Key sign": ["Worse in winter in the elderly"], "Tests": ["Clinical"], "Treatment": ["Humidify room; avoid hot baths and harsh cleansers; bath oils or oatmeal", "Daily emollients (lanolin, paraffin); weak steroid, ideally in a urea base; avoid wool"]}}, "num": {"n": "Nummular (discoid) eczema", "c": "disease", "pg": "", "g": "ecz", "sum": "Single or few coin-shaped plaques on the limbs of young adults, mostly atopic. Clears in 2-3 years.", "rows": {"Cause": "Unknown. Most patients are atopic.", "Lesion": "One or a few coin-shaped round plaques, mostly on the limbs. Young adults.", "Key sign": "Discoid plaques. Good prognosis.", "Tests": "Clinical.", "Treatment": "As for eczema: emollients and topical steroid. CHECK: not confirmed."}, "bk": 1, "rb": {"Cause": ["Unknown; most patients atopic"], "Lesion": ["One or few coin-shaped round plaques, mostly on limbs; young adults"], "Key sign": ["Discoid plaques; good prognosis"], "Tests": ["Clinical"], "Treatment": ["Emollients and topical steroid", "CHECK: not confirmed"]}}, "pomph": {"n": "Dyshidrotic eczema (pompholyx)", "c": "disease", "pg": "", "g": "ecz", "sum": "Sudden deep itchy tapioca-like vesicles on fingers, palms and soles. Recurrent. High-potency topical steroid, short oral prednisone if severe.", "rows": {"Cause": "Special vesicular type of hand and foot eczema.", "Lesion": "Sudden many deep-seated itchy clear tapioca-like vesicles on sides of fingers, palms, soles. Large bullae can occur. Later scaling, fissures, lichenification.", "Key sign": "Recurrent attacks are the rule. Pain when eroded. Hyperhidrosis often.", "Tests": "Look for secondary infection: pustules, cellulitis, lymphangitis, painful nodes.", "Treatment": "High-potency topical steroid, intralesional triamcinolone 3 mg/ml for small areas. Severe: short prednisone course (70 mg tapering by 10 or 5 mg over 7-14 days). Antibiotic for infection."}, "bk": 1, "rb": {"Cause": ["Vesicular type of hand and foot eczema"], "Lesion": ["Sudden, many deep itchy clear tapioca-like vesicles on sides of fingers, palms, soles; large bullae possible", "Later scaling, fissures, lichenification"], "Key sign": ["Recurrent attacks are the rule", "Painful when eroded; hyperhidrosis often"], "Tests": ["Look for secondary infection: pustules, cellulitis, lymphangitis, painful nodes"], "Treatment": ["High-potency topical steroid; intralesional triamcinolone 3 mg/ml for small areas", "Severe: prednisone 70 mg, taper by 10 or 5 mg over 7-14 days", "Antibiotic for infection"]}}, "grav": {"n": "Gravitational (stasis) eczema", "c": "disease", "pg": "", "g": "ecz", "sum": "Venous hypertension eczema of the inner lower legs in middle-aged men or elderly women. Edema, purpura, brown pigment, ulcer. Stockings and leg elevation.", "rows": {"Cause": "High venous pressure widens capillary pores, fibrinogen leaks and forms a pericapillary fibrin cuff that blocks oxygen diffusion.", "Lesion": "Inner lower legs. Edema, purpura, hemosiderin brown pigmentation, eczema, ulceration, atrophie blanche. Insidious onset.", "Key sign": "Middle-aged men or elderly women. Varicose veins.", "Tests": "Clinical.", "Treatment": "Supporting stockings and leg elevation are essential. Topical steroid for the eczema."}, "bk": 1, "rb": {"Cause": ["High venous pressure widens capillary pores; fibrinogen leaks, forms pericapillary fibrin cuff that blocks oxygen diffusion"], "Lesion": ["Inner lower legs: edema, purpura, hemosiderin pigmentation, eczema, ulceration, atrophie blanche; insidious onset"], "Key sign": ["Middle-aged men or elderly women; varicose veins"], "Tests": ["Clinical"], "Treatment": ["Support stockings and leg elevation are essential", "Topical steroid for the eczema"]}}, "lsc": {"n": "Lichen simplex and prurigo nodularis", "c": "disease", "pg": "", "g": "ecz", "sum": "Habit rubbing and scratching creates localized lichenification (lichen simplex) or firm itchy nodules (prurigo nodularis). Treatment: stop scratching, occlusion with steroid.", "rows": {"Cause": "Lichen simplex: habitual repetitive rubbing and scratching. Over 20 years old, women more. Prurigo nodularis: picking and excoriating, often a psychological problem, middle-aged women, three-quarters have past atopic eczema.", "Lesion": "Lichen simplex: circumscribed lichenified plaque, outer lower legs in men, back of the neck in women, can last decades. Prurigo nodularis: firm itchy nodules on extensor limbs.", "Key sign": "Lichenification is a feature of atopic dermatitis, localized or generalized.", "Tests": "Clinical.", "Treatment": "Lichen simplex: stop rubbing, night occlusive bandages, topical steroid or tar under occlusion, hydroxyzine or sedating antihistamine. Prurigo nodularis: intralesional triamcinolone, occlusive high-potency steroid, severe cases thalidomide 50-100 mg (check contraindications), gabapentin 300 mg three times a day."}, "bk": 1, "rb": {"Cause": ["Lichen simplex: habitual rubbing and scratching; over 20 years, women more", "Prurigo nodularis: picking, often psychological; middle-aged women; 75% past atopic eczema"], "Lesion": ["Lichen simplex: circumscribed lichenified plaque; outer lower legs in men, nape in women; can last decades", "Prurigo nodularis: firm itchy nodules on extensor limbs"], "Key sign": ["Lichenification is a feature of atopic dermatitis, localized or generalized"], "Tests": ["Clinical"], "Treatment": ["Lichen simplex: stop rubbing, night occlusive bandages, topical steroid or tar under occlusion, sedating antihistamine (hydroxyzine)", "Prurigo nodularis: intralesional triamcinolone, occlusive high-potency steroid; severe: thalidomide 50-100 mg (check contraindications), gabapentin 300 mg three times a day"]}}, "ang": {"n": "Angioedema", "c": "disease", "pg": "", "g": "urg", "sum": "Deep non-itchy swelling of lower dermis and subcutis, up to 72 hours. Histamine-mediated (with wheals) or bradykinin-mediated (C1 inhibitor deficiency, ACE inhibitors). Laryngeal swelling is an emergency.", "rows": {"Cause": "Histamine-mediated (with urticaria). Bradykinin-mediated (no wheals): hereditary C1 inhibitor deficiency, acquired C1 inhibitor deficiency (lymphoproliferative disease, autoantibodies), ACE inhibitors. Also NSAIDs, antibiotics.", "Lesion": "Sudden non-pitting, non-itchy ill-defined swelling of lower dermis and subcutis: face, hands, buttocks, genitals, bowel (pain, diarrhea), larynx. Pain rather than itch. Mucous membranes often involved.", "Key sign": "Resolves slower than wheals, up to 72 hours. Laryngeal angioedema with stridor is a medical emergency and the most serious complication.", "Tests": "Without wheals: C4, C1 esterase inhibitor level and function (low C4 in hereditary type).", "Treatment": "Severe: subcutaneous epinephrine 1:1000, airway monitoring, intubation or tracheostomy if no improvement. Moderate: monitor, diphenhydramine 50 mg IM or IV, hydrocortisone 200 mg to reduce relapse. Histamine type: antihistamine and steroid. Bradykinin type: plasma C1 inhibitor, ecallantide (kallikrein inhibitor), danazol, tranexamic acid. Prevention in chronic cases: plasma C1 inhibitor (before stress), danazol, tranexamic acid."}, "bk": 1, "rb": {"Cause": ["Histamine-mediated (with urticaria)", "Bradykinin-mediated (no wheals): hereditary C1 inhibitor deficiency, acquired C1 inhibitor deficiency (lymphoproliferative disease, autoantibodies), ACE inhibitors", "Also NSAIDs, antibiotics"], "Lesion": ["Sudden non-pitting, non-itchy, ill-defined swelling of lower dermis and subcutis: face, hands, buttocks, genitals, bowel (pain, diarrhea), larynx", "Pain rather than itch; mucous membranes often involved"], "Key sign": ["Resolves slower than wheals, up to 72 hours", "Laryngeal angioedema with stridor: medical emergency, most serious complication"], "Tests": ["Without wheals: C4, C1 esterase inhibitor level and function (low C4 in hereditary type)"], "Treatment": ["Severe: subcutaneous epinephrine 1:1000, airway monitoring, intubation or tracheostomy if no improvement", "Moderate: monitor; diphenhydramine 50 mg IM or IV; hydrocortisone 200 mg to reduce relapse", "Histamine type: antihistamine and steroid", "Bradykinin type: plasma C1 inhibitor, ecallantide (kallikrein inhibitor), danazol, tranexamic acid", "Chronic prevention: plasma C1 inhibitor (before stress), danazol, tranexamic acid"]}}, "hair": {"n": "Hair cycle and types of alopecia", "c": "disease", "pg": "", "g": "alo", "sum": "Hair cycles through anagen (growth), catagen (transition) and telogen (rest). It is the one organ that renews without scarring. Alopecia is scarring or non-scarring, localized or diffuse. Non-scarring androgenetic alopecia is commonest.", "rows": {"Cause": "Anagen: 85-90% of hairs, 2-7 years (3-4 typical), about 0.33 mm a day (1 cm in 28 days); eyelashes, eyebrows and limb hair 30-45 days. Catagen: 3%, 2-3 weeks, outer root sheath shrinks, club hair. Telogen: 10-15%, about 3 months, 50-100 hairs shed a day.", "Lesion": "Non-scarring localized: non-inflammatory tinea capitis, alopecia areata, traumatic (trichotillomania, traction), moth-eaten alopecia of secondary syphilis. Scarring: favus and kerion, tertiary syphilis (gumma), discoid lupus, morphea, deep infections (staph, zoster, leishmania, TB), lichen planopilaris, burns, radiation, acne keloidalis, trauma. Diffuse non-scarring: androgenetic, telogen effluvium, anagen effluvium, thyroid, pituitary, diabetes, HIV, nutritional, liver disease, post-partum, syphilis.", "Key sign": "Most common: non-scarring, especially androgenetic alopecia (onset before 40).", "Tests": "Hair pull test: 40-60 hairs, positive when 6 or more (over 10%) come out. Positive in telogen effluvium, anagen effluvium, androgenetic, active alopecia areata, scarring alopecia, loose anagen. Also trichogram, dermoscopy, biopsy.", "Treatment": "Treat the cause. See each type."}, "bk": 1, "rb": {"Cause": ["Anagen: 85-90% of hairs, 2-7 years (3-4 typical), about 0.33 mm/day (1 cm in 28 days); eyelashes, eyebrows, limb hair 30-45 days", "Catagen: 3%, 2-3 weeks, outer root sheath shrinks, club hair", "Telogen: 10-15%, about 3 months, 50-100 hairs shed a day"], "Lesion": ["Non-scarring localized: non-inflammatory tinea capitis, alopecia areata, traumatic (trichotillomania, traction), moth-eaten alopecia of secondary syphilis", "Scarring: favus, kerion, tertiary syphilis (gumma), discoid lupus, morphea, deep infections (staph, zoster, leishmania, TB), lichen planopilaris, burns, radiation, acne keloidalis, trauma", "Diffuse non-scarring: androgenetic, telogen effluvium, anagen effluvium, thyroid, pituitary, diabetes, HIV, nutritional, liver disease, post-partum, syphilis"], "Key sign": ["Commonest: non-scarring, especially androgenetic alopecia (onset before 40)"], "Tests": ["Pull test: 40-60 hairs, positive when 6 or more (over 10%) come out", "Positive in telogen effluvium, anagen effluvium, androgenetic, active alopecia areata, scarring alopecia, loose anagen", "Also trichogram, dermoscopy, biopsy"], "Treatment": ["Treat the cause (see each type)"]}}, "aga": {"n": "Androgenetic alopecia", "c": "disease", "pg": "", "g": "alo", "sum": "Genetic gradual miniaturization of terminal hairs, DHT driven. Men: receding hairline and vertex. Women: crown thinning, hairline kept. Minoxidil and finasteride.", "rows": {"Cause": "Genetic plus androgens, mainly DHT. 80% of men and 50% of women over a lifetime.", "Lesion": "Men: temporal recession and vertex thinning (Hamilton-Norwood scale). Women: diffuse crown thinning with a wide parting, frontal hairline kept (Ludwig scale). Terminal hairs become short wispy vellus hairs.", "Key sign": "Variation in hair shaft diameter, patterned distribution, positive pull test with short telogen hairs. Onset teens to early 30s. Early hair loss in a young man: think anabolic steroids.", "Tests": "Clinical, dermoscopy, pull test.", "Treatment": "Minoxidil 5% foam (twice daily men, once women): vasodilator via K-ATP channels, needed indefinitely, regrowth from 2 months. Finasteride 1 mg daily (type II 5-alpha-reductase inhibitor, men): sexual side effects, contraindicated in pregnancy. Anti-androgens in women with excess androgen: spironolactone, cyproterone acetate, flutamide. Hair transplant for severe cases."}, "bk": 1, "rb": {"Cause": ["Genetic + androgens (mainly DHT); 80% of men and 50% of women over a lifetime"], "Lesion": ["Men: temporal recession and vertex thinning (Hamilton-Norwood)", "Women: diffuse crown thinning, wide parting, frontal hairline kept (Ludwig)", "Terminal hairs become short wispy vellus hairs"], "Key sign": ["Variable hair shaft diameter, patterned distribution, positive pull test with short telogen hairs", "Onset teens to early 30s; early loss in a young man: think anabolic steroids"], "Tests": ["Clinical, dermoscopy, pull test"], "Treatment": ["Minoxidil 5% foam (twice daily men, once women): vasodilator via K-ATP channels; indefinite; regrowth from 2 months", "Finasteride 1 mg daily (type II 5-alpha-reductase inhibitor, men): sexual side effects, contraindicated in pregnancy", "Women with excess androgen: spironolactone, cyproterone acetate, flutamide", "Hair transplant for severe cases"]}}, "te": {"n": "Telogen and anagen effluvium", "c": "disease", "pg": "", "g": "alo", "sum": "Diffuse non-scarring shedding. Telogen effluvium: about 3 months after a trigger, self-limited. Anagen effluvium: sudden, from chemotherapy, toxins, radiation.", "rows": {"Cause": "Telogen: early shift of follicles from anagen to telogen. Triggers: stress, fever or illness (typhoid, malaria), pregnancy and post-partum, iron deficiency, thyroid disease, diets, drugs (anticoagulants, antifungals, anabolic steroids, NSAIDs), onset of androgenetic alopecia. Anagen: injury to follicles that stops mitosis: chemotherapy, toxins, radiation, lupus, syphilis; also alopecia areata and pemphigus vulgaris.", "Lesion": "Telogen: diffuse thinning, 3 months after the trigger, lasts about 6 months (acute under 6 months, chronic over). Anagen: sudden diffuse shedding over days of damaged hairs.", "Key sign": "Both non-scarring. Pull test positive in both.", "Tests": "History and examination. If indicated: CBC, urinalysis, ferritin, thyroid tests, ANA, zinc.", "Treatment": "Telogen: treat the cause, counseling, correct iron, zinc, protein deficiency, topical minoxidil. Anagen: topical minoxidil, scalp cooling during chemotherapy, eyebrow camouflage."}, "bk": 1, "rb": {"Cause": ["Telogen: early shift of follicles from anagen to telogen. Triggers: stress, fever or illness (typhoid, malaria), pregnancy and post-partum, iron deficiency, thyroid disease, diets, drugs (anticoagulants, antifungals, anabolic steroids, NSAIDs), onset of AGA", "Anagen: injury stopping mitosis: chemotherapy, toxins, radiation, lupus, syphilis; also alopecia areata, pemphigus vulgaris"], "Lesion": ["Telogen: diffuse thinning 3 months after trigger, lasts about 6 months (acute under 6 months, chronic over)", "Anagen: sudden diffuse shedding over days of damaged hairs"], "Key sign": ["Both non-scarring", "Pull test positive in both"], "Tests": ["History and examination; if indicated CBC, urinalysis, ferritin, thyroid tests, ANA, zinc"], "Treatment": ["Telogen: treat cause, counseling, correct iron, zinc, protein deficiency, topical minoxidil", "Anagen: topical minoxidil, scalp cooling during chemotherapy, eyebrow camouflage"]}}, "ttm": {"n": "Trichotillomania and traction alopecia", "c": "disease", "pg": "", "g": "alo", "sum": "Compulsive hair pulling (OCD spectrum) causing patchy non-scarring alopecia. Twisted broken hairs of different lengths, Friar Tuck sign. Treatment is behavioral.", "rows": {"Cause": "Part of OCD and anxiety disorders: persistent pulling of own hair. Females mostly; stress, boredom, family history. Traction alopecia: tight hairstyles such as a ponytail.", "Lesion": "Patchy non-scarring hair loss, scalp commonest then eyelashes and eyebrows. Twisted or broken hairs of varying length in a circular area, surrounded by normal hair. No skin inflammation. Corkscrew hair shafts.", "Key sign": "Friar Tuck sign. Hairs of different lengths in regrowth. Trichophagia can form a trichobezoar (anemia, abdominal pain, obstruction).", "Tests": "Dermoscopy: broken shafts, black dots, empty orifices, vellus hairs. DDx: alopecia areata, traction and androgenetic alopecia.", "Treatment": "Behavior therapy and psychotherapy, N-acetylcysteine, antidepressants in severe cases. Prognosis: excellent in young children, poor in adults."}, "bk": 1, "rb": {"Cause": ["Part of OCD and anxiety disorders: persistent pulling of own hair; mostly females; stress, boredom, family history", "Traction alopecia: tight hairstyles (ponytail)"], "Lesion": ["Patchy non-scarring loss; scalp commonest, then eyelashes, eyebrows", "Twisted or broken hairs of varying length in a circular area, surrounded by normal hair; no inflammation; corkscrew shafts"], "Key sign": ["Friar Tuck sign; hairs of different lengths in regrowth", "Trichophagia can form trichobezoar (anemia, abdominal pain, obstruction)"], "Tests": ["Dermoscopy: broken shafts, black dots, empty orifices, vellus hairs", "DDx: alopecia areata, traction and androgenetic alopecia"], "Treatment": ["Behavior therapy, psychotherapy, N-acetylcysteine; antidepressants in severe cases", "Prognosis: excellent in young children, poor in adults"]}}, "prp": {"n": "Pityriasis rubra pilaris", "c": "disease", "pg": "", "g": "paps", "sum": "CHECK: general reference, not in the lecture notes. Orange-red scaly plaques with islands of sparing, follicular papules and palmoplantar keratoderma. Six types. Starts on head and neck, mucosae spared. Type 6 is HIV-associated and responds to HAART.", "rows": {"Lesion": "Orange-red scaly plaques that merge, with islands of sparing (pale normal skin). Follicular keratotic papules (nutmeg-grater feel). Orange-yellow waxy keratoderma of palms and soles. Reddish-orange; brown in darker skin.", "Sites": "Starts on head and neck, spreads downward. Mucous membranes spared. Type 4 is localized (elbows, knees).", "Key sign": "Islands of sparing, follicular papules, palmoplantar keratoderma. Nails: subungual hyperkeratosis, splinter hemorrhages. Oil drop sign is psoriasis, not PRP.", "Types": "1 classic adult (generalized, can reach erythroderma). 2 atypical adult. 3 classic juvenile (clears within 2 years). 4 circumscribed juvenile (localized, no erythroderma). 5 atypical juvenile (first years of life, chronic). 6 HIV-associated (acne conglobata, hidradenitis, lichen spinulosus).", "Histology": "Alternating orthokeratosis and parakeratosis, prominent granular layer, acanthosis with broad short rete ridges, sparse perivascular lymphocytes. No band-like infiltrate.", "Trigger / link": "Cause unknown. Type 6 with HIV. Some familial cases (CARD14).", "Course": "Onset abrupt or gradual. Long course, socially and psychologically disabling. Type 5 chronic.", "Treatment": "Emollients, keratolytics, topical steroids. Systemic: acitretin or methotrexate. Type 6: HAART."}, "bk": 1, "rb": {"Lesion": ["Orange-red scaly plaques that merge, with islands of sparing (pale normal skin).", "Follicular keratotic papules (nutmeg-grater feel).", "Orange-yellow waxy keratoderma of palms and soles.", "Reddish-orange; brown in darker skin."], "Sites": ["Starts on head and neck, spreads downward.", "Mucous membranes spared.", "Type 4 is localized (elbows, knees)."], "Key sign": ["Islands of sparing, follicular papules, palmoplantar keratoderma.", "Nails: subungual hyperkeratosis, splinter hemorrhages.", "Oil drop sign is psoriasis, not PRP."], "Types": ["1 classic adult (generalized, can reach erythroderma).", "2 atypical adult.", "3 classic juvenile (clears within 2 years).", "4 circumscribed juvenile (localized, no erythroderma).", "5 atypical juvenile (first years of life, chronic).", "6 HIV-associated (acne conglobata, hidradenitis, lichen spinulosus)."], "Histology": ["Alternating orthokeratosis and parakeratosis, prominent granular layer, acanthosis with broad short rete ridges, sparse perivascular lymphocytes.", "No band-like infiltrate."], "Trigger / link": ["Cause unknown.", "Type 6 with HIV.", "Some familial cases (CARD14)."], "Course": ["Onset abrupt or gradual.", "Long course, socially and psychologically disabling.", "Type 5 chronic."], "Treatment": ["Emollients, keratolytics, topical steroids.", "Systemic: acitretin or cretions of untreated multibacillary patients.", "MB leprosy (WHO MDT): monthly supervised rifampicin and clofazimine, daily dapsone and clofazimine, for 12-18 months.", "Lepromatous histology: Grenz zone under the epidermis, diffuse sheets of foamy macrophages with no lymphocyte wall."], "bmisc": ["Over 80% of TEN is drug induced: allopurinol, antiepileptics, sulfonamides, NSAIDs.", "Widespread apoptosis gives full-thickness epidermal necrosis and a subepidermal split.", "IVIG has anti-Fas antibodies that block keratinocyte apoptosis. Best early in the acute phase."], "vmisc": ["Chickenpox spreads by respiratory droplets and airborne aerosols from the upper airway.", "Ramsay Hunt (zoster oticus): VZV reactivation in the geniculate ganglion. Vesicles on the auricle with ear pain and tinnitus.", "Chickenpox lesions are pleomorphic: macules, papules, vesicles and crusts together, in crops."], "imp": ["Honey-colored crust around the nose and mouth is impetigo.", "Bullous impetigo is S. aureus toxin. It cleaves desmoglein-1, so it can lead to SSSS.", "Impetigo heals without scar. Ecthyma heals with scar.", "Never use steroids or immunosuppressives in skin infections. Antibiotics only.", "Strep impetigo can cause glomerulonephritis 18-21 days later.", "Impetigo neonatorum: bullous, begins day 4-10, IV anti-staph antibiotic.", "Intact stratum corneum is the main skin defence."], "ecth": ["Ecthyma = adherent crust with a deep ulcer underneath.", "Ecthyma is the impetigo type that leaves a scar.", "Needs a systemic antibiotic covering strep and staph.", "Seen in diabetics, elderly, alcoholics, soldiers, poor hygiene."], "fur": ["Superficial folliculitis heals without scar. Deep folliculitis heals with scar.", "Carbuncle = coalescing furuncles, several pus openings, nape, older men.", "Pointing stage: refer for drainage. Before that: antibiotic.", "Carbuncle needs systemic antibiotic plus drainage.", "Avoid occlusive dressings.", "Carriers: nares, axillae, perineum. Also diabetes and obesity."], "cell": ["Erysipelas: sharp raised edge. Cellulitis: diffuse edge.", "Penicillin for 10 days.", "Recurrent: long-acting penicillin prophylaxis.", "Treat the interdigital tinea pedis that feeds recurrent leg erysipelas."], "eryth": ["Coral red under Wood light = erythrasma.", "Look-alikes: intertrigo, tinea cruris, pityriasis versicolor, candidiasis.", "Erythromycin 2 weeks is the most effective treatment.", "It is bacterial, but topical azoles still work."], "fgen": ["Dermatophytes make keratinase and invade skin, hair and nails.", "Moulds form hyphae. Yeasts form pseudohyphae.", "Terbinafine is fungicidal. Griseofulvin and itraconazole are fungistatic.", "Griseofulvin duration: capitis 6 wk, favus 8-9 wk, kerion 12-16 wk.", "Ketoconazole is hepatotoxic. Not used systemically.", "Tolnaftate is anti-dermatophyte only.", "Wood light screens. KOH shows hyphae. Culture on Sabouraud agar."], "tcap": ["Black dot: T. tonsurans, endothrix, no fluorescence.", "Gray patch: M. audouinii, ectothrix, hair breaks 2-3 mm above scalp.", "Kerion: boggy purulent scalp mass, M. canis or T. mentagrophytes, can scar.", "Rare after puberty because sebum becomes fungicidal.", "Nodes behind the ear and neck in tinea capitis.", "Griseofulvin 6 weeks. Kerion 12-16 weeks."], "favus": ["Scutulum = favus.", "Favus: T. schoenleinii, bluish-white Wood light.", "Mousy odor and cup-shaped yellow crust.", "Hyphae lie parallel to the hair axis with air spaces.", "Scarring alopecia if chronic.", "Griseofulvin 8-9 weeks."], "tcorp": ["Annular lesion with active scaly margin and central clearing.", "T. rubrum is the commonest cause.", "Griseofulvin can be used in tinea corporis.", "Zoophilic species cause more inflammatory lesions."], "tcr": ["Itchy brownish-red groin lesion with a sharp raised border.", "E. floccosum is the classic organism.", "Erythrasma has no raised edge and glows coral red.", "Treat tinea pedis too."], "tmp": ["Interdigital is the commonest type of tinea pedis.", "Moccasin type: diffuse hyperkeratosis, chronic, hard to cure.", "Vesicobullous type can come with a dermatophytid.", "Two feet one hand: tinea manuum is usually unilateral.", "Interdigital tinea pedis is the portal for recurrent leg erysipelas.", "Steroids worsen fungus but treat eczema. KOH first."], "onyx": ["T. rubrum is the commonest cause.", "Distal and lateral subungual is the commonest type.", "Endonyx: chalky white with lamellar splitting.", "Always confirm with KOH and culture before long treatment.", "Itraconazole pulse: 200 mg twice daily, 1 week on, 3 weeks off.", "Terbinafine 12 weeks for toenails."], "pv": ["Spaghetti and meatballs on KOH.", "Bright yellow Wood light fluorescence.", "Upper trunk and shoulders, fine branny scale.", "Hypopigmentation after treatment is normal. Malassezia makes azelaic acid, which inhibits melanin.", "Causes: heat, sweating, oily skin, steroids, pregnancy, immunodeficiency.", "2% ketoconazole shampoo for mild disease."], "ped": ["Nits stick to the hair shaft. Dandruff does not.", "Cervical and occipital nodes with itchy scalp: think lice.", "Vagabond disease: body lice, eczema, lichenification.", "Permethrin 1% first-line, repeat after 7-10 days.", "Pubic lice: shave, then treat."], "eczg": ["Spongiosis is the sign of acute eczema.", "Lichenification is the end stage of chronic eczema.", "Subacute eczema: decreased spongiosis, irregular acanthosis.", "Chronic: hyperkeratosis with parakeratosis, long rete ridges.", "Acute treatment: wet dressings plus topical steroid.", "Reduced filaggrin links eczema and ichthyosis vulgaris."], "icd": ["ICD is immediate and non-immunological. No prior sensitization needed.", "Bullous lesions can occur with strong irritants.", "No papules in ICD.", "Acute treatment: Burow wet dressings."], "acd": ["Type IV delayed hypersensitivity with sensitized T cells.", "Nickel is the common allergen. Thimerosal and neomycin in topical medicines.", "Patch test only after the skin is healed (2 weeks).", "ACD itches, ICD stings.", "Papules appear in ACD, not ICD.", "Spongiosis on histology."], "photo": ["Phototoxic is immediate. Photoallergic is delayed and needs sensitization.", "Photoallergic: photoantigen is a hapten formed by UV.", "Phototoxic histology: necrotic keratinocytes.", "Photopatch test for photoallergy."], "infd": ["Dermatophytid: no fungi at the distant site.", "Fungal infection gives dermatophytid. Bacterial gives bacterid.", "Infective dermatitis follows impetigo.", "Autosensitization: distant dermatitis from a primary one, for example venous stasis."], "ad": ["Pruritus is the hallmark. Eczema is the itch that rashes.", "Infants: face and extensors. Children: flexures.", "Dennie-Morgan fold and keratosis pilaris go with atopy.", "Eczema herpeticum is the commonest complication.", "Emollients are the main prophylaxis.", "Tacrolimus and pimecrolimus: over 2 years of age, no skin atrophy.", "Same gene defect (filaggrin) as ichthyosis vulgaris."], "ast": ["Elderly, winter, dry cracked legs: asteatotic eczema.", "Cause: falling ceramides and skin lipids with age.", "Weak steroid in a urea base plus emollients."], "num": ["Coin-shaped plaques = nummular eczema.", "Prognosis is good: clears in 2-3 years.", "Most patients are atopic."], "pomph": ["Tapioca-like deep vesicles on fingers = pompholyx.", "Recurrent attacks are the rule.", "Secondary infection can cause cellulitis and lymphangitis."], "grav": ["Brown pigment and edema on the inner lower leg.", "Cause: venous hypertension, fibrin cuff around capillaries.", "Treatment: compression stockings and elevation."], "sd": ["Greasy yellow-orange scale at sebaceous sites.", "Malassezia furfur plays a role.", "More frequent in Parkinson disease and HIV.", "2% ketoconazole shampoo for adult scalp disease.", "Infant forms: cradle cap, napkin area, Leiner disease.", "Severe disease: acitretin."], "lsc": ["Lichen simplex: neck in women, outer lower legs in men.", "Treatment: stop rubbing, occlusion plus steroid.", "Prurigo nodularis: firm itchy nodules on extensor limbs, middle-aged women.", "Prurigo nodularis: three-quarters have past atopic eczema."], "ang": ["Angioedema without wheals is bradykinin-mediated.", "ACE inhibitors (captopril) can cause angioedema.", "Most serious complication: laryngeal obstruction, treat with SC adrenaline.", "Plasma-derived C1 inhibitor for prevention.", "Hydrocortisone reduces relapse in moderate cases.", "Antifibrinolytic (tranexamic acid) can prevent attacks."], "hair": ["Anagen is about 85% and lasts years. Telogen is 10-15% and lasts about 3 months.", "Hair grows about 0.3 mm a day.", "Catagen: outer root sheath shrinks and forms the club hair.", "Moth-eaten alopecia = secondary syphilis.", "Scarring: discoid lupus, lichen planopilaris, favus, kerion, tertiary syphilis.", "Hair pull test positive: 6 or more hairs."], "aa": ["Exclamation mark hairs = alopecia areata.", "Bee-swarm lymphocytic infiltrate around anagen bulbs.", "Non-scarring. Nail pitting and trachyonychia.", "Ophiasis: temporo-occipital band. Sisaipho spares the sides.", "Intralesional steroid is first line for patches.", "JAK inhibitors: only FDA-approved treatment.", "Totalis = all scalp. Universalis = all body."], "aga": ["DHT is the active androgen in androgenetic alopecia.", "Minoxidil 5% is the drug of choice and must be continued.", "Finasteride: type II 5-alpha-reductase inhibitor, can lower libido.", "Women: crown thinning, frontal hairline kept. Spironolactone if hyperandrogenism.", "Early hair loss in a young man: ask about anabolic steroids."], "te": ["Telogen effluvium: diffuse shedding about 3 months after fever, delivery, stress or drugs.", "Anagen effluvium: chemotherapy, sudden, within weeks.", "Both are non-scarring.", "Telogen treatment: correct the cause, supplements, minoxidil."], "ttm": ["Twisted broken hairs of varying length, no inflammation: trichotillomania.", "Friar Tuck sign.", "Trichobezoar from swallowed hair.", "Tight ponytail causes n: NB-UVB.", "Methotrexate (LFT), cyclosporine (renal function), acitretin (lipids). Biologics: TNF inhibitors, ustekinumab (IL-12/23), secukinumab (IL-17).", "Worsen psoriasis: <span class=\"hot\">beta blockers</span>, ACE inhibitors, lithium, NSAIDs/aspirin, antimalarials, interferons, sulfa drugs, steroid withdrawal."]}];

 (CG=='paps'?`<div class="card" style="margin-top:14px"><h3>Quick differences</h3><ul class="core">
